apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gravitre.name" . }}-worker
  labels:
    {{- include "gravitre.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "gravitre.name" . }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "gravitre.name" . }}
        app.kubernetes.io/component: worker
    spec:
      containers:
        - name: worker
          image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
          envFrom:
            - secretRef:
                name: {{ .Values.secrets.existingSecret }}
          env:
            - name: REDIS_URL
              value: {{ .Values.env.redisUrl | quote }}
            - name: WORKFLOW_QUEUE_ENABLED
              value: {{ .Values.env.workflowQueueEnabled | quote }}
            - name: AGENT_JOB_WORKER_ENABLED
              value: {{ .Values.env.agentJobWorkerEnabled | quote }}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
