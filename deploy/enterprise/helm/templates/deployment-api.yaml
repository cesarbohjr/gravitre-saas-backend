apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gravitre.name" . }}-api
  labels:
    {{- include "gravitre.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "gravitre.name" . }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "gravitre.name" . }}
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.api.service.port }}
          envFrom:
            - secretRef:
                name: {{ .Values.secrets.existingSecret }}
          env:
            - name: REDIS_URL
              value: {{ .Values.env.redisUrl | quote }}
            - name: WORKFLOW_QUEUE_ENABLED
              value: {{ .Values.env.workflowQueueEnabled | quote }}
            - name: AGENT_JOB_WORKER_ENABLED
              value: {{ .Values.env.agentJobWorkerEnabled | quote }}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
