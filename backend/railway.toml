# Force Dockerfile builds so nested requirements-*.txt includes resolve.
# Railpack's default Python plan only copies requirements.txt into the install layer.
#
# Railway monorepo (gravitre-saas-backend):
#   Root Directory = backend
#   Config-as-Code path = /railway.toml  (file is backend/railway.toml in git)
#   If dashboard uses /backend/railway.toml instead, keep backend/backend/railway.toml shim.
#   dockerfilePath must stay "Dockerfile" — NOT backend/Dockerfile.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
# Limit auto-deploy to backend service files.
# IMPORTANT (2026-08-05): Railway GitHub status reported "No deployment needed -
# watched paths not modified" for commits that clearly changed backend/app/**
# when patterns were only `app/**`. Evaluate BOTH Root-Directory-relative and
# repo-root-relative globs; keep the stamp as an explicit force-deploy lever.
watchPatterns = [
  "app/**",
  "app/**/*.py",
  "backend/app/**",
  "backend/app/**/*.py",
  "requirements*.txt",
  "backend/requirements*.txt",
  "Dockerfile",
  "backend/Dockerfile",
  "railway.toml",
  "backend/railway.toml",
  "pyproject.toml",
  "backend/pyproject.toml",
  ".railway-deploy-stamp",
  "backend/.railway-deploy-stamp",
]

# Deploy gate: canvas Module C + meson edit path (2026-07-25).
[deploy]
healthcheckPath = "/health"
# Cold start loads SentenceTransformer + warms ~700 tool-doc embeddings.
# 2026-08-06: tip deploys built OK but healthcheck failed at 5m (service unavailable
# through all retries) — raise window so cold start can pass.
healthcheckTimeout = 600
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
# Must run via shell so ${PORT} expands (literal $PORT breaks uvicorn).
startCommand = "sh -c 'python -m uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8080}'"
