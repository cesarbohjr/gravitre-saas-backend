# Shim: when Root Directory is `backend`, a dashboard Config path of `/backend/railway.toml`
# resolves inside the service root (backend/backend/railway.toml). Canonical config is ../railway.toml.
# Prefer setting Config-as-Code to `/railway.toml` and removing this file.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["app/**", "requirements*.txt", "Dockerfile", "railway.toml", "pyproject.toml"]

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
startCommand = "sh -c 'python -m uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8080}'"
