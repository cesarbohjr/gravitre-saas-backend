[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gravitre-private-retrieval"
version = "0.1.0"
description = "Governed private aggregation of existing retrieval rankers"
requires-python = ">=3.12,<3.13"
dependencies = ["flwr==1.41.0", "python-dp==1.1.5"]

[tool.setuptools]
py-modules = ["entrypoint"]

[tool.flwr.app]
publisher = "gravitre"
fab-include = ["entrypoint.py"]

[tool.flwr.app.components]
serverapp = "entrypoint:server_app"
clientapp = "entrypoint:client_app"

[tool.flwr.app.config]
round-id = ""

# Operator supplies the signed/audited production federation address, root CA
# and authenticated SuperNode enrollment through a mounted configuration.
# No insecure/default public federation is supplied by the product.
