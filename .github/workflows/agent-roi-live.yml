name: Agent ROI live

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/verify-agent-roi-live.py"
      - ".github/workflows/agent-roi-live.yml"
      - "backend/app/services/agent_roi_service.py"
      - "backend/app/routers/enterprise.py"
      - "apps/web/components/enterprise/agent-roi-panel.tsx"

concurrency:
  group: agent-roi-live
  cancel-in-progress: false

jobs:
  verify:
    name: Live agent ROI honesty
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install httpx PyJWT python-dotenv supabase

      - name: Run live agent ROI probe
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          LIVE_API_BASE: https://api.gravitre.app
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ] || [ -z "${SUPABASE_JWT_SECRET:-}" ]; then
            echo "Missing Supabase secrets" >&2
            exit 1
          fi
          python3 scripts/verify-agent-roi-live.py

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-roi-live
          path: docs/delivery/agent-roi-live.json
          if-no-files-found: ignore
