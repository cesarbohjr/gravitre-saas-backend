name: Voice gates 2 and 3 execution
on:
  pull_request:
    paths:
      - 'backend/app/services/pipecat_voice/livekit_candidate.py'
      - 'backend/tests/services/pipecat_voice/test_livekit_write_fence.py'
      - '.github/workflows/voice-gates-2-3.yml'
      - 'scripts/bootstrap_voice_acceptance.py'
      - 'backend/app/services/spoken_write_approval.py'
      - 'backend/tests/scripts/test_voice_provider_roundtrip.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paired-runtime-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: acceptance
    env:
      SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_JWT_SECRET: ${{ secrets.E2E_SUPABASE_JWT_SECRET }}
      E2E_SUPABASE_ALLOWED_URL: ${{ vars.E2E_SUPABASE_ALLOWED_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ACCEPTANCE_ANTHROPIC_API_KEY || secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.ACCEPTANCE_OPENAI_API_KEY || secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify isolated runtime configuration (read-only, no production fallback)
        run: |
          python - <<'PY'
          import json, os, pathlib
          names = ('SUPABASE_URL', 'SUPABASE_ANON_KEY', 'SUPABASE_SERVICE_ROLE_KEY', 'SUPABASE_JWT_SECRET', 'E2E_SUPABASE_ALLOWED_URL')
          blockers = ['missing:' + name for name in names if not os.environ.get(name)]
          if not (os.environ.get('ANTHROPIC_API_KEY') or os.environ.get('OPENAI_API_KEY')):
              blockers.append('missing:ANTHROPIC_API_KEY_or_OPENAI_API_KEY')
          if os.environ.get('SUPABASE_URL') and (os.environ['SUPABASE_URL'].rstrip('/') != 'https://aadnwmjzrmbvadszroqt.supabase.co' or os.environ['SUPABASE_URL'].rstrip('/') != os.environ.get('E2E_SUPABASE_ALLOWED_URL', '').rstrip('/')):
              blockers.append('isolated_target_not_explicitly_allowlisted')
          result = {'status': 'NOT RUN' if blockers else 'CONFIGURATION_PRESENT', 'blockers': blockers,
                    'paired_inference': 'NOT RUN', 'live_action_certification': 'NOT RUN', 'certified': False}
          path = pathlib.Path('acceptance-results/paired-runtime-readiness.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(result, indent=2))
          print(json.dumps(result))
          if any(b != 'missing:ANTHROPIC_API_KEY_or_OPENAI_API_KEY' for b in blockers): raise SystemExit(2)
          PY
      - name: Install read-only smoke identity verifier
        run: python -m pip install 'supabase==2.33.0' 'PyJWT==2.15.1'
      - name: Verify target-pinning guards
        run: python -m unittest discover -s tests -p test_bootstrap_voice_acceptance.py
      - name: Provision authorized disposable acceptance tenant and actor
        run: python scripts/bootstrap_voice_acceptance.py
      - name: Verify flagged smoke actor and mint short-lived session
        run: python scripts/mint_smoke_org_session.py --github-env
      - name: Verify short-lived smoke token against Supabase Auth
        run: |
          python - <<'PY'
          import os
          from supabase import create_client
          client = create_client(os.environ['SUPABASE_URL'], os.environ['SUPABASE_SERVICE_ROLE_KEY'])
          user = client.auth.get_user(os.environ['PLATFORM_LIVE_BEARER_TOKEN']).user
          if not user or str(user.id) != os.environ['ISOLATED_CONVERSATION_TEST_USER_ID']:
              raise SystemExit('Smoke token identity verification failed')
          print('AUTHENTICATED_SMOKE_ACTOR_VERIFIED: Auth API identity matches isolated membership')
          PY
      - name: Authenticate and run bounded live Anthropic inference
        env:
          ACCEPTANCE_ANTHROPIC_API_KEY: ${{ secrets.ACCEPTANCE_ANTHROPIC_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, pathlib, time, urllib.request, urllib.error
          path = pathlib.Path('acceptance-results/anthropic-inference.json')
          result = {'status': 'NOT RUN', 'provider': 'anthropic', 'certified': False}
          key = os.environ.get('ACCEPTANCE_ANTHROPIC_API_KEY')
          if not key:
              result['blocker'] = 'missing:ACCEPTANCE_ANTHROPIC_API_KEY'
              path.write_text(json.dumps(result, indent=2))
              raise SystemExit('Dedicated acceptance Anthropic key unavailable to this job')
          print('Dedicated acceptance key available; value withheld')
          request = urllib.request.Request('https://api.anthropic.com/v1/messages',
              data=json.dumps({'model': 'claude-haiku-4-5-20251001', 'max_tokens': 16,
                               'messages': [{'role': 'user', 'content': 'Reply with exactly ACCEPTANCE_OK.'}]}).encode(),
              headers={'x-api-key': key, 'anthropic-version': '2023-06-01', 'content-type': 'application/json'})
          start = time.monotonic()
          try:
              with urllib.request.urlopen(request, timeout=45) as response:
                  payload = json.load(response)
                  answer = ''.join(x.get('text', '') for x in payload.get('content', []) if x.get('type') == 'text').strip()
                  result.update(status='PASS' if answer == 'ACCEPTANCE_OK' else 'FAIL',
                                http_status=response.status, elapsed_ms=round((time.monotonic()-start)*1000, 2),
                                model=payload.get('model'), usage=payload.get('usage'), exact_response=answer == 'ACCEPTANCE_OK')
          except urllib.error.HTTPError as error:
              result.update(status='FAIL', http_status=error.code)
          except Exception as error:
              result.update(status='FAIL', error_type=type(error).__name__)
          path.write_text(json.dumps(result, indent=2))
          print(json.dumps(result))
          if result['status'] != 'PASS': raise SystemExit(2)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paired-runtime-readiness
          path: |
            acceptance-results/paired-runtime-readiness.json
            acceptance-results/smoke-fixture.json
            acceptance-results/anthropic-inference.json
  live-provider:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: acceptance
    env:
      APP_ENV: dev
      DEEPGRAM_API_KEY: ${{ secrets.ACCEPTANCE_DEEPGRAM_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ACCEPTANCE_ELEVENLABS_API_KEY }}
      ELEVENLABS_VOICE_ID: ${{ vars.ACCEPTANCE_ELEVENLABS_VOICE_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check dedicated provider credentials without disclosing values
        run: |
          python - <<'PY'
          import json, os, pathlib
          missing = [name for name in ('DEEPGRAM_API_KEY', 'ELEVENLABS_API_KEY') if not os.environ.get(name)]
          if missing:
              p = pathlib.Path('acceptance-results/provider-roundtrip.json')
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(json.dumps({'status': 'NOT RUN', 'blockers': ['missing:' + n for n in missing], 'certified': False}))
              print('Live provider NOT RUN: missing dedicated acceptance credentials: ' + ', '.join(missing))
              raise SystemExit(2)
          print('Dedicated provider credentials present; values withheld')
          PY
      - name: Install existing provider runner dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Execute bounded real-provider audio and final write-gate acceptance
        run: python scripts/verify-voice-provider-roundtrip.py --output acceptance-results/provider-roundtrip.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice-live-provider-boundaries
          path: acceptance-results/provider-roundtrip.json
  governed-actions:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend and RTC test dependencies
        run: python -m pip install -r backend/requirements-dev.txt 'livekit==1.2.0'
      - name: Require RTC SDK
        run: python -c 'from livekit import rtc'
      - name: Exercise canonical voice write boundaries and RTC stop wiring
        working-directory: backend
        run: >-
          python -m pytest -q -p tests.offline_network_guard
          tests/scripts/test_voice_provider_roundtrip.py
          tests/services/pipecat_voice/test_livekit_write_fence.py
          tests/services/pipecat_voice/test_phase3_provider_commit_gate.py
          tests/services/pipecat_voice/test_turn_scoped_cancellation.py
          tests/services/pipecat_voice/test_reconnect_and_approval_contract.py
          tests/services/pipecat_voice/test_confirmation_hold.py
          --junitxml=voice-governance.xml
        env:
          OPENAI_API_KEY: fake-offline-governance
          ANTHROPIC_API_KEY: fake-offline-governance
          GEMINI_API_KEY: fake-offline-governance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice-governed-boundaries
          path: backend/voice-governance.xml
