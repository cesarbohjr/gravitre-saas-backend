name: Catalog enrichment NL-variance

# Standing accuracy bar for enriched semantic tool retrieval (Part 4).
on:
  schedule:
    - cron: "30 7 * * 1"  # Weekly Monday 07:30 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/app/connectors/action_catalog/**"
      - "backend/app/services/unified_turn_tool_retrieval.py"
      - "backend/app/rag/tool_retrieval_embedding.py"
      - "scripts/probe-catalog-enrichment-nl-variance.py"
      - "scripts/generate-action-retrieval-enrichment.py"

concurrency:
  group: catalog-enrichment-nl-variance
  cancel-in-progress: false

jobs:
  enrichment-probe:
    name: Catalog enrichment NL-variance probe
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Schema lint (examples + tags coverage)
        working-directory: backend
        run: python -m pytest tests/connectors/test_action_schema_standard_lint.py -q
        env:
          APP_ENV: dev
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_ANON_KEY: anon-test
          SUPABASE_SERVICE_ROLE_KEY: service-role-test
          SUPABASE_JWT_SECRET: jwt-secret-test
          OPENAI_API_KEY: sk-test-openai

      - name: Full NL-variance + latency probe
        env:
          APP_ENV: dev
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GRAVITRE_ACTION_ENRICHMENT_ENABLED: "true"
        run: python scripts/probe-catalog-enrichment-nl-variance.py

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-enrichment-nl-variance
          path: docs/delivery/catalog-enrichment-nl-variance-live.json
          if-no-files-found: ignore
