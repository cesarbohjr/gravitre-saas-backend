name: MSP isolated database security

on:
  push:
    branches:
      - feature/msp-tenant-isolation-policy-20261017
  workflow_dispatch:

jobs:
  msp-database-security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install database test dependencies
        run: python -m pip install pytest 'psycopg[binary]'
      - name: Start disposable local Supabase and apply migrations
        run: |
          supabase start
          supabase db reset --local
      - name: Run real PostgreSQL security tests
        env:
          MSP_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          python -m pytest -q backend/tests/integration/test_msp_database_security.py -rs
      - name: Stop disposable database
        if: always()
        run: supabase stop --no-backup || true
