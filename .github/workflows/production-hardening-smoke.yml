name: Production Hardening Smoke

# Lane D — nightly production verification (read-only API smokes).
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual trigger"
        required: false

concurrency:
  group: production-hardening-smoke
  cancel-in-progress: false

jobs:
  hardening-smoke:
    name: Lane D production API verification
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so research-cascade deploy_sha ancestry checks work.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Verify marketplace catalog seed (STA-229)
        run: python -m pytest tests/marketplace/test_marketplace_seed_catalog.py::test_catalog_asset_counts -q
        working-directory: backend
        env:
          APP_ENV: dev
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_ANON_KEY: anon-test
          SUPABASE_SERVICE_ROLE_KEY: service-role-test
          SUPABASE_JWT_SECRET: jwt-secret-test
          OPENAI_API_KEY: sk-test-openai

      # Drop the committed sample reports so a probe that crashes before writing
      # its own JSON shows up as missing, never as a stale PASS.
      - name: Remove stale smoke reports
        run: |
          rm -f docs/delivery/smoke-marketplace-production-latest.json \
            docs/delivery/smoke-ai-production-latest.json \
            docs/delivery/smoke-research-cascade-prod-latest.json \
            docs/delivery/link-check-production-latest.json

      # Each probe writes its own artifact; later steps must still run when one
      # probe fails so the summary is not PARTIAL on stale checkout JSON.
      - name: Run post-Tier 5 production smoke
        id: post_tier5
        continue-on-error: true
        env:
          BACKEND_URL: https://gravitre-saas-backend-production.up.railway.app
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
        run: python scripts/smoke-post-tier5-platform.py

      - name: Run marketplace production smoke
        id: marketplace
        continue-on-error: true
        env:
          BACKEND_URL: https://gravitre-saas-backend-production.up.railway.app
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
        run: |
          python scripts/smoke-marketplace-production.py \
            --json docs/delivery/smoke-marketplace-production-latest.json

      - name: Run AI production smoke report
        id: ai_smoke
        continue-on-error: true
        env:
          BACKEND_URL: https://gravitre-saas-backend-production.up.railway.app
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
        run: python scripts/smoke-ai-production.py --json docs/delivery/smoke-ai-production-latest.json

      - name: Run research cascade production smoke (Phases 1–6)
        id: research
        continue-on-error: true
        env:
          BACKEND_URL: https://gravitre-saas-backend-production.up.railway.app
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
        run: |
          python scripts/smoke-research-cascade-prod.py \
            --json docs/delivery/smoke-research-cascade-prod-latest.json

      - name: Check deployed marketing/app links (gravitre.app)
        id: link_check
        continue-on-error: true
        run: |
          python scripts/check-deployed-links.py \
            --base-url https://gravitre.app \
            --json docs/delivery/link-check-production-latest.json

      - name: Upload smoke reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-hardening-reports
          path: |
            docs/delivery/smoke-marketplace-production-latest.json
            docs/delivery/smoke-ai-production-latest.json
            docs/delivery/smoke-research-cascade-prod-latest.json
            docs/delivery/link-check-production-latest.json
          if-no-files-found: ignore

      - name: Write hardening smoke platform signal
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PROBE_OUTCOME_POST_TIER5: ${{ steps.post_tier5.outcome }}
          PROBE_OUTCOME_MARKETPLACE: ${{ steps.marketplace.outcome }}
          PROBE_OUTCOME_AI_SMOKE: ${{ steps.ai_smoke.outcome }}
          PROBE_OUTCOME_RESEARCH: ${{ steps.research.outcome }}
          PROBE_OUTCOME_LINK_CHECK: ${{ steps.link_check.outcome }}
        run: python scripts/smoke-hardening-summary-live.py

      # continue-on-error above keeps later probes running; this makes the run red
      # when any probe failed, so the workflow can never report PASS over a failure.
      - name: Fail when any probe failed
        if: always()
        env:
          POST_TIER5: ${{ steps.post_tier5.outcome }}
          MARKETPLACE: ${{ steps.marketplace.outcome }}
          AI_SMOKE: ${{ steps.ai_smoke.outcome }}
          RESEARCH: ${{ steps.research.outcome }}
          LINK_CHECK: ${{ steps.link_check.outcome }}
        run: |
          failed=0
          for name in POST_TIER5 MARKETPLACE AI_SMOKE RESEARCH LINK_CHECK; do
            outcome="${!name}"
            echo "$name=$outcome"
            if [ "$outcome" != "success" ]; then
              echo "::error::$name probe outcome: $outcome"
              failed=1
            fi
          done
          exit $failed
