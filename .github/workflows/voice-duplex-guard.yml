name: Voice duplex browser guard

# Standing regression guard for live voice on chat surfaces, on both transports:
# - HTTP duplex (legacy), with the Deepgram socket and /api/voice fetches mocked.
# - Pipecat (production), where the browser talks to a local server running the
#   production pipeline builder with scripted STT/TTS/LLM and an in-memory
#   Supabase (backend/tests/e2e/pipecat_voice_harness_server.py). Auth, the
#   production router and the real vendors are not exercised.
# Mutation-proven: removing every AudioContext resume in the hook and
# voice-playback-unlock fails both tests (no PCM reaches the socket).
#
# Run on voice-affecting pull requests as well as the standing daily schedule.
# A voice regression must be visible before merge, not discovered by tomorrow's cron.
on:
  pull_request:
    paths:
      - "apps/web/hooks/use-voice-duplex-session.ts"
      - "apps/web/lib/voice-*.ts"
      - "apps/web/public/voice-worklets/**"
      - "apps/web/scripts/voice-playback-continuity/**"
      - "apps/web/__tests__/lib/voice-audio-dsp.test.ts"
      - "apps/web/lib/pipecat-voice-client.ts"
      - "apps/web/app/e2e/voice-duplex/**"
      - "apps/web/app/api/voice/**"
      - "apps/web/lib/auth-context.tsx"
      - "backend/app/services/pipecat_voice/**"
      - "backend/tests/e2e/pipecat_voice_harness_server.py"
      - "backend/tests/support/fake_supabase.py"
      - "e2e/voice-duplex-browser.spec.ts"
      - "playwright.voice.config.ts"
      - ".github/workflows/voice-duplex-guard.yml"
  schedule:
    - cron: "0 7 * * *" # Daily 07:00 UTC
  workflow_dispatch:
    inputs:
      live_candidate:
        description: "Optional isolated ElevenLabs candidate ID (blank = synthetic only)"
        type: string
        required: false
      live_model:
        description: "Isolated candidate synthesis model"
        type: choice
        options: [eleven_v3, eleven_flash_v2_5]
        default: eleven_v3

concurrency:
  group: voice-duplex-guard
  cancel-in-progress: false

jobs:
  voice-duplex:
    name: Voice duplex capture guard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reclaim unused runner toolchains before Python installation
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install backend dependencies (Pipecat harness server)
        env:
          PIP_NO_CACHE_DIR: "1"
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt
          df -h /

      - name: Install root + web dependencies
        run: |
          npm install
          cd apps/web && pnpm install --frozen-lockfile

      - name: Verify local cancellation candidate remains shadow-only
        working-directory: apps/web
        run: pnpm exec vitest run __tests__/voice-local-cancel-candidate.test.ts __tests__/voice-local-cancel-shadow-probe.test.ts

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify PCM queue regression contracts
        working-directory: apps/web
        run: pnpm exec vitest run __tests__/lib/voice-audio-dsp.test.ts

      - name: Enforce synthetic playback continuity
        working-directory: apps/web
        run: node scripts/voice-playback-continuity/run.mjs --quick --enforce --out ../../voice-continuity-results.json

      - name: Run voice duplex guard
        if: ${{ !cancelled() }}
        run: npx playwright test --config=playwright.voice.config.ts
        env:
          CI: "true"
          PLAYWRIGHT_BASE_URL: http://localhost:3021
          NEXT_PUBLIC_PLAYWRIGHT_E2E: "1"
          PLAYWRIGHT_E2E: "1"
          PIPECAT_HARNESS_URL: http://127.0.0.1:8799
          PIPECAT_HARNESS_PYTHON: python
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voice-duplex-guard-artifacts
          if-no-files-found: ignore
          retention-days: 14
          path: |
            test-results/
            playwright-report/
            voice-continuity-results.json

  live-candidate-browser:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.live_candidate != '' }}
    runs-on: ubuntu-latest
    environment: acceptance
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated harness dependencies
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/hostedtoolcache/CodeQL
          python -m pip install --no-cache-dir -r backend/requirements.txt
          npm install
          cd apps/web && pnpm install --frozen-lockfile
      - run: npx playwright install --with-deps chromium
      - name: Verify actual candidate browser journey
        env:
          CI: "true"
          VOICE_BROWSER_LIVE_PROVIDER: "1"
          VOICE_BROWSER_ACCEPTANCE_KEY: ${{ secrets.ACCEPTANCE_ELEVENLABS_API_KEY }}
          VOICE_BROWSER_CANDIDATE_ID: ${{ inputs.live_candidate }}
          VOICE_BROWSER_MODEL: ${{ inputs.live_model }}
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_ANON_KEY: anon-test
          SUPABASE_SERVICE_ROLE_KEY: service-role-test
          SUPABASE_JWT_SECRET: jwt-secret-test
          OPENAI_API_KEY: sk-test-openai
          NEXT_PUBLIC_SUPABASE_URL: https://test.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: anon-test
        run: npx playwright test --config=playwright.voice.config.ts --grep "live provider: browser PCM"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-candidate-browser-${{ github.sha }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
