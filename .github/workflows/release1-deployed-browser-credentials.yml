name: Release 1 deployed browser credential verification

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release1-deployed-browser-credentials.yml"
      - "scripts/verify-release1-deployed-browser-credentials.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-runtime:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify deployed browser scripts against secret
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/verify-release1-deployed-browser-credentials.py
      - name: Upload safe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release1-deployed-browser-credential-evidence
          path: docs/delivery/release1-deployed-browser-credentials.json
          if-no-files-found: ignore
