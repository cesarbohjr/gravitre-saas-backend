name: ECO-002 targeted routing timing tests
on:
  push:
    branches:
      - feat/eco-002-routing-latency
  pull_request:
    paths:
      - 'backend/app/services/router_stage_timing.py'
      - 'backend/app/services/intelligence_router.py'
      - 'backend/tests/master_qa/test_eco002_router_stage_timing.py'
      - 'backend/scripts/eco002_stage_latency_report.py'
      - 'backend/scripts/eco002_router_method_harness.py'
      - 'backend/tests/master_qa/test_eco002_stage_latency_report.py'
      - '.github/workflows/eco-002-targeted.yml'
jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated test dependencies
        run: python -m pip install pytest pytest-asyncio
      - name: Run ECO-002 targeted tests
        run: PYTHONPATH=backend python -m pytest --noconftest -q backend/tests/master_qa/test_eco002_router_stage_timing.py backend/tests/master_qa/test_eco002_stage_latency_report.py
      - name: Measure CI instrumentation overhead (not actual routing latency)
        run: PYTHONPATH=backend python backend/scripts/eco002_timer_overhead_benchmark.py
      - name: Compile modified production modules
        run: python -m py_compile backend/app/services/router_stage_timing.py backend/app/services/intelligence_router.py
      - name: Execute 100 actual route-method fixture requests per scenario
        run: |
          PYTHONPATH=backend python backend/scripts/eco002_router_method_harness.py --samples 100 > /tmp/eco002-route.log 2>&1
          python backend/scripts/eco002_stage_latency_report.py /tmp/eco002-route.log > /tmp/eco002-route-report.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/eco002-route-report.json'))
          assert data['correlated_trace_count'] == 300, data['correlated_trace_count']
          assert data['sample_count'] >= 2000, data['sample_count']
          print(json.dumps({'sample_count':data['sample_count'],'correlated_trace_count':data['correlated_trace_count'],'ranked_by_stage_p95':data['ranked_by_stage_p95'],'ranked_observed_stage_share':data['ranked_observed_stage_share']}, indent=2))
          PY
      - name: Execute delayed fixture benchmark with governed action and wall-clock measurements
        run: |
          PYTHONPATH=backend python backend/scripts/eco002_router_method_harness.py --samples 100 --realistic > /tmp/eco002-delayed-route.log 2>&1
          python backend/scripts/eco002_stage_latency_report.py /tmp/eco002-delayed-route.log > /tmp/eco002-delayed-report.json
          python - <<'PY'
          import json, re
          data=json.load(open('/tmp/eco002-delayed-report.json'))
          lines=open('/tmp/eco002-delayed-route.log').readlines()
          walls=[line for line in lines if 'eco002_request_wall ' in line]
          assert data['correlated_trace_count']==300, data['correlated_trace_count']
          assert len(walls)==300, len(walls)
          assert sum('scenario=governed_action' in line for line in walls)==100
          import statistics
          by_scenario={}
          for line in walls:
              match=re.search(r'eco002_request_wall scenario=(\w+) sample=([\w-]+) duration_ms=([0-9.]+)',line)
              assert match, line
              scenario, sample, duration=match.groups()
              by_scenario.setdefault(scenario,[]).append(float(duration))
          def percentile(values, pct):
              ordered=sorted(values)
              return round(ordered[max(0, int((len(ordered)-1)*pct))],3)
          wall_summary={name:{'count':len(values),'p50_ms':percentile(values,.50),'p95_ms':percentile(values,.95)} for name,values in by_scenario.items()}
          assert set(wall_summary)=={'clarification','knowledge','governed_action'}, wall_summary
          assert all(v['count']==100 for v in wall_summary.values()), wall_summary
          with open('/tmp/eco002-wall-summary.json','w') as output:
              json.dump(wall_summary,output,indent=2)
          print(json.dumps({'correlated_trace_count':data['correlated_trace_count'],'wall_clock_samples':len(walls),'wall_summary':wall_summary,'stage_rankings':data['ranked_by_stage_p95']}, indent=2))
          PY
      - name: Upload offline router timing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eco002-offline-route-timings
          path: |
            /tmp/eco002-route.log
            /tmp/eco002-route-report.json
            /tmp/eco002-delayed-route.log
            /tmp/eco002-delayed-report.json
            /tmp/eco002-wall-summary.json
          if-no-files-found: ignore
