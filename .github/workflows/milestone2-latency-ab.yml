name: Milestone 2 Latency A/B

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual trigger (pre/post RM latency guardrail)"
        required: false
        default: "milestone2-latency-ab"
  push:
    branches: [main]
    paths:
      - ".github/milestone2-latency-ab-run.trigger"

concurrency:
  group: milestone2-latency-ab
  cancel-in-progress: false

jobs:
  latency-ab:
    name: Pre/post Research Manager latency A/B on prod
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run full latency A/B (brief pre-RM rollback + restore tip)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          BACKEND_URL: https://gravitre-saas-backend-production.up.railway.app
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          OAUTH_SMOKE_ORG_ID: ${{ secrets.OAUTH_SMOKE_ORG_ID }}
        run: |
          python3 scripts/smoke-milestone2-latency-ab.py \
            --full-ab \
            --json docs/delivery/milestone2-latency-ab-latest.json

      - name: Re-run Milestone 2 audit with latency baseline attached
        if: always()
        env:
          BACKEND_URL: https://gravitre-saas-backend-production.up.railway.app
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          OAUTH_SMOKE_ORG_ID: ${{ secrets.OAUTH_SMOKE_ORG_ID }}
        run: |
          PRE=$(python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("docs/delivery/milestone2-latency-ab-latest.json")
          if not p.is_file():
              print("")
              raise SystemExit(0)
          data = json.loads(p.read_text())
          pre = (data.get("phases") or {}).get("probe_pre_rm") or {}
          out = Path("docs/delivery/milestone2-latency-pre-rm-probe.json")
          out.write_text(json.dumps(pre, indent=2) + "\n")
          print(str(out))
          PY
          )
          EXTRA=""
          if [ -n "$PRE" ] && [ -f "$PRE" ]; then
            EXTRA="--latency-baseline $PRE"
          fi
          python3 scripts/smoke-milestone2-performance-audit.py \
            $EXTRA \
            --json docs/delivery/milestone2-performance-audit-latest.json

      - name: Upload latency A/B artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milestone2-latency-ab
          path: |
            docs/delivery/milestone2-latency-ab-latest.json
            docs/delivery/milestone2-latency-pre-rm-probe.json
            docs/delivery/milestone2-performance-audit-latest.json
          if-no-files-found: ignore
