  source_outcomes:
    name: Record independent source workflow outcomes
    if: ${{ always() && needs.dispatch_contract.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions: {}
    needs:
    - upstream_contract
    - dispatch_contract
    - autonomous_write_certification__independent-ledger-and-receiver
    - connector_governance__connector-governance
    - connector_verified_writes_live__verified-writes-live
    - outcome_ownership_contract__outcome-ownership
    - pr605_cross_surface_ownership__bounded-source-inventory
    - pr605_run_status_contract__certify-v2-run-status
    - pr605_runtime_edge_contract__privacy-contract
    - release1_execution_revocation_audit__browser-credential-source
    - release1_execution_revocation_audit__execution-and-revocation
    - release1_live_approval_denial__forged-approval
    steps:
    - name: Bind source outcomes to this run
      shell: python
      run: "import json, os\nsources = json.loads(os.environ['SOURCE_JOBS'])\nneeds = json.loads(os.environ['JOB_RESULTS'])\n\
        selected = json.loads(os.environ['SELECTED'])\noutcomes = {}\nfor name, source in sources.items():\n    if name not\
        \ in selected:\n        continue\n    results = [needs[key]['result'] for key in source['jobs']]\n    outcome = ('failure'\
        \ if 'failure' in results else 'cancelled' if 'cancelled' in results\n               else 'success' if 'success' in\
        \ results else 'skipped')\n    outcomes[source['display_name']] = outcome\nevidence = {'run_id': int(os.environ['GITHUB_RUN_ID']),\
        \ 'head_sha': os.environ['GITHUB_SHA'],\n            'source_outcomes': outcomes}\nwith open('canonical-workflow-outcomes.json',\
        \ 'w') as output:\n    json.dump(evidence, output)\n"
      env:
        SOURCE_JOBS: '{"autonomous-write-certification": {"display_name": "Autonomous write independent-process certification",
          "jobs": ["autonomous_write_certification__independent-ledger-and-receiver"]}, "connector-governance": {"display_name":
          "Master QA | QA20 Connector Governance", "jobs": ["connector_governance__connector-governance"]}, "connector-verified-writes-live":
          {"display_name": "Connector Verified Writes Live", "jobs": ["connector_verified_writes_live__verified-writes-live"]},
          "outcome-ownership-contract": {"display_name": "Master QA | QA10-QA20 Durable Outcome Ownership", "jobs": ["outcome_ownership_contract__outcome-ownership"]},
          "pr605-cross-surface-ownership": {"display_name": "PR605 cross-surface ownership evidence", "jobs": ["pr605_cross_surface_ownership__bounded-source-inventory"]},
          "pr605-run-status-contract": {"display_name": "PR605 run status contract certification", "jobs": ["pr605_run_status_contract__certify-v2-run-status"]},
          "pr605-runtime-edge-contract": {"display_name": "PR605 privacy-safe runtime edge contract", "jobs": ["pr605_runtime_edge_contract__privacy-contract"]},
          "release1-execution-revocation-audit": {"display_name": "Release 1 execution revocation credential contracts", "jobs":
          ["release1_execution_revocation_audit__browser-credential-source", "release1_execution_revocation_audit__execution-and-revocation"]},
          "release1-live-approval-denial": {"display_name": "Release 1 forged approval live write-denial", "jobs": ["release1_live_approval_denial__forged-approval"]}}'
        JOB_RESULTS: '{"autonomous_write_certification__independent-ledger-and-receiver": {"result": "${{ needs.autonomous_write_certification__independent-ledger-and-receiver.result
          }}"}, "connector_governance__connector-governance": {"result": "${{ needs.connector_governance__connector-governance.result
          }}"}, "connector_verified_writes_live__verified-writes-live": {"result": "${{ needs.connector_verified_writes_live__verified-writes-live.result
          }}"}, "outcome_ownership_contract__outcome-ownership": {"result": "${{ needs.outcome_ownership_contract__outcome-ownership.result
          }}"}, "pr605_cross_surface_ownership__bounded-source-inventory": {"result": "${{ needs.pr605_cross_surface_ownership__bounded-source-inventory.result
          }}"}, "pr605_run_status_contract__certify-v2-run-status": {"result": "${{ needs.pr605_run_status_contract__certify-v2-run-status.result
          }}"}, "pr605_runtime_edge_contract__privacy-contract": {"result": "${{ needs.pr605_runtime_edge_contract__privacy-contract.result
          }}"}, "release1_execution_revocation_audit__browser-credential-source": {"result": "${{ needs.release1_execution_revocation_audit__browser-credential-source.result
          }}"}, "release1_execution_revocation_audit__execution-and-revocation": {"result": "${{ needs.release1_execution_revocation_audit__execution-and-revocation.result
          }}"}, "release1_live_approval_denial__forged-approval": {"result": "${{ needs.release1_live_approval_denial__forged-approval.result
          }}"}}'
        SELECTED: ${{ needs.dispatch_contract.outputs.selected }}
    - uses: actions/upload-artifact@v4
      with:
        name: canonical-workflow-outcomes-04-governed-execution
