# Canonical development-branch lane; production release requires separate certification.
name: QA 04-governed-execution
'on':
  workflow_dispatch:
    inputs:
      source:
        description: Original workflow contract to execute
        required: true
        type: choice
        options:
        - autonomous-write-certification
        - connector-verified-writes-live
        - pr605-cross-surface-ownership
        - pr605-run-status-contract
        - pr605-runtime-edge-contract
        - release1-execution-revocation-audit
        - release1-live-approval-denial
        default: autonomous-write-certification
      connector_verified_writes_live__vendors:
        description: 'connector-verified-writes-live: Comma-separated vendors (default: apollo,slack,hubspot,github)'
        required: false
        default: apollo,slack,hubspot,github
      connector_verified_writes_live__reason:
        description: 'connector-verified-writes-live: Reason for manual trigger'
        required: false
  push:
    branches:
    - main
  pull_request:
    types:
    - opened
    - reopened
    - synchronize
  schedule:
  - cron: 30 6 * * *
concurrency:
  group: ${{ format('candidate-{0}', (inputs.source == 'connector-governance' && (format('connector-governance-{0}', github.ref)))
    || (inputs.source == 'connector-verified-writes-live' && ('connector-verified-writes-live')) || github.run_id) }}
  cancel-in-progress: ${{ (inputs.source == 'connector-governance' && (true)) || (inputs.source == 'connector-verified-writes-live'
    && (false)) || false }}
jobs:
  upstream_contract:
    name: Read trusted upstream outcome metadata
    if: ${{ github.event_name == 'workflow_run' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    outputs:
      evidence: ${{ steps.upstream.outputs.evidence }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - id: upstream
      run: python scripts/route-workflow-event.py --lane 04-governed-execution --fetch-upstream
      env:
        GITHUB_TOKEN: ${{ github.token }}
  dispatch_contract:
    name: Validate selected source inputs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 4
    needs:
    - upstream_contract
    if: ${{ always() && (needs.upstream_contract.result == 'success' || needs.upstream_contract.result == 'skipped') }}
    outputs:
      selected: ${{ steps.contract.outputs.selected }}
      derived: ${{ steps.contract.outputs.derived }}
      context_conclusions: ${{ steps.contract.outputs.context_conclusions }}
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        fetch-depth: 0
    - id: contract
      name: Validate source contract
      shell: python
      env:
        SOURCE_SCHEMAS: '{"autonomous-write-certification": {}, "connector-governance": {}, "connector-verified-writes-live":
          {"vendors": {"description": "Comma-separated vendors (default: apollo,slack,hubspot,github)", "required": false,
          "default": "apollo,slack,hubspot,github"}, "reason": {"description": "Reason for manual trigger", "required": false}},
          "outcome-ownership-contract": {}, "pr605-cross-surface-ownership": {}, "pr605-run-status-contract": {}, "pr605-runtime-edge-contract":
          {}, "release1-execution-revocation-audit": {}, "release1-live-approval-denial": {}}'
        MANUAL_SOURCES: '["autonomous-write-certification", "connector-verified-writes-live", "pr605-cross-surface-ownership",
          "pr605-run-status-contract", "pr605-runtime-edge-contract", "release1-execution-revocation-audit", "release1-live-approval-denial"]'
        DISPATCH_VALUES: ${{ toJSON(inputs) }}
        EVENT_NAME: ${{ github.event_name }}
        CANONICAL_LANE: 04-governed-execution
        UPSTREAM_EVIDENCE: ${{ needs.upstream_contract.outputs.evidence }}
      run: "import json, os\nschemas = json.loads(os.environ['SOURCE_SCHEMAS'])\nvalues = json.loads(os.environ['DISPATCH_VALUES'])\n\
        event_name = os.environ['EVENT_NAME']\ncalled = values.get('_reusable', False)\nif not called and event_name not in\
        \ ('workflow_dispatch', 'workflow_call'):\n    import subprocess\n    subprocess.run(['python', 'scripts/route-workflow-event.py',\
        \ '--lane', os.environ['CANONICAL_LANE']], check=True)\n    raise SystemExit(0)\nsource = values.get('source')\nif\
        \ source not in schemas:\n    raise SystemExit('Unknown source workflow')\nif not called and event_name == 'workflow_dispatch'\
        \ and source not in json.loads(os.environ['MANUAL_SOURCES']):\n    raise SystemExit('Source has no manual trigger')\n\
        if called and source != 'isolated-acceptance':\n    raise SystemExit('Unsupported reusable source')\nfor key, config\
        \ in schemas[source].items():\n    value = values.get(source.replace('-', '_') + '__' + key)\n    if called and key\
        \ == 'suite':\n        value = values.get('suite')\n    if config.get('required') and (value is None or value == ''):\n\
        \        raise SystemExit('Required selected-source input missing: ' + key)\nprint('Selected source input contract\
        \ validated; this is not execution acceptance')\nwith open(os.environ['GITHUB_OUTPUT'], 'a') as output:\n    output.write('selected='\
        \ + json.dumps([source]) + '\\n')\n    output.write('derived=[]\\ncontext_conclusions={}\\n')\n"
  autonomous_write_certification__independent-ledger-and-receiver:
    name: PostgreSQL ledger and independent receiver
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: dev
      GRAVITRE_REQUIRE_PG: '1'
      SUPABASE_URL: https://test.supabase.co
      SUPABASE_ANON_KEY: anon-test
      SUPABASE_SERVICE_ROLE_KEY: service-role-test
      SUPABASE_JWT_SECRET: jwt-secret-test
      OPENAI_API_KEY: sk-test-openai
      AUTONOMOUS_WRITE_AUDIT_PATH: ../autonomous-write-evidence/cases
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: backend/requirements-dev.txt
    - name: Install tests and PostgreSQL
      run: 'sudo apt-get update -y -q

        sudo apt-get install -y -q postgresql postgresql-client

        PGVER="$(ls /usr/lib/postgresql | sort -V | tail -1)"

        echo "GRAVITRE_PG_BIN=/usr/lib/postgresql/${PGVER}/bin" >> "$GITHUB_ENV"

        pip install -r requirements-dev.txt

        '
    - name: Start disposable Redis queue for real worker lease recovery
      run: 'sudo apt-get install -y -q redis-server

        redis-server --bind 127.0.0.1 --port 16379 --save '''' --appendonly no --daemonize yes

        redis-cli -p 16379 ping | grep -q PONG

        '
    - name: Real Redis claim SIGKILL and lost-ACK recovery
      env:
        REDIS_URL: redis://127.0.0.1:16379/15
        GRAVITRE_REQUIRE_REDIS: '1'
      run: "mkdir -p ../autonomous-write-evidence\npython -m pytest -q --no-header \\\n  tests/workers/test_workflow_queue_redis_integration.py\
        \ \\\n  --junitxml=../autonomous-write-evidence/redis-recovery-junit.xml\n"
    - name: Run matched independent receiver and database acceptance
      run: "mkdir -p ../autonomous-write-evidence\npython -m pytest -q --no-header \\\n  tests/db/test_autonomous_independent_write_pg.py\
        \ \\\n  tests/db/test_autonomous_atomic_approval_pg.py \\\n  tests/db/test_autonomous_full_dispatcher_pg.py \\\n \
        \ tests/db/test_write_invoke_idempotency_pg.py \\\n  tests/db/test_write_recovery_leases_pg.py \\\n  tests/services/test_autonomous_final_write_authority.py \\\n\
        \  tests/services/test_autonomous_write_attempt_budget.py \\\n  tests/services/test_autonomous_workflow_context.py\
        \ \\\n  tests/services/test_autonomous_worker_dispatch_boundary.py \\\n  tests/services/test_autonomous_invoke_receiver_integration.py\
        \ \\\n  tests/services/test_react_autonomous_admission_integration.py \\\n  --junitxml=../autonomous-write-evidence/junit.xml\n"
    - name: Compile strict SHA-bound evidence manifest
      if: always()
      working-directory: .
      env:
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        WORKFLOW_SHA: ${{ github.sha }}
      run: "python - <<'PY'\nimport json, os, pathlib, xml.etree.ElementTree as ET\nroot=pathlib.Path(\"autonomous-write-evidence\"\
        )\ncases=[json.loads(p.read_text()) for p in sorted((root/\"cases\").glob(\"*.json\"))]\nrequired={\"denied_dispatch\"\
        ,\"cross_tenant_denied\",\"completed_replay\",\"lost_ack\",\n          \"crash_before_effect\",\"crash_after_effect\"\
        }\nxml=root/\"junit.xml\"\ncounts={}\nif xml.exists():\n    node=ET.parse(xml).getroot()\n    node=node.find(\"testsuite\"\
        ) if node.tag!=\"testsuite\" else node\n    if node is not None:\n        counts={key:int(node.attrib.get(key,0))\
        \ for key in (\"tests\",\"failures\",\"errors\",\"skipped\")}\nredis_xml=root/\"redis-recovery-junit.xml\"\nredis_counts={}\n\
        if redis_xml.exists():\n    redis_root=ET.parse(redis_xml).getroot()\n    redis_suite=redis_root.find(\"testsuite\"\
        ) if redis_root.tag!=\"testsuite\" else redis_root\n    if redis_suite is not None:\n        redis_counts={key:int(redis_suite.attrib.get(key,0))\n\
        \                      for key in (\"tests\",\"failures\",\"errors\",\"skipped\")}\nredis_ok=redis_counts.get(\"tests\"\
        ,0)>=8 and not any(\n    redis_counts.get(k,0) for k in (\"failures\",\"errors\",\"skipped\"))\ndispatcher_cases=[json.loads(p.read_text())\
        \ for p in sorted((root/\"full-dispatcher\").glob(\"*.json\"))]\ndispatcher_required={\"crash_before_effect\",\"crash_after_effect\"\
        ,\"revoked_before_claim\"}\ndispatcher_ok={c.get(\"case\") for c in dispatcher_cases}==dispatcher_required and all(\n\
        \    c.get(\"passed\")\n    and (c.get(\"case\")==\"revoked_before_claim\" or (c.get(\"worker_killed\") and c.get(\"\
        worker_restarted\")\n    and c.get(\"claim_status\")==\"uncertain\"))\n    and c.get(\"unauthorized_or_duplicate_writes\"\
        )==0\n    and c.get(\"observed_committed_writes\")==c.get(\"expected_committed_writes\")\n    for c in dispatcher_cases)\n\
        audit_ok={c.get(\"case\") for c in cases}==required and all(\n    c.get(\"passed\") and c.get(\"unauthorized_or_duplicate_writes\"\
        )==0\n    and c.get(\"receiver_pid\") for c in cases)\ntests_ok=bool(counts.get(\"tests\")) and not any(counts.get(k,0)\
        \ for k in (\"failures\",\"errors\",\"skipped\"))\nreport={\n    \"pr_head_sha\":os.getenv(\"PR_HEAD_SHA\") or os.getenv(\"\
        WORKFLOW_SHA\"),\n    \"workflow_sha\":os.getenv(\"WORKFLOW_SHA\"),\n    \"scope\":\"postgres_rpc_and_independent_process_receiver\"\
        ,\n    \"counts\":counts,\"redis_counts\":redis_counts,\"redis_queue_certified\":bool(redis_ok),\"cases\":cases,\n\
        \    \"independent_receiver_audit_passed\":bool(audit_ok),\n    \"full_dispatcher_cases\":dispatcher_cases,\n    \"\
        full_dispatcher_certified\":bool(dispatcher_ok),\n    \"all_tests_passed\":bool(tests_ok),\n    \"passed\":bool(audit_ok\
        \ and tests_ok and redis_ok and dispatcher_ok),\n    \"limitations\":[\n        \"not a live provider end-to-end test\"\
        ,\n        \"denial cases test the dispatch boundary without executing the real ReAct caller\",\n        \"isolated\
        \ real worker SIGKILL tests use test HTTP adapter, not customer provider\",\n        \"PostgreSQL restart is graceful,\
        \ not an OS power loss\",\n        \"production provider behavior and deployment remain uncertified\"\n    ]\n}\n\
        root.mkdir(exist_ok=True)\n(root/\"manifest.json\").write_text(json.dumps(report,indent=2))\nif not report[\"passed\"\
        ]:\n    raise SystemExit(\"Missing or failed mandatory acceptance evidence\")\nPY\n"
    - name: Upload immutable evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: autonomous-write-cert-${{ github.sha }}
        path: autonomous-write-evidence/
        if-no-files-found: error
        retention-days: 30
    needs:
    - dispatch_contract
    if: ${{ always() && needs.dispatch_contract.result == 'success' && contains(fromJSON(needs.dispatch_contract.outputs.selected),
      'autonomous-write-certification') && ((!cancelled() && (true))) }}
    permissions:
      contents: read
  connector_governance__connector-governance:
    name: Connector governance (scoped pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: backend/requirements.txt
    - name: Reclaim unused hosted-runner SDKs and check disk
      run: "set -euo pipefail\necho \"Free space before cleanup:\"\ndf -h / /tmp\n# Disposable Python-only CI runner: leave\
        \ Python, Docker, FFmpeg,\n# GitHub Actions tools, repository and browser dependencies intact.\nfor dir in /usr/local/lib/android\
        \ /usr/share/dotnet /opt/ghc /usr/local/share/powershell; do\n  if [ -d \"$dir\" ]; then\n    echo \"Removing unused\
        \ SDK: $dir\"\n    sudo rm -rf -- \"$dir\"\n  fi\ndone\npython -m pip cache purge || true\nsudo apt-get clean\necho\
        \ \"Free space after cleanup:\"\ndf -h / /tmp\nfree_kib=$(df -Pk / | awk 'NR==2 {print $4}')\nif [ \"$free_kib\" -lt\
        \ 10485760 ]; then\n  echo \"::error::Connector governance runner needs at least 10 GiB free before heavy install;\
        \ available KiB=$free_kib\"\n  exit 1\nfi\n"
    - name: Install dependencies without wheel cache
      run: 'set -euo pipefail

        echo "Free space before dependencies:"

        df -h / /tmp

        python -m pip install --no-cache-dir --no-compile -r requirements-dev.txt

        echo "Free space after dependencies:"

        df -h / /tmp

        python -m pip check

        '
    - name: Run scoped connector governance suite
      run: "python - <<'PY'\nfrom app.services.connector_registration_contract import CONNECTOR_GOVERNANCE_PYTEST_TARGETS\n\
        print(\" \".join(CONNECTOR_GOVERNANCE_PYTEST_TARGETS))\nPY\npython -m pytest \\\n  tests/services/test_connector_registration_contract.py\
        \ \\\n  tests/services/test_connector_registry_verification.py \\\n  tests/services/test_connector_api_import_boundaries.py\
        \ \\\n  tests/services/test_connector_action_workflows.py \\\n  tests/services/test_connector_parameter_inference.py\
        \ \\\n  tests/services/test_action_workflow_validation.py \\\n  tests/services/test_connector_capability_analysis.py\
        \ \\\n  tests/services/test_connector_session_state.py \\\n  tests/services/test_chat_connector_execution.py \\\n\
        \  tests/services/test_gate26_connector_relay_behavior.py \\\n  tests/services/test_gate26_cancellation_and_outbox_contract.py\
        \ \\\n  tests/services/test_chat_orchestration.py \\\n  tests/services/test_chat_action_mapper.py \\\n  tests/services/test_react_inference_parity.py\
        \ \\\n  tests/services/test_workflow_schemas_batch_25.py \\\n  tests/services/test_workflow_schemas_batch_50.py \\\
        \n  tests/services/test_workflow_schemas_batch_75.py \\\n  tests/services/test_workflow_schemas_batch_100.py \\\n\
        \  tests/services/test_workflow_schemas_batch_125.py \\\n  tests/services/test_workflow_schemas_batch_150.py \\\n\
        \  tests/services/test_workflow_schemas_batch_175.py \\\n  tests/smoke/test_connector_action_smoke.py \\\n  -q\n"
      env:
        APP_ENV: dev
        SUPABASE_URL: https://test.supabase.co
        SUPABASE_ANON_KEY: anon-test
        SUPABASE_SERVICE_ROLE_KEY: service-role-test
        SUPABASE_JWT_SECRET: jwt-secret-test
        OPENAI_API_KEY: sk-test-openai
    - name: Print registration contract summary
      if: success()
      run: 'python - <<''PY''

        import json

        from app.services.connector_registration_contract import registration_contract_summary

        print(json.dumps(registration_contract_summary(), indent=2))

        PY

        '
    needs:
    - dispatch_contract
    if: ${{ always() && needs.dispatch_contract.result == 'success' && contains(fromJSON(needs.dispatch_contract.outputs.selected),
      'connector-governance') && ((!cancelled() && (true))) }}
    concurrency:
      group: ${{ format('candidate-{0}-{1}-{2}', format('connector-governance-{0}', github.ref), 'connector_governance__connector-governance',
        toJSON(matrix)) }}
      cancel-in-progress: ${{ true }}
  connector_verified_writes_live__verified-writes-live:
    name: Seed verified-write live matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: backend/requirements.txt
    - name: Install dependencies
      working-directory: backend
      run: 'python -m pip install --upgrade pip

        pip install -r requirements-dev.txt

        '
    - name: Skip if live secrets missing
      id: secrets
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        OAUTH_SMOKE_ORG_ID: ${{ secrets.OAUTH_SMOKE_ORG_ID }}
        CONNECTOR_SECRETS_ENCRYPTION_KEY: ${{ secrets.CONNECTOR_SECRETS_ENCRYPTION_KEY }}
      run: "if [ -z \"$SUPABASE_URL\" ] || [ -z \"$SUPABASE_SERVICE_ROLE_KEY\" ]; then\n  echo \"skip=1\" >> \"$GITHUB_OUTPUT\"\
        \n  echo \"Skipping verified-write live smoke \u2014 SUPABASE secrets not configured\"\nelif [ -z \"$CONNECTOR_SECRETS_ENCRYPTION_KEY\"\
        \ ]; then\n  echo \"skip=1\" >> \"$GITHUB_OUTPUT\"\n  echo \"Skipping verified-write live smoke \u2014 CONNECTOR_SECRETS_ENCRYPTION_KEY\
        \ not configured\"\nelse\n  echo \"skip=0\" >> \"$GITHUB_OUTPUT\"\nfi\n"
    - name: Run seed verified-write smoke
      if: steps.secrets.outputs.skip != '1'
      working-directory: backend
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
        CONNECTOR_SECRETS_ENCRYPTION_KEY: ${{ secrets.CONNECTOR_SECRETS_ENCRYPTION_KEY }}
        HUBSPOT_CLIENT_ID: ${{ secrets.HUBSPOT_CLIENT_ID }}
        HUBSPOT_CLIENT_SECRET: ${{ secrets.HUBSPOT_CLIENT_SECRET }}
        OAUTH_SMOKE_ORG_ID: ${{ secrets.OAUTH_SMOKE_ORG_ID }}
        OAUTH_SMOKE_USER_ID: ${{ secrets.OAUTH_SMOKE_USER_ID }}
        OAUTH_SMOKE_ENVIRONMENT: ${{ secrets.OAUTH_SMOKE_ENVIRONMENT || 'sandbox' }}
        OAUTH_SMOKE_FORCE_SANDBOX_WRITES: ${{ secrets.OAUTH_SMOKE_FORCE_SANDBOX_WRITES || '1' }}
        OAUTH_SMOKE_SLACK_CHANNEL: ${{ secrets.OAUTH_SMOKE_SLACK_CHANNEL }}
        VENDORS: ${{ github.event.inputs.connector_verified_writes_live__vendors || 'apollo,slack,hubspot,github' }}
      run: "mkdir -p ../docs/delivery\npython ../scripts/smoke-oauth-live.py \\\n  --vendors \"$VENDORS\" \\\n  --enable-writes\
        \ \\\n  --environment \"${OAUTH_SMOKE_ENVIRONMENT}\" \\\n  --json ../docs/delivery/verified-write-live-latest.json\
        \ \\\n  --csv ../docs/delivery/verified-write-live-latest.csv\n"
    - name: "Run ReAct write\u2192approval\u2192execute smoke"
      if: steps.secrets.outputs.skip != '1'
      working-directory: backend
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
        CONNECTOR_SECRETS_ENCRYPTION_KEY: ${{ secrets.CONNECTOR_SECRETS_ENCRYPTION_KEY }}
        OAUTH_SMOKE_ORG_ID: ${{ secrets.OAUTH_SMOKE_ORG_ID }}
        OAUTH_SMOKE_USER_ID: ${{ secrets.OAUTH_SMOKE_USER_ID }}
        OAUTH_SMOKE_ENVIRONMENT: ${{ secrets.OAUTH_SMOKE_ENVIRONMENT || 'sandbox' }}
      run: "mkdir -p ../docs/delivery\npython ../scripts/smoke-react-write-live.py \\\n  --json ../docs/delivery/react-write-live-latest.json\n"
    - name: Run capability write-authority parity smoke
      if: steps.secrets.outputs.skip != '1'
      working-directory: backend
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
        CONNECTOR_SECRETS_ENCRYPTION_KEY: ${{ secrets.CONNECTOR_SECRETS_ENCRYPTION_KEY }}
        OAUTH_SMOKE_ORG_ID: ${{ secrets.OAUTH_SMOKE_ORG_ID }}
        OAUTH_SMOKE_USER_ID: ${{ secrets.OAUTH_SMOKE_USER_ID }}
        OAUTH_SMOKE_ENVIRONMENT: ${{ secrets.OAUTH_SMOKE_ENVIRONMENT || 'sandbox' }}
        INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
        BACKEND_URL: ${{ secrets.BACKEND_URL || 'https://gravitre-saas-backend-production.up.railway.app' }}
      run: "mkdir -p ../docs/delivery\npython ../scripts/verify-capability-write-authority-live.py \\\n  --json ../docs/delivery/capability-write-authority-live.json\n"
    - name: Upload live write report
      if: always() && steps.secrets.outputs.skip != '1'
      uses: actions/upload-artifact@v4
      with:
        name: verified-write-live-report
        path: 'docs/delivery/verified-write-live-latest.json

          docs/delivery/verified-write-live-latest.csv

          docs/delivery/react-write-live-latest.json

          docs/delivery/capability-write-authority-live.json

          '
        if-no-files-found: ignore
    needs:
    - dispatch_contract
    if: ${{ always() && needs.dispatch_contract.result == 'success' && contains(fromJSON(needs.dispatch_contract.outputs.selected),
      'connector-verified-writes-live') && ((!cancelled() && (true))) }}
    concurrency:
      group: ${{ format('candidate-{0}-{1}-{2}', 'connector-verified-writes-live', 'connector_verified_writes_live__verified-writes-live',
        toJSON(matrix)) }}
      cancel-in-progress: ${{ false }}
  outcome_ownership_contract__outcome-ownership:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      PIP_NO_CACHE_DIR: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Reclaim unused hosted toolchains and verify available disk
      run: "set -euo pipefail\necho \"Disk before cleanup:\"\ndf -h / /tmp\n# These preinstalled SDKs are unused by the Python-only\
        \ contract suite.\n# Never remove Python, GitHub Actions tooling, Docker or repository data.\nfor dir in /usr/local/lib/android\
        \ /usr/share/dotnet /opt/ghc /usr/local/share/powershell; do\n  if [ -d \"$dir\" ]; then\n    echo \"Removing unused\
        \ SDK: $dir\"\n    sudo rm -rf -- \"$dir\"\n  fi\ndone\npython -m pip cache purge || true\nsudo apt-get clean\necho\
        \ \"Disk after cleanup:\"\ndf -h / /tmp\navailable_kib=$(df -Pk / | awk 'NR==2 {print $4}')\nif [ \"$available_kib\"\
        \ -lt 10485760 ]; then\n  echo \"::error::Outcome Ownership runner has less than 10 GiB free before dependency install\
        \ (KiB=$available_kib)\"\n  exit 1\nfi\n"
    - name: Install backend test dependencies without wheel cache
      run: 'set -euo pipefail

        echo "Disk before dependencies:"

        df -h / /tmp

        python -m pip install --no-cache-dir --no-compile -r requirements-dev.txt

        echo "Disk after dependencies:"

        df -h / /tmp

        python -m pip check

        '
    - name: Outcome Ownership contract (every outcome-ownership suite)
      run: 'python -m pytest -q tests/services/test_objective_capability_composer.py $(ls tests/services/test_outcome_ownership_*.py
        tests/workflows/test_outcome_ownership_*.py)

        '
    name: outcome-ownership
    needs:
    - dispatch_contract
    if: ${{ always() && needs.dispatch_contract.result == 'success' && contains(fromJSON(needs.dispatch_contract.outputs.selected),
      'outcome-ownership-contract') && ((!cancelled() && (true))) }}
  pr605_cross_surface_ownership__bounded-source-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Source-only inventory and unit assertions
      shell: bash
      env:
        PYTHONDONTWRITEBYTECODE: '1'
      run: 'set -euo pipefail

        python -m pip install pytest==8.4.2

        python -m pytest -q --noconftest backend/tests/scripts/test_pr605_cross_surface_ownership_inventory.py backend/tests/scripts/test_pr605_execution_owner_edges.py

        mkdir -p "$RUNNER_TEMP/pr605"

        python backend/scripts/pr605_cross_surface_ownership_inventory.py --output "$RUNNER_TEMP/pr605/source-ownership.json"

        python backend/scripts/pr605_execution_owner_edges.py --output "$RUNNER_TEMP/pr605/execution-edges.json"

        python - "$RUNNER_TEMP/pr605/source-ownership.json" <<''PY''

        import json, os, sys

        report = json.load(open(sys.argv[1], encoding="utf-8"))

        assert report["commit"] == os.environ["GITHUB_SHA"]

        assert report["candidate_source_count"] == 10

        assert not report["missing_sources"]

        assert all(report["critical_source_assertions"].values())

        assert report["retirement_certified"] is False

        edges = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "pr605", "execution-edges.json"), encoding="utf-8"))

        assert edges["commit"] == os.environ["GITHUB_SHA"]

        assert len(edges["sources"]) == 19  # Verified source count in CI run 42155555074

        assert not edges["missing_sources"]

        assert edges["runtime_executions_observed"] == 0

        assert edges["retirement_certified"] is False

        print("PASS: bounded call-site and registration evidence. Runtime and retirement remain gated.")

        PY

        '
    - name: Retain source ownership report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pr605-cross-surface-ownership
        path: ${{ runner.temp }}/pr605/*.json
        if-no-files-found: error
    name: bounded-source-inventory
    needs:
    - dispatch_contract
    if: ${{ always() && needs.dispatch_contract.result == 'success' && contains(fromJSON(needs.dispatch_contract.outputs.selected),
      'pr605-cross-surface-ownership') && ((!cancelled() && (true))) }}
    permissions:
      contents: read
  pr605_run_status_contract__certify-v2-run-status:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install isolated PostgreSQL and test runtime
      shell: bash
      run: 'set -euo pipefail

        sudo apt-get update -y -q

        sudo apt-get install -y -q postgresql postgresql-client

        python -m pip install --disable-pip-version-check pytest==8.4.2

        PGVER="$(ls /usr/lib/postgresql | sort -V | tail -1)"

        test -x "/usr/lib/postgresql/${PGVER}/bin/initdb"

        test -x "/usr/lib/postgresql/${PGVER}/bin/pg_ctl"

        echo "GRAVITRE_PG_BIN=/usr/lib/postgresql/${PGVER}/bin" >> "$GITHUB_ENV"

        '
    - name: Test exact migration against throwaway Postgres (no skips)
      working-directory: backend
      shell: bash
      env:
        GRAVITRE_REQUIRE_PG: '1'
      run: "set -euo pipefail\npython -c \"from tests.db.pg_harness import PG_BIN; assert PG_BIN is not None, 'postgres binaries\
        \ absent'\"\npython -m pytest --noconftest -q -rs --no-header \\\n  tests/db/test_pr605_run_status_contract_pg.py\n\
        python -m pytest --noconftest -q -rs --no-header \\\n  tests/workflows/test_schema_sync.py \\\n  -k 'contract_run_status_maps_pending_approval\
        \ or partial_success_is_distinct_in_v2_contract or flagged_for_review_is_distinct_in_v2_contract or v2_status_translation_parity\
        \ or v2_unknown_status_rejected'\n"
    - name: Record certification provenance
      if: always()
      shell: bash
      run: 'printf ''sha=%s\nworkflow=%s\nrun=%s\n'' "$GITHUB_SHA" "$GITHUB_WORKFLOW" "$GITHUB_RUN_ID"

        '
    name: certify-v2-run-status
    needs:
    - dispatch_contract
    if: ${{ always() && needs.dispatch_contract.result == 'success' && contains(fromJSON(needs.dispatch_contract.outputs.selected),
      'pr605-run-status-contract') && ((!cancelled() && (true))) }}
    permissions:
      contents: read
  pr605_runtime_edge_contract__privacy-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
