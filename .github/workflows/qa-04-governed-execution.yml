      shell: bash
      env:
        PYTHONDONTWRITEBYTECODE: '1'
        PR605_EXECUTION_EDGE_TELEMETRY_ENABLED: 'false'
        PYTHONPATH: backend
      run: 'set -euo pipefail

        python -m pip install pytest==8.4.2

        python -m pytest -q --noconftest backend/tests/services/test_runtime_execution_edge_telemetry.py backend/tests/services/test_pr605_relay_acceptance.py

        python -m compileall -q backend/app/services/runtime_execution_edge_telemetry.py backend/app/services/domain_events.py
        backend/app/services/workflow_execution_strategy.py backend/app/services/autonomous_execution_loop.py backend/app/services/chat_connector_execution_service.py
        backend/app/services/execution_outcome.py backend/app/services/chat_orchestration_service.py

        echo "PR605 privacy and real-relay synthetic acceptance PASS; no external calls or production collection."

        '
    name: privacy-contract
    needs:
    - dispatch_contract
    if: ${{ always() && needs.dispatch_contract.result == 'success' && contains(fromJSON(needs.dispatch_contract.outputs.selected),
      'pr605-runtime-edge-contract') && ((!cancelled() && (true))) }}
    permissions:
      contents: read
