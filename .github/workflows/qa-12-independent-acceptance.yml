# Canonical development-branch lane; production release requires separate certification.
name: QA 12-independent-acceptance
'on':
  workflow_dispatch:
    inputs:
      source:
        description: Original workflow contract to execute
        required: true
        type: choice
        options:
        - eco-001-deployed-ingress
        - isolated-acceptance
        - master-qa-p0-synthetic
        - master-qa-p27-sandbox-readback
        - milestone1-live-reverify
        - plays-datasets-live-proof
        - plays-production-acceptance
        - release1-live-memory-liveness
        - release1-live-public-mcp
        default: eco-001-deployed-ingress
      eco_001_deployed_ingress__backend_url:
        description: 'eco-001-deployed-ingress: HTTPS URL of an already-deployed, isolated FastAPI nonproduction backend (not
          frontend or production)'
        required: false
        type: string
      eco_001_deployed_ingress__runtime_sha:
        description: 'eco-001-deployed-ingress: Exact Git commit deployed to that backend; /health git_sha must match'
        required: false
        type: string
      isolated_acceptance__suite:
        description: 'isolated-acceptance: Choose isolated acceptance suite'
        required: false
        type: choice
        options:
        - all
        - billing
        - voice
        default: all
      master_qa_p27_sandbox_readback__approval:
        description: 'master-qa-p27-sandbox-readback: Type APPROVE_LIVE_TEST_CONTACT for one disposable record in the existing
          Gravitre HubSpot portal'
        required: false
        type: string
      milestone1_live_reverify__min_sha:
        description: 'milestone1-live-reverify: Minimum deployed git sha prefix (Research Manager)'
        required: false
        default: 4eb6adbe
      milestone1_live_reverify__skip_wave67_write:
        description: 'milestone1-live-reverify: Skip Wave67 write/approve turns (read-only spotcheck)'
        required: false
        type: boolean
        default: false
      plays_datasets_live_proof__dataset_query:
        description: 'plays-datasets-live-proof: Public dataset metadata search query'
        required: false
        default: customer support
      plays_datasets_live_proof__backend_url:
        description: 'plays-datasets-live-proof: Backend base URL'
        required: false
        default: https://gravitre-saas-backend-production.up.railway.app
      plays_production_acceptance__backend_url:
        description: 'plays-production-acceptance: Backend base URL'
        required: false
        default: https://gravitre-saas-backend-production.up.railway.app
  workflow_call:
    inputs:
      source:
        type: string
        default: isolated-acceptance
      suite:
        type: string
        required: true
      _reusable:
        type: boolean
        default: true
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
    types:
    - labeled
    - opened
    - reopened
    - synchronize
  workflow_run:
    branches:
    - main
    types:
    - completed
    workflows:
    - Production release verification
    - QA 11-release
concurrency:
  group: ${{ format('candidate-{0}', (inputs.source == 'isolated-acceptance' && (format('external-acceptance-{0}', github.event.pull_request.number
    || github.ref))) || (inputs.source == 'master-qa-p0-synthetic' && (format('master-qa-p0-{0}', github.event.pull_request.number
    || github.ref))) || (inputs.source == 'master-qa-p27-sandbox-readback' && ('p27-existing-live-hubspot-qa')) || (inputs.source
    == 'milestone1-live-reverify' && ('milestone1-live-reverify')) || github.run_id) }}
  cancel-in-progress: ${{ (inputs.source == 'isolated-acceptance' && (true)) || (inputs.source == 'master-qa-p0-synthetic'
    && (true)) || (inputs.source == 'master-qa-p27-sandbox-readback' && (false)) || (inputs.source == 'milestone1-live-reverify'
    && (false)) || false }}
jobs:
  upstream_contract:
    name: Read trusted upstream outcome metadata
    if: ${{ github.event_name == 'workflow_run' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    outputs:
      evidence: ${{ steps.upstream.outputs.evidence }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - id: upstream
      run: python scripts/route-workflow-event.py --lane 12-independent-acceptance --fetch-upstream
      env:
        GITHUB_TOKEN: ${{ github.token }}
  dispatch_contract:
    name: Validate selected source inputs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 4
    needs:
    - upstream_contract
    if: ${{ always() && (needs.upstream_contract.result == 'success' || needs.upstream_contract.result == 'skipped') }}
    outputs:
      selected: ${{ steps.contract.outputs.selected }}
      derived: ${{ steps.contract.outputs.derived }}
      context_conclusions: ${{ steps.contract.outputs.context_conclusions }}
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        fetch-depth: 0
    - id: contract
      name: Validate source contract
      shell: python
      env:
        SOURCE_SCHEMAS: '{"eco-001-deployed-ingress": {"backend_url": {"description": "HTTPS URL of an already-deployed, isolated
          FastAPI nonproduction backend (not frontend or production)", "required": true, "type": "string"}, "runtime_sha":
          {"description": "Exact Git commit deployed to that backend; /health git_sha must match", "required": true, "type":
          "string"}}, "isolated-acceptance": {"suite": {"description": "Choose isolated acceptance suite", "required": true,
          "type": "choice", "options": ["all", "billing", "voice"], "default": "all"}}, "master-qa-p0-synthetic": {}, "master-qa-p27-sandbox-readback":
          {"approval": {"description": "Type APPROVE_LIVE_TEST_CONTACT for one disposable record in the existing Gravitre
          HubSpot portal", "required": true, "type": "string"}}, "milestone1-live-reverify": {"min_sha": {"description": "Minimum
          deployed git sha prefix (Research Manager)", "required": false, "default": "4eb6adbe"}, "skip_wave67_write": {"description":
          "Skip Wave67 write/approve turns (read-only spotcheck)", "required": false, "type": "boolean", "default": false}},
          "plays-datasets-live-proof": {"dataset_query": {"description": "Public dataset metadata search query", "required":
          false, "default": "customer support"}, "backend_url": {"description": "Backend base URL", "required": false, "default":
          "https://gravitre-saas-backend-production.up.railway.app"}}, "plays-production-acceptance": {"backend_url": {"description":
          "Backend base URL", "required": false, "default": "https://gravitre-saas-backend-production.up.railway.app"}}, "release1-live-memory-liveness":
          {}, "release1-live-public-mcp": {}}'
        MANUAL_SOURCES: '["eco-001-deployed-ingress", "isolated-acceptance", "master-qa-p0-synthetic", "master-qa-p27-sandbox-readback",
          "milestone1-live-reverify", "plays-datasets-live-proof", "plays-production-acceptance", "release1-live-memory-liveness",
          "release1-live-public-mcp"]'
        DISPATCH_VALUES: ${{ toJSON(inputs) }}
        EVENT_NAME: ${{ github.event_name }}
        CANONICAL_LANE: 12-independent-acceptance
        UPSTREAM_EVIDENCE: ${{ needs.upstream_contract.outputs.evidence }}
      run: "import json, os\nschemas = json.loads(os.environ['SOURCE_SCHEMAS'])\nvalues = json.loads(os.environ['DISPATCH_VALUES'])\n\
        event_name = os.environ['EVENT_NAME']\ncalled = values.get('_reusable', False)\nif not called and event_name not in\
        \ ('workflow_dispatch', 'workflow_call'):\n    import subprocess\n    subprocess.run(['python', 'scripts/route-workflow-event.py',\
        \ '--lane', os.environ['CANONICAL_LANE']], check=True)\n    raise SystemExit(0)\nsource = values.get('source')\nif\
        \ source not in schemas:\n    raise SystemExit('Unknown source workflow')\nif not called and event_name == 'workflow_dispatch'\
        \ and source not in json.loads(os.environ['MANUAL_SOURCES']):\n    raise SystemExit('Source has no manual trigger')\n\
        if called and source != 'isolated-acceptance':\n    raise SystemExit('Unsupported reusable source')\nfor key, config\
        \ in schemas[source].items():\n    value = values.get(source.replace('-', '_') + '__' + key)\n    if called and key\
        \ == 'suite':\n        value = values.get('suite')\n    if config.get('required') and (value is None or value == ''):\n\
        \        raise SystemExit('Required selected-source input missing: ' + key)\nprint('Selected source input contract\
        \ validated; this is not execution acceptance')\nwith open(os.environ['GITHUB_OUTPUT'], 'a') as output:\n    output.write('selected='\
        \ + json.dumps([source]) + '\\n')\n    output.write('derived=[]\\ncontext_conclusions={}\\n')\n"
  eco_001_deployed_ingress__deployed-ingress-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Verify protected backend runtime without dispatching work
      env:
        QA_BACKEND_URL: ${{ inputs.eco_001_deployed_ingress__backend_url }}
        QA_EXPECTED_SHA: ${{ inputs.eco_001_deployed_ingress__runtime_sha }}
      run: "set -euo pipefail\npython backend/scripts/eco001_deployed_ingress_preflight.py \\\n  --url \"$QA_BACKEND_URL\"\
        \ \\\n  --sha \"$QA_EXPECTED_SHA\" \\\n  --output \"$RUNNER_TEMP/eco001-deployed-ingress.json\"\n"
    - name: Upload sanitized nonproduction runtime identity evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: eco001-deployed-ingress-readonly
        path: ${{ runner.temp }}/eco001-deployed-ingress.json
        if-no-files-found: warn
    name: deployed-ingress-preflight
    needs:
    - dispatch_contract
    if: ${{ always() && needs.dispatch_contract.result == 'success' && contains(fromJSON(needs.dispatch_contract.outputs.selected),
      'eco-001-deployed-ingress') && ((!cancelled() && (true))) }}
    permissions:
      contents: read
  isolated_acceptance__billing-e2e:
    name: Billing Playwright (isolated test)
    if: ${{ always() && needs.dispatch_contract.result == 'success' && contains(fromJSON(needs.dispatch_contract.outputs.selected),
      'isolated-acceptance') && (!cancelled() && (true) && ((github.event_name == 'workflow_dispatch' || github.event_name
      == 'workflow_call' || vars.ACCEPTANCE_AUTOMATION_ENABLED == 'true') && ((inputs.isolated_acceptance__suite || inputs.suite)
      == '' || (inputs.isolated_acceptance__suite || inputs.suite) == 'all' || (inputs.isolated_acceptance__suite || inputs.suite)
      == 'billing'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: acceptance
    env:
      BILLING_ACCEPTANCE_ISOLATED: '1'
      BILLING_ACCEPTANCE_ALLOWED_URL: ${{ vars.E2E_SUPABASE_ALLOWED_URL }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - uses: pnpm/action-setup@v4
      with:
        version: 10
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: backend/requirements.txt
    - name: Assert dedicated test credentials (never production)
      env:
        E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
        E2E_SUPABASE_ALLOWED_URL: ${{ vars.E2E_SUPABASE_ALLOWED_URL }}
        E2E_STRIPE_SECRET_KEY: ${{ secrets.E2E_STRIPE_SECRET_KEY }}
        E2E_STRIPE_PUBLISHABLE_KEY: ${{ secrets.E2E_STRIPE_PUBLISHABLE_KEY }}
        E2E_STRIPE_PRICE_ID_NODE_MONTHLY: ${{ secrets.E2E_STRIPE_PRICE_ID_NODE_MONTHLY }}
        E2E_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
        E2E_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
        E2E_SUPABASE_JWT_SECRET: ${{ secrets.E2E_SUPABASE_JWT_SECRET }}
      run: "python - <<'PY'\nimport os\nfrom urllib.parse import urlsplit\nrequired = ('E2E_SUPABASE_URL', 'E2E_SUPABASE_ALLOWED_URL',\n\
        \            'E2E_STRIPE_SECRET_KEY', 'E2E_STRIPE_PUBLISHABLE_KEY', 'E2E_STRIPE_PRICE_ID_NODE_MONTHLY',\n        \
        \    'E2E_SUPABASE_ANON_KEY', 'E2E_SUPABASE_SERVICE_ROLE_KEY',\n            'E2E_SUPABASE_JWT_SECRET')\nmissing =\
        \ [key for key in required if not os.environ.get(key)]\nif missing:\n    raise SystemExit('Acceptance NOT RUN: missing\
        \ configuration names: ' + ', '.join(missing))\nurl = os.environ['E2E_SUPABASE_URL'].rstrip('/')\nallowed = os.environ['E2E_SUPABASE_ALLOWED_URL'].rstrip('/')\n\
        parsed = urlsplit(url)\nchecks = {\n    'dedicated_supabase_target': url == 'https://aadnwmjzrmbvadszroqt.supabase.co',\n\
        \    'allowed_url_matches_target': url == allowed,\n    'undecorated_https_target': (parsed.scheme == 'https' and\
        \ bool(parsed.hostname)\n        and parsed.hostname.endswith('.supabase.co')\n        and not any((parsed.username,\
        \ parsed.password, parsed.query, parsed.fragment))),\n    'stripe_test_mode_key': os.environ['E2E_STRIPE_SECRET_KEY'].startswith('sk_test_'),\n\
        \    'stripe_test_publishable_key': os.environ['E2E_STRIPE_PUBLISHABLE_KEY'].startswith('pk_test_'),\n}\nfailed =\
        \ [name for name, passed in checks.items() if not passed]\nif failed:\n    raise SystemExit('Acceptance blocked: failed\
        \ configuration checks (values redacted): ' + ', '.join(failed))\nprint('Isolated billing target and Stripe test mode\
        \ verified (values redacted)')\nPY\n"
    - name: Read-only application schema readiness preflight
      env:
        E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
        E2E_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
      run: python scripts/check-isolated-acceptance-db.py
    - name: Install dependencies
      run: 'pnpm install --frozen-lockfile --ignore-scripts

        pnpm --dir apps/web install --frozen-lockfile

        python -m pip install -r backend/requirements-dev.txt

        npx playwright install --with-deps chromium

        '
    - name: Validate test price and start signed webhook forwarding
      env:
        SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
        STRIPE_SECRET_KEY: ${{ secrets.E2E_STRIPE_SECRET_KEY }}
        STRIPE_PRICE_ID_NODE_MONTHLY: ${{ secrets.E2E_STRIPE_PRICE_ID_NODE_MONTHLY }}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.E2E_STRIPE_PUBLISHABLE_KEY }}
      run: python scripts/prepare-dedicated-billing-acceptance.py
    - name: Run authenticated billing E2E
      env:
        CI: 'true'
        APP_ENV: dev
        SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
        SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
        SUPABASE_JWT_SECRET: ${{ secrets.E2E_SUPABASE_JWT_SECRET }}
        NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
        STRIPE_SECRET_KEY: ${{ secrets.E2E_STRIPE_SECRET_KEY }}
        STRIPE_PRICE_ID_NODE_MONTHLY: ${{ secrets.E2E_STRIPE_PRICE_ID_NODE_MONTHLY }}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.E2E_STRIPE_PUBLISHABLE_KEY }}
        COMMERCIAL_OFFERS_ENABLED: 'true'
        DISABLE_AI: 'true'
        BILLING_RECONCILIATION_ENABLED: 'false'
        USAGE_SYNC_INTERVAL_SECONDS: '0'
        PUBLIC_APP_URL: http://localhost:3000
        NEXT_PUBLIC_APP_URL: http://localhost:3000
        FASTAPI_BASE_URL: http://127.0.0.1:8000
        PLAYWRIGHT_BASE_URL: http://localhost:3000
        NEXT_PUBLIC_PLAYWRIGHT_E2E: '1'
      run: npx playwright test --config playwright.billing.acceptance.config.ts
    - name: Stop runner-local Stripe test listener
      if: always()
      run: "python - <<'PY'\nimport os, pathlib, signal\npath = pathlib.Path(os.environ['RUNNER_TEMP']) / 'dedicated-billing-stripe-listener.pid'\n\
        if path.exists():\n    try:\n        os.killpg(int(path.read_text()), signal.SIGTERM)\n    except ProcessLookupError:\n\
        \        pass\nPY\n"
    - name: Publish billing evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: billing-e2e-${{ github.sha }}
        path: 'playwright-report/

          test-results/

          '
        if-no-files-found: ignore
        retention-days: 7
    needs:
    - dispatch_contract
    permissions:
      contents: read
    concurrency:
      group: ${{ format('candidate-{0}-{1}-{2}', format('external-acceptance-{0}', github.event.pull_request.number || github.ref),
        'isolated_acceptance__billing-e2e', toJSON(matrix)) }}
      cancel-in-progress: ${{ true }}
  isolated_acceptance__live-provider-voice:
    name: ElevenLabs + Deepgram synthetic live acceptance
    if: ${{ always() && needs.dispatch_contract.result == 'success' && contains(fromJSON(needs.dispatch_contract.outputs.selected),
      'isolated-acceptance') && (!cancelled() && (true) && ((github.event_name == 'workflow_dispatch' || github.event_name
      == 'workflow_call' || vars.ACCEPTANCE_AUTOMATION_ENABLED == 'true') && ((inputs.isolated_acceptance__suite || inputs.suite)
      == '' || (inputs.isolated_acceptance__suite || inputs.suite) == 'all' || (inputs.isolated_acceptance__suite || inputs.suite)
      == 'voice'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: acceptance
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: backend/requirements.txt
    - name: Install voice dependencies
      run: python -m pip install -r backend/requirements-dev.txt
    - name: Validate synthetic provider runner contracts
      working-directory: backend
      run: python -m pytest -q tests/scripts/test_voice_provider_roundtrip.py
      env:
        APP_ENV: dev
    - name: Live provider roundtrip and final write-gate check
      env:
        APP_ENV: dev
        DEEPGRAM_API_KEY: ${{ secrets.ACCEPTANCE_DEEPGRAM_API_KEY }}
        ELEVENLABS_API_KEY: ${{ secrets.ACCEPTANCE_ELEVENLABS_API_KEY }}
        ELEVENLABS_VOICE_ID: ${{ vars.ACCEPTANCE_ELEVENLABS_VOICE_ID }}
      run: 'mkdir -p acceptance-results

        python scripts/verify-voice-provider-roundtrip.py --output acceptance-results/provider-roundtrip.json

        '
    - name: Publish sanitized voice evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: voice-provider-${{ github.sha }}
        path: acceptance-results/provider-roundtrip.json
        if-no-files-found: ignore
        retention-days: 7
    needs:
    - dispatch_contract
    permissions:
      contents: read
    concurrency:
      group: ${{ format('candidate-{0}-{1}-{2}', format('external-acceptance-{0}', github.event.pull_request.number || github.ref),
        'isolated_acceptance__live-provider-voice', toJSON(matrix)) }}
      cancel-in-progress: ${{ true }}
  isolated_acceptance__physical-voice-readiness:
    name: Physical voice human acceptance reserved
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: backend/requirements.txt
    - name: Install tests
      run: python -m pip install -r backend/requirements-dev.txt
    - name: Verify acceptance schema preflight fail-closed contracts
      run: python -m pytest -q tests/test_isolated_acceptance_db.py tests/test_acceptance_initialization_preflight.py tests/test_manual_acceptance_workflows.py
        tests/test_billing_acceptance_setup.py
    - name: Exercise twenty simulated cancelled turns
      working-directory: backend
      run: python -m pytest -q tests/scripts/test_voice_provider_roundtrip.py -k twenty_cancelled
      env:
        APP_ENV: dev
    - name: Declare physical acceptance boundary
      run: echo 'Physical microphone/speaker and natural full-duplex usability acceptance remain NOT RUN; no synthetic test
        can certify them.'
    needs:
    - dispatch_contract
    if: ${{ always() && needs.dispatch_contract.result == 'success' && contains(fromJSON(needs.dispatch_contract.outputs.selected),
      'isolated-acceptance') && ((!cancelled() && (true))) }}
    permissions:
      contents: read
    concurrency:
      group: ${{ format('candidate-{0}-{1}-{2}', format('external-acceptance-{0}', github.event.pull_request.number || github.ref),
        'isolated_acceptance__physical-voice-readiness', toJSON(matrix)) }}
      cancel-in-progress: ${{ true }}
  master_qa_p0_synthetic__synthetic-fixtures:
    name: Master QA synthetic fixture contracts
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: backend
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install minimal offline test runner
      run: python -m pip install --disable-pip-version-check pytest PyYAML==6.0.3
    - name: Generate canonical repair for reviewed source commit
      shell: python
      working-directory: .
      run: |
        import base64, json, os, pathlib, subprocess, sys
        subprocess.run([sys.executable, 'scripts/build-canonical-workflows.py'], check=True)
        for source in pathlib.Path('.github/workflow-candidates').glob('*.yml'):
            body = source.read_text().split('\n', 1)[1]
            (pathlib.Path('.github/workflows') / source.name).write_text('# Canonical development-branch lane; production release requires separate certification.\n' + body)
        subprocess.run([sys.executable, 'scripts/build-canonical-workflows.py', '--check'], check=True)
        inventory = pathlib.Path('docs/delivery/master-qa-workflow-migration-inventory.json')
        subprocess.run([sys.executable, 'scripts/audit-workflow-migration.py', '--source-sha', os.environ['GITHUB_SHA'], '--output', str(inventory)], check=True)
        report = json.loads(inventory.read_text())
        report['base_commit'] = report.pop('source_commit')
        report['source_commit'] = None
        report['snapshot_scope'] = 'Generated canonical repair from the named base commit; per-file hashes bind source content.'
        report['main_release_authorized'] = False
        inventory.write_text(json.dumps(report, indent=2) + '\n')
        paths = sorted(pathlib.Path('.github/workflows').glob('*.yml')) + sorted(pathlib.Path('.github/workflow-candidates').glob('*.yml'))
        paths += [pathlib.Path('docs/delivery/master-qa-workflow-replacement-parity.json'), inventory]
        for path in paths:
            content = path.read_bytes()
            parts = (len(content) + 8191) // 8192
            for part in range(parts):
                data = base64.b64encode(content[part*8192:(part+1)*8192]).decode()
                print('CANONICAL_REPAIR_CHUNK ' + json.dumps({'path': str(path), 'part': part, 'total': parts, 'data': data}), flush=True)
    - name: Verify 12 staged workflow replacements without executing source jobs
      run: 'python ../scripts/build-canonical-workflows.py --root .. --check

        python -m unittest discover -s ../scripts/tests -p ''test_*workflow*.py''

        python -m pytest -q --confcutdir=tests/master_qa tests/master_qa/test_master_qa_workflow_consolidation.py tests/master_qa/test_p27_hubspot_tool_dispatch.py
        ../tests/test_manual_acceptance_workflows.py

        '
    - uses: actions/setup-go@v5
      with:
        go-version: 1.25.0
        cache: false
    - name: Lint staged replacement workflows in an isolated 12-file layout
      working-directory: .
      shell: bash
      run: 'set -euo pipefail

        go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

        lane_lint_root="$(mktemp -d)"

        trap ''rm -rf "$lane_lint_root"'' EXIT

        mkdir -p "$lane_lint_root/.github/workflows"

        cp .github/workflow-candidates/*.yml "$lane_lint_root/.github/workflows/"

        git -C "$lane_lint_root" init --quiet

        actionlint_bin="$(go env GOPATH)/bin/actionlint"

