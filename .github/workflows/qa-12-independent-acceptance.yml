        \ \\\n  --min-sha \"${{ github.event.inputs.milestone1_live_reverify__min_sha || '4eb6adbe' }}\" \\\n  --json docs/delivery/milestone1-live-reverify-latest.json\
        \ \\\n  $EXTRA\n"
    - name: Upload live reverify artifacts
