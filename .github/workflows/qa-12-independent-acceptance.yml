      env:
        BACKEND_URL: https://gravitre-saas-backend-production.up.railway.app
        MIN_SHA: ${{ github.event.inputs.milestone1_live_reverify__min_sha || '4eb6adbe' }}
      run: "python3 - <<'PY'\nimport json, subprocess, sys, time, urllib.request\nbase = __import__('os').environ['BACKEND_URL'].rstrip('/')\n\
        minimum = __import__('os').environ['MIN_SHA'].strip().lower()\nfor attempt in range(36):\n    with urllib.request.urlopen(f\"\
        {base}/health\", timeout=30) as resp:\n        health = json.loads(resp.read().decode())\n    sha = str(health.get('git_sha')\
        \ or '').lower()\n    ok = sha.startswith(minimum)\n    if not ok:\n        try:\n            subprocess.run(['git',\
        \ 'merge-base', '--is-ancestor', minimum, sha], check=True, capture_output=True)\n            ok = True\n        except\
        \ subprocess.CalledProcessError:\n            ok = False\n    print(f\"attempt={attempt+1} git_sha={sha} need>={minimum}\
        \ ok={ok}\")\n    if ok:\n        sys.exit(0)\n    time.sleep(20)\nprint('Timed out waiting for prod deploy')\nsys.exit(1)\n\
        PY\n"
