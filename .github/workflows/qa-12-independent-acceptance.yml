          {"display_name": "Milestone 1 Live Reverify", "jobs": ["milestone1_live_reverify__live-reverify"]}, "plays-datasets-live-proof":
          {"display_name": "Plays + datasets authenticated live proof", "jobs": ["plays_datasets_live_proof__live-read-proof"]},
          "plays-production-acceptance": {"display_name": "Plays production acceptance", "jobs": ["plays_production_acceptance__deterministic-contract",
          "plays_production_acceptance__authenticated-production-read"]}, "release1-live-memory-liveness": {"display_name":
          "Release 1 live memory source revocation", "jobs": ["release1_live_memory_liveness__memory-liveness"]}, "release1-live-public-mcp":
          {"display_name": "Release 1 public MCP and SSRF live verification", "jobs": ["release1_live_public_mcp__public-mcp"]}}'
        JOB_RESULTS: '{"eco_001_deployed_ingress__deployed-ingress-preflight": {"result": "${{ needs.eco_001_deployed_ingress__deployed-ingress-preflight.result
