name: MSP Enrichment Workflow Live

# Live verify Prospecting pack MSP Clay→HubSpot enrichment workflow on production.
on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual trigger"
        required: false
        default: "post-merge verification"
  push:
    branches: [main]
    paths:
      - "scripts/smoke-msp-enrichment-workflow-live.py"
      - ".github/workflows/msp-enrichment-workflow-live.yml"
      - "backend/app/marketplace/workflows/msp_enrichment_workflow.py"
      - "backend/app/marketplace/intelligence_packs/prospecting_install.py"

concurrency:
  group: msp-enrichment-workflow-live
  cancel-in-progress: false

jobs:
  msp-enrichment-live:
    name: MSP enrichment workflow live smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run MSP enrichment workflow live smoke
        env:
          BACKEND_URL: https://gravitre-saas-backend-production.up.railway.app
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          CONNECTOR_SECRETS_ENCRYPTION_KEY: ${{ secrets.CONNECTOR_SECRETS_ENCRYPTION_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Missing SUPABASE_URL, SUPABASE_ANON_KEY, or SUPABASE_SERVICE_ROLE_KEY in repo Actions secrets." >&2
            exit 1
          fi
          set +e
          python scripts/smoke-msp-enrichment-workflow-live.py
          CODE=$?
          set -e
          echo "smoke_exit=$CODE"
          # 0 = PASS, 2 = PARTIAL (seeded but Clay missing) — both upload artifact
          if [ "$CODE" -ne 0 ] && [ "$CODE" -ne 2 ]; then
            exit "$CODE"
          fi
          exit 0

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msp-enrichment-workflow-live
          path: docs/delivery/msp-enrichment-workflow-live.json
          if-no-files-found: ignore
