name: Migration history recovery
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/migration_recovery/**'
      - '.github/workflows/migration-history-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: migration-history-recovery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  recorded-history-replay:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: supabase/setup-cli@v3
        with:
          version: 2.121.0
      - name: Install PostgreSQL driver
        run: python -m pip install 'psycopg[binary]==3.2.9' 'fastapi==0.115.12'
      - name: Export original production migration metadata (read only)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          RECOVERY_SOURCE_PROJECT_REF: smyeexlrqdpymwjmgzqu
          RECOVERY_HISTORY_PATH: ${{ runner.temp }}/migration-recovery/original-history.json
        run: python scripts/migration_recovery/export_history.py
      - name: Start empty local Supabase (no application migrations or seed)
        run: |
          mkdir -p "$RUNNER_TEMP/migration-recovery/local/supabase/migrations"
          cp supabase/config.toml "$RUNNER_TEMP/migration-recovery/local/supabase/config.toml"
          cp -a supabase/templates "$RUNNER_TEMP/migration-recovery/local/supabase/templates"
          sed -i 's/major_version = 15/major_version = 17/' "$RUNNER_TEMP/migration-recovery/local/supabase/config.toml"
          cd "$RUNNER_TEMP/migration-recovery/local"
          supabase start -x studio,imgproxy,edge-runtime,logflare,vector
      - name: Pin local pgvector extension to production version (0.8.0)
        run: |
          # The local Supabase PG17 image ships 0.8.2, while production uses
          # pgvector 0.8.0. Build the exact extension version in disposable
          # CI PostgreSQL, rather than exempting version drift from parity.
          git clone --depth 1 --branch v0.8.0 https://github.com/pgvector/pgvector.git "$RUNNER_TEMP/pgvector-0.8.0"
          bash scripts/migration_recovery/install_pgvector.sh "$RUNNER_TEMP/pgvector-0.8.0"
      - name: Reproduce original history failure and validate exact SQLSTATE
        run: |
          python scripts/migration_recovery/replay.py --history "$RUNNER_TEMP/migration-recovery/original-history.json" --database-url postgresql://postgres:postgres@127.0.0.1:54322/postgres --report test-results/migration-history-original.json && exit 1
          python - <<'PYCODE'
          import json
          report=json.load(open('test-results/migration-history-original.json'))
          assert report['failure']['version']=='20250220000006', report
          assert report['failure']['sqlstate']=='42P13', report
          assert len(report['applied'])==18, report
          PYCODE
      - name: Recreate empty local database and build corrected replay candidate
        run: |
          supabase db reset --local --no-seed --workdir "$RUNNER_TEMP/migration-recovery/local"
          # A Supabase reset can recreate the database container, dropping the
          # previously installed 0.8.0 control and SQL files. Reinstall into
          # the running container before CREATE EXTENSION / version assertions.
          bash scripts/migration_recovery/install_pgvector.sh "$RUNNER_TEMP/pgvector-0.8.0"
          python scripts/migration_recovery/candidate.py "$RUNNER_TEMP/migration-recovery/original-history.json" "$RUNNER_TEMP/migration-recovery/candidate-history.json"
      - name: Replay all corrected recorded migrations on real PostgreSQL
        run: >-
          python scripts/migration_recovery/replay.py
          --history "$RUNNER_TEMP/migration-recovery/candidate-history.json"
          --database-url postgresql://postgres:postgres@127.0.0.1:54322/postgres
          --report test-results/migration-history-candidate.json
      - name: Restore original migration metadata backup and verify exact SQL arrays
        run: >-
          python scripts/migration_recovery/rollback_drill.py
          postgresql://postgres:postgres@127.0.0.1:54322/postgres
          "$RUNNER_TEMP/migration-recovery/original-history.json"
          test-results/migration-history-rollback-drill.json
      - name: Reconcile isolated schema to captured production definitions and verify parity
        run: >-
          python scripts/migration_recovery/validate_baseline.py
          postgresql://postgres:postgres@127.0.0.1:54322/postgres
          "$RUNNER_TEMP/migration-recovery"
          test-results/migration-history-schema-parity.json
      - name: Generate data-free baseline from verified isolated schema
        run: |
          supabase db dump --help > "$RUNNER_TEMP/migration-recovery/db-dump-help.txt"
          supabase db dump --local --schema public --file "$GITHUB_WORKSPACE/test-results/production-schema-baseline.sql" --workdir "$RUNNER_TEMP/migration-recovery/local"
          python scripts/migration_recovery/append_dependencies.py "$RUNNER_TEMP/migration-recovery/production-inventory.json" test-results/production-schema-baseline.sql
          sha256sum test-results/production-schema-baseline.sql > test-results/production-schema-baseline.sha256
      - name: Restore baseline into a fresh database and verify without repairs
        run: |
          supabase db reset --local --no-seed --workdir "$RUNNER_TEMP/migration-recovery/local"
          # A Supabase reset can recreate the database container, dropping the
          # previously installed 0.8.0 control and SQL files. Reinstall into
          # the running container before CREATE EXTENSION / version assertions.
          bash scripts/migration_recovery/install_pgvector.sh "$RUNNER_TEMP/pgvector-0.8.0"
          docker exec -i supabase_db_gravitre-operator-ai psql -U postgres -d postgres -v ON_ERROR_STOP=1 < test-results/production-schema-baseline.sql
          python scripts/migration_recovery/validate_baseline.py postgresql://postgres:postgres@127.0.0.1:54322/postgres "$RUNNER_TEMP/migration-recovery" test-results/migration-history-baseline-restore.json --verify-only
      - name: Real PostgreSQL concurrency, authorization and fail-closed acceptance on restored baseline
        run: >-
          python scripts/migration_recovery/acceptance.py
          postgresql://postgres:postgres@127.0.0.1:54322/postgres
          test-results/migration-history-acceptance.json
      - name: Prove failed atomic metadata replacement preserves every original SQL array
        run: |
          # The pinned CLI squash command edits local files only. It does NOT
          # replace remote history; never treat its success as rollback proof.
          python scripts/migration_recovery/metadata_drill.py prepare postgresql://postgres:postgres@127.0.0.1:54322/postgres "$RUNNER_TEMP/migration-recovery/original-history.json" 20261022162553 test-results/migration-history-atomic-baseline.json
          if python scripts/migration_recovery/atomic_baseline.py postgresql://postgres:postgres@127.0.0.1:54322/postgres "$RUNNER_TEMP/migration-recovery/original-history.json" 20261022162553 test-results/production-schema-baseline.sql; then
            echo 'Expected rejected baseline INSERT; refusing an unproven rollback.'
            exit 1
          fi
          python scripts/migration_recovery/metadata_drill.py check-rollback postgresql://postgres:postgres@127.0.0.1:54322/postgres "$RUNNER_TEMP/migration-recovery/original-history.json" 20261022162553 test-results/migration-history-atomic-baseline.json
      - name: Prove successful atomic replacement changes only disposable metadata
        run: |
          python scripts/migration_recovery/atomic_baseline.py postgresql://postgres:postgres@127.0.0.1:54322/postgres "$RUNNER_TEMP/migration-recovery/original-history.json" 20261022162553 test-results/production-schema-baseline.sql
          python scripts/migration_recovery/metadata_drill.py check-success postgresql://postgres:postgres@127.0.0.1:54322/postgres "$RUNNER_TEMP/migration-recovery/original-history.json" 20261022162553 test-results/migration-history-atomic-baseline.json
          python scripts/migration_recovery/validate_baseline.py postgresql://postgres:postgres@127.0.0.1:54322/postgres "$RUNNER_TEMP/migration-recovery" test-results/migration-history-atomic-schema-unchanged.json --verify-only
      - name: Preserve sanitized failure or success evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-history-replay
          path: |
            test-results/migration-history-*.json
            test-results/production-schema-baseline.*
          if-no-files-found: warn
          retention-days: 14
      - name: Stop local compute and remove original SQL export
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/migration-recovery/local/supabase/config.toml" ]; then
            supabase stop --workdir "$RUNNER_TEMP/migration-recovery/local" --no-backup
          fi
          rm -f "$RUNNER_TEMP/migration-recovery/"*.json
