name: Master QA | QA10-QA20 Durable Outcome Ownership

on:
  pull_request:
    paths:
      - "backend/app/services/execution_outcome.py"
      - "backend/app/services/outcome_*.py"
      - "backend/app/services/objective_capability_composer.py"
      - "backend/app/services/agent_delegation_strategy.py"
      - "backend/app/services/swarm_coordinator_service.py"
      - "backend/app/services/chat_connector_execution_service.py"
      - "backend/app/services/chat_orchestration_*.py"
      - "backend/app/services/conversational_execution_service.py"
      - "backend/app/services/execution_plan_service.py"
      - "backend/app/services/react_execution_strategy.py"
      - "backend/app/services/response_composer.py"
      - "backend/app/services/notification_email_service.py"
      - "backend/app/services/tool_registry.py"
      - "backend/app/services/tool_service.py"
      - "backend/app/services/pipecat_voice/voice_tool_narration.py"
      - "backend/app/operators/agent_intelligence.py"
      - "backend/app/operators/agent_jobs.py"
      - "backend/app/workflows/**"
      - "backend/tests/services/test_outcome_ownership_*.py"
      - "backend/tests/workflows/test_outcome_ownership_*.py"
      - ".github/workflows/outcome-ownership-contract.yml"
  push:
    branches: [main]
    paths:
      - "backend/app/services/execution_outcome.py"
      - "backend/app/services/outcome_*.py"
      - "backend/app/services/objective_capability_composer.py"
      - "backend/app/services/agent_delegation_strategy.py"
      - "backend/app/services/swarm_coordinator_service.py"
      - "backend/app/services/chat_connector_execution_service.py"
      - "backend/app/services/chat_orchestration_*.py"
      - "backend/app/services/conversational_execution_service.py"
      - "backend/app/services/execution_plan_service.py"
      - "backend/app/services/react_execution_strategy.py"
      - "backend/app/services/response_composer.py"
      - "backend/app/services/notification_email_service.py"
      - "backend/app/services/tool_registry.py"
      - "backend/app/services/tool_service.py"
      - "backend/app/services/pipecat_voice/voice_tool_narration.py"
      - "backend/app/operators/agent_intelligence.py"
      - "backend/app/operators/agent_jobs.py"
      - "backend/app/workflows/**"
      - "backend/tests/services/test_outcome_ownership_*.py"
      - "backend/tests/workflows/test_outcome_ownership_*.py"
      - ".github/workflows/outcome-ownership-contract.yml"

jobs:
  outcome-ownership:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      # Disposable GitHub runner: do not retain large ML/CUDA wheels or compile bytecode.
      PIP_NO_CACHE_DIR: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reclaim unused hosted toolchains and verify available disk
        run: |
          set -euo pipefail
          echo "Disk before cleanup:"
          df -h / /tmp
          # These preinstalled SDKs are unused by the Python-only contract suite.
          # Never remove Python, GitHub Actions tooling, Docker or repository data.
          for dir in /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/powershell; do
            if [ -d "$dir" ]; then
              echo "Removing unused SDK: $dir"
              sudo rm -rf -- "$dir"
            fi
          done
          python -m pip cache purge || true
          sudo apt-get clean
          echo "Disk after cleanup:"
          df -h / /tmp
          available_kib=$(df -Pk / | awk 'NR==2 {print $4}')
          if [ "$available_kib" -lt 10485760 ]; then
            echo "::error::Outcome Ownership runner has less than 10 GiB free before dependency install (KiB=$available_kib)"
            exit 1
          fi
      - name: Install backend test dependencies without wheel cache
        run: |
          set -euo pipefail
          echo "Disk before dependencies:"
          df -h / /tmp
          python -m pip install --no-cache-dir --no-compile -r requirements-dev.txt
          echo "Disk after dependencies:"
          df -h / /tmp
          python -m pip check
      - name: Outcome Ownership contract (every outcome-ownership suite)
        run: >
          python -m pytest -q
          tests/services/test_objective_capability_composer.py
          $(ls tests/services/test_outcome_ownership_*.py tests/workflows/test_outcome_ownership_*.py)
