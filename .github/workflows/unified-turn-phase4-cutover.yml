name: Unified Turn Phase 4 Cutover

on:
  workflow_dispatch:
    inputs:
      enable_live:
        description: "Set UNIFIED_TURN_LIVE_ENABLED (true/false)"
        required: true
        default: "true"
      railway_environment:
        description: "Railway environment name"
        required: false
        default: "production"

concurrency:
  group: unified-turn-phase4-cutover
  cancel-in-progress: true

jobs:
  cutover:
    name: Enable LIVE + deploy + probe
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install Railway CLI
        run: npm install -g @railway/cli@4.65.0

      - name: Set LIVE flag and force new deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_ENV: ${{ inputs.railway_environment }}
          ENABLE_LIVE: ${{ inputs.enable_live }}
        run: |
          set -euo pipefail
          ENV_NAME="${RAILWAY_ENV:-production}"
          SVC="gravitre-saas-backend"
          FULL="$(git rev-parse HEAD)"
          echo "LIVE=$ENABLE_LIVE svc=$SVC env=$ENV_NAME tip=$FULL"
          railway variables set "UNIFIED_TURN_LIVE_ENABLED=${ENABLE_LIVE}" --service "$SVC" --environment "$ENV_NAME"
          railway variables set "UNIFIED_TURN_SHADOW_ENABLED=true" --service "$SVC" --environment "$ENV_NAME"
          # Do not set GIT_SHA — it can pin /health when RAILWAY_GIT_COMMIT_SHA is absent.
          railway variables --service "$SVC" --environment "$ENV_NAME" --json > /tmp/vars.json || true
          python3 scripts/print_unified_turn_railway_vars.py /tmp/vars.json
          # Prefer GitHub→Railway auto-deploy (railway up often fails streaming Metal builds).
          # Kick a redeploy so the already-set LIVE var loads into a new process.
          railway redeploy --service "$SVC" --environment "$ENV_NAME" --yes || true
          python3 scripts/wait_unified_turn_health.py \
            --expect-sha-prefix "$(echo "$FULL" | cut -c1-8)" \
            --expect-live "${ENABLE_LIVE}" \
            --timeout-s 1200

      - name: Probe unified_turn.live.completed
        if: inputs.enable_live == 'true'
        env:
          LIVE_API_BASE: https://api.gravitre.app
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          OAUTH_SMOKE_ORG_ID: ${{ secrets.OAUTH_SMOKE_ORG_ID }}
        run: python3 scripts/verify-unified-turn-phase4-live.py

      - name: Upload Phase 4 probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unified-turn-phase4-cutover
          path: docs/delivery/unified-turn-phase4-live-probe.json
          if-no-files-found: ignore
