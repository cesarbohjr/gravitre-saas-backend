name: Unified Turn Phase 4 Cutover

on:
  workflow_dispatch:
    inputs:
      enable_live:
        description: "Set UNIFIED_TURN_LIVE_ENABLED (true/false)"
        required: true
        default: "true"
      railway_environment:
        description: "Railway environment name"
        required: false
        default: "production"

concurrency:
  group: unified-turn-phase4-cutover
  cancel-in-progress: true

jobs:
  cutover:
    name: Enable LIVE + redeploy + probe
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install Railway CLI
        run: npm install -g @railway/cli@4.65.0

      - name: Set LIVE flag and restart prod process
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_ENV: ${{ inputs.railway_environment }}
          ENABLE_LIVE: ${{ inputs.enable_live }}
        run: |
          set -euo pipefail
          ENV_NAME="${RAILWAY_ENV:-production}"
          SVC="gravitre-saas-backend"
          echo "LIVE=$ENABLE_LIVE svc=$SVC env=$ENV_NAME"
          railway variables set "UNIFIED_TURN_LIVE_ENABLED=${ENABLE_LIVE}" --service "$SVC" --environment "$ENV_NAME"
          railway variables set "UNIFIED_TURN_SHADOW_ENABLED=true" --service "$SVC" --environment "$ENV_NAME"
          # Never set GIT_SHA — it pins /health when RAILWAY_GIT_COMMIT_SHA is absent.
          railway variables delete GIT_SHA --service "$SVC" --environment "$ENV_NAME" || true
          # Force a config change so Railway must restart even if the image digest is unchanged.
          NONCE="$(date -u +%Y%m%dT%H%M%SZ)-$RANDOM"
          railway variables set "UNIFIED_TURN_RESTART_NONCE=${NONCE}" --service "$SVC" --environment "$ENV_NAME"
          echo "restart_nonce=$NONCE"
          railway variables --service "$SVC" --environment "$ENV_NAME" --json > /tmp/vars.json || true
          python3 scripts/print_unified_turn_railway_vars.py /tmp/vars.json
          set +e
          railway redeploy --service "$SVC" --environment "$ENV_NAME" --yes
          echo "railway_redeploy_exit=$?"
          set -e

      - name: Wait for LIVE (health flags and/or tip) then probe
        if: inputs.enable_live == 'true'
        env:
          LIVE_API_BASE: https://api.gravitre.app
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          OAUTH_SMOKE_ORG_ID: ${{ secrets.OAUTH_SMOKE_ORG_ID }}
        run: |
          set -euo pipefail
          # Tip may stay on 444371f9 (cutover code) while LIVE env loads via redeploy.
          # Prefer health live=true when schema tip is live; otherwise rely on audit probe.
          set +e
          python3 scripts/wait_unified_turn_health.py \
            --expect-sha-prefix 444371f9 \
            --expect-live true \
            --timeout-s 180 \
            --allow-missing-flag-keys
          python3 scripts/wait_unified_turn_health.py \
            --expect-sha-prefix "$(git rev-parse --short=8 HEAD)" \
            --expect-live true \
            --timeout-s 420 || true
          set -e
          # Poll probe up to ~10 minutes for process restart + audit.
          for i in $(seq 1 30); do
            echo "phase4_probe_attempt=$i"
            if python3 scripts/verify-unified-turn-phase4-live.py; then
              echo "phase4_probe PASS"
              exit 0
            fi
            sleep 20
          done
          echo "phase4_probe TIMEOUT" >&2
          exit 1

      - name: Upload Phase 4 probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unified-turn-phase4-cutover
          path: |
            docs/delivery/unified-turn-phase4-live-probe.json
            docs/delivery/unified-turn-phase4-live.json
          if-no-files-found: ignore
