name: Regenerate web lockfile
on:
  push:
    branches: [fix/vercel-build-profile-upload]
    paths:
      - apps/web/package.json
      - .github/workflows/regen-web-lockfile.yml
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Regenerate lockfile
        working-directory: apps/web
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - uses: actions/upload-artifact@v4
        with:
          name: regenerated-web-lockfile
          path: apps/web/pnpm-lock.yaml
