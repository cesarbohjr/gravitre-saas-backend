name: Auth Config Sync

on:
  workflow_dispatch:
    inputs:
      skip_vercel_deploy:
        description: Skip Vercel production deploy
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: auth-config-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync Supabase + Vercel auth config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require Supabase Management API token
        run: |
          if [[ -z "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ]]; then
            echo "::error::Missing GitHub secret SUPABASE_ACCESS_TOKEN. Run: npm run platform:github-secrets"
            exit 1
          fi

      - name: Configure auth via CLI/API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_PROJECT_NAME_HINT: gravitre
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT: gravitre-saas-backend
          NEXT_PUBLIC_APP_URL: https://gravitre.app
          # Same-origin auth proxy until auth.gravitre.app Supabase custom domain is activated
          NEXT_PUBLIC_SUPABASE_AUTH_URL: https://gravitre.app
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_PROJECT_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SKIP_VERCEL_DEPLOY: ${{ inputs.skip_vercel_deploy }}
        run: |
          chmod +x scripts/configure-auth-production.sh
          bash scripts/configure-auth-production.sh
