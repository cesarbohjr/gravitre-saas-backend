name: Snowflake isolated compatibility and security
on:
  pull_request:
    paths:
      - 'backend/requirements-extras-snowflake.txt'
      - 'backend/requirements-core.txt'
      - 'backend/requirements-extras-data.txt'
      - 'backend/requirements.txt'
      - '.github/workflows/snowflake-isolated-security.yml'
  workflow_dispatch:
jobs:
  snowflake-isolated:
    name: Snowflake isolated install and audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated connector
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-extras-snowflake.txt pip-audit
          python -m pip check
          python -c "import snowflake.connector; print('Snowflake connector imports successfully')"
      - name: Audit installed Snowflake environment (fail closed)
        working-directory: backend
        run: |
          python -m pip_audit --progress-spinner off
