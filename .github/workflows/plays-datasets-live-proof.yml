name: Plays + datasets authenticated live proof

on:
  workflow_dispatch:
    inputs:
      dataset_query:
        description: Public dataset metadata search query
        required: false
        default: customer support
      backend_url:
        description: Backend base URL
        required: false
        default: https://gravitre-saas-backend-production.up.railway.app

permissions:
  contents: read

jobs:
  live-read-proof:
    name: Authenticated GET-only proof
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      PLATFORM_LIVE_BEARER_TOKEN: ${{ secrets.PLATFORM_LIVE_BEARER_TOKEN }}
      PLATFORM_LIVE_ORG_ID: ${{ secrets.PLATFORM_LIVE_ORG_ID }}
      PLATFORM_LIVE_ENVIRONMENT: production
      DATASET_LIVE_QUERY: ${{ inputs.dataset_query }}
      BACKEND_URL: ${{ inputs.backend_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify authorized session is configured
        shell: bash
        run: |
          if [ -z "$PLATFORM_LIVE_BEARER_TOKEN" ]; then
            echo "::error::PLATFORM_LIVE_BEARER_TOKEN secret is not configured."
            exit 2
          fi
          if [ -z "$PLATFORM_LIVE_ORG_ID" ]; then
            echo "::error::PLATFORM_LIVE_ORG_ID secret is not configured."
            exit 2
          fi

      - name: Install proof dependency
        run: python -m pip install --disable-pip-version-check "httpx>=0.27,<1"

      - name: Run non-destructive live proof
        run: python scripts/verify-plays-datasets-live.py

      - name: Upload live proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plays-datasets-live-proof
          path: docs/delivery/plays-datasets-live-proof.json
          if-no-files-found: warn
