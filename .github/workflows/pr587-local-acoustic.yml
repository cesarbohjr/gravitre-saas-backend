name: PR587 local cancellation acoustic qualification (no provider credits)
on:
  pull_request:
    paths:
      - 'scripts/pr587_kws_qualification.py'
      - 'tests/test_pr587_kws_qualification.py'
      - '.github/workflows/pr587-local-acoustic.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  kws-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify fail-closed KWS configuration and score rules
        run: python -m unittest discover -s tests -p test_pr587_kws_qualification.py
      - name: Qualify candidate only if a pinned local model and full corpus exist
        run: python scripts/pr587_kws_qualification.py --output acceptance-results/pr587-kws-qualification.json
      - name: Publish blocked or qualified evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr587-kws-qualification
          path: acceptance-results/pr587-kws-qualification.json
          if-no-files-found: error
