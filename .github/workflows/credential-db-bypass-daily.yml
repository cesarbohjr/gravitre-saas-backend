name: Credential DB Bypass Guard (Daily)

# Recurring prod proof that restricted test credentials cannot raw-insert into
# customer orgs — independent of app-layer chokepoints and of code pushes.
on:
  schedule:
    - cron: "17 6 * * *" # 06:17 UTC daily
  workflow_dispatch:

concurrency:
  group: credential-db-bypass-daily
  cancel-in-progress: false

jobs:
  db-bypass-guard:
    name: Prod DB bypass refuse
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Record prod health git_sha
        env:
          BACKEND_URL: https://gravitre-saas-backend-production.up.railway.app
        run: |
          curl -sf --max-time 30 "${BACKEND_URL}/health" | tee /tmp/health.json
          python3 - <<'PY'
          import json
          health = json.load(open("/tmp/health.json"))
          print(f"prod_git_sha={health.get('git_sha')}")
          PY

      - name: Run DB credential-bypass guard against prod
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          APP_ENV: production
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Missing SUPABASE_URL or SUPABASE_SERVICE_ROLE_KEY secrets." >&2
            exit 1
          fi
          python scripts/verify-credential-db-bypass-guard.py

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: module-0-db-guard-live
          path: docs/delivery/module-0-db-guard-live.json
          if-no-files-found: ignore
