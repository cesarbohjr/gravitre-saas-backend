name: Phase 3 and Phase 5 evidence gates
on:
  pull_request:
    paths:
      - 'backend/scripts/phase3_offline_12_scenarios.py'
      - 'backend/scripts/phase5_learning_evidence_gate.py'
      - '.github/workflows/phase3-phase5-evidence.yml'
  workflow_dispatch:
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
      - name: Strict Phase 3 contract evidence
        run: python scripts/phase3_offline_12_scenarios.py
        env:
          PHASE3_OUTPUT_DIR: ${{ runner.temp }}/phase3-evidence
          OPENAI_API_KEY: fake-phase3
          ANTHROPIC_API_KEY: fake-phase3
          GEMINI_API_KEY: fake-phase3
      - name: Strict Phase 5 learning prerequisites
        run: python scripts/phase5_learning_evidence_gate.py
        env:
          PHASE5_OUTPUT_DIR: ${{ runner.temp }}/phase5-evidence
          OPENAI_API_KEY: fake-phase5
          ANTHROPIC_API_KEY: fake-phase5
          GEMINI_API_KEY: fake-phase5
      - name: Upload evidence on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3-phase5-evidence-${{ github.sha }}
          path: |
            ${{ runner.temp }}/phase3-evidence/
            ${{ runner.temp }}/phase5-evidence/
          if-no-files-found: warn
