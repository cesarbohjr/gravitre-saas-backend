name: Native Langfuse delivery certification
on:
  pull_request:
    paths:
      - 'backend/app/services/native_runtime/**'
      - 'backend/app/services/native_agent_adapters.py'
      - 'backend/native-workers/langfuse_contract.py'
      - '.github/workflows/native-langfuse-certification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TELEMETRY_ENABLED: 'false'
      OTEL_SDK_DISABLED: 'true'
      LANGFUSE_INIT_ORG_ID: native-fixture-org
      LANGFUSE_INIT_ORG_NAME: Isolated CI fixture
      LANGFUSE_INIT_PROJECT_ID: native-fixture-project
      LANGFUSE_INIT_PROJECT_NAME: Synthetic metrics only
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: pk-lf-native-fixture
      LANGFUSE_INIT_PROJECT_SECRET_KEY: sk-lf-native-fixture-local-only
      LANGFUSE_INIT_USER_EMAIL: native-fixture@example.invalid
      LANGFUSE_INIT_USER_PASSWORD: isolated-fixture-not-a-live-credential
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install application transport dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Prepare pinned isolated actual Langfuse server
        run: |
          curl --fail --location --silent --show-error https://raw.githubusercontent.com/langfuse/langfuse/d89f49b82620dc9a773bd2f97449289f4f6c199e/docker-compose.yml -o "$RUNNER_TEMP/langfuse-upstream.yml"
          python - <<'PY'
          import os,pathlib,yaml
          source=pathlib.Path(os.environ['RUNNER_TEMP'])/'langfuse-upstream.yml'
          config=yaml.safe_load(source.read_text())
          for name,service in config['services'].items():
              service['ports']=[p if p.startswith('127.0.0.1:') else '127.0.0.1:'+p for p in service.get('ports',[])]
              if name in ('langfuse-web','langfuse-worker'):
                  service['image']=service['image'].rsplit(':',1)[0]+':4.71.0'
          config['networks']={'default':{'internal':True}}
          (source.parent/'langfuse-cert.yml').write_text(yaml.safe_dump(config))
          PY
          docker compose -p native-langfuse-cert -f "$RUNNER_TEMP/langfuse-cert.yml" up -d
      - name: Wait for the actual application
        run: |
          python - <<'PY'
          import time,urllib.request
          deadline=time.monotonic()+420
          while time.monotonic()<deadline:
              try:
                  with urllib.request.urlopen('http://127.0.0.1:3000/api/public/health',timeout=5) as r:
                      if r.status==200:break
              except Exception:pass
              time.sleep(3)
          else:raise SystemExit('Isolated Langfuse did not become healthy')
          PY
      - name: Verify real durable OTLP acknowledgement and deletion
        run: python backend/native-workers/langfuse_contract.py
      - uses: actions/upload-artifact@v4
        with:
          name: langfuse-delivery-certification
          path: langfuse-runtime-evidence.json
          if-no-files-found: error
      - name: Remove only this job's disposable services and volumes
        if: always()
        run: docker compose -p native-langfuse-cert -f "$RUNNER_TEMP/langfuse-cert.yml" down --volumes --remove-orphans
