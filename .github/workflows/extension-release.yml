name: Extension release

# Packs apps/extension and refreshes the rolling `extension-latest` GitHub
# release. Its stable asset URL is the "Download extension (.zip)" link on
# /features/extension and the setup guide:
# https://github.com/<repo>/releases/download/extension-latest/gravitre-extension.zip
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/extension/**"
      - "scripts/package-extension-chrome-store.py"
      - ".github/workflows/extension-release.yml"

permissions:
  contents: write

concurrency:
  group: extension-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pack extension
        run: |
          set -euo pipefail
          python scripts/package-extension-chrome-store.py
          cp apps/extension/dist/gravitre-extension-chrome.zip gravitre-extension.zip
          unzip -l gravitre-extension.zip | grep -q ' manifest.json$'

      - name: Publish to extension-latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(jq -r .version apps/extension/manifest.json)
          NOTES="Gravitre browser extension v${VERSION} (Chrome, Edge, Brave). Unzip, then Load unpacked: https://gravitre.app/docs/guides/how-to/browser-extension"
          if gh release view extension-latest >/dev/null 2>&1; then
            gh release upload extension-latest gravitre-extension.zip --clobber
            gh release edit extension-latest --title "Gravitre browser extension v${VERSION}" --notes "$NOTES"
          else
            gh release create extension-latest gravitre-extension.zip \
              --target "$GITHUB_SHA" --latest=false \
              --title "Gravitre browser extension v${VERSION}" --notes "$NOTES"
          fi
