name: Connector Governance

# Merge-blocking scoped suite for connector chat execution and governance debt shrink.
# Full CI (ci.yml) may still have known pre-existing failures — see docs/delivery/CI_TRIAGE_BUCKETS.md.

on:
  push:
    branches: [main]
    paths:
      - "backend/app/services/connector_*.py"
      - "backend/app/services/chat_connector*.py"
      - "backend/app/services/chat_orchestration_service.py"
      - "backend/app/connectors/action_catalog/**"
      - "backend/tests/services/test_connector_*.py"
      - "backend/tests/services/test_action_workflow_validation.py"
      - "backend/tests/services/test_chat_connector_execution.py"
      - "backend/tests/services/test_chat_orchestration.py"
      - "backend/tests/smoke/test_connector_action_smoke.py"
      - ".github/workflows/connector-governance.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/app/services/connector_*.py"
      - "backend/app/services/chat_connector*.py"
      - "backend/app/services/chat_orchestration_service.py"
      - "backend/app/connectors/action_catalog/**"
      - "backend/tests/services/test_connector_*.py"
      - "backend/tests/services/test_action_workflow_validation.py"
      - "backend/tests/services/test_chat_connector_execution.py"
      - "backend/tests/services/test_chat_orchestration.py"
      - "backend/tests/smoke/test_connector_action_smoke.py"
      - ".github/workflows/connector-governance.yml"

concurrency:
  group: connector-governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  connector-governance:
    name: Connector governance (scoped pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run scoped connector governance suite
        run: |
          python - <<'PY'
          from app.services.connector_registration_contract import CONNECTOR_GOVERNANCE_PYTEST_TARGETS
          print(" ".join(CONNECTOR_GOVERNANCE_PYTEST_TARGETS))
          PY
          python -m pytest \
            tests/services/test_connector_registration_contract.py \
            tests/services/test_connector_registry_verification.py \
            tests/services/test_connector_api_import_boundaries.py \
            tests/services/test_connector_action_workflows.py \
            tests/services/test_connector_parameter_inference.py \
            tests/services/test_action_workflow_validation.py \
            tests/services/test_connector_capability_analysis.py \
            tests/services/test_connector_session_state.py \
            tests/services/test_chat_connector_execution.py \
            tests/services/test_chat_orchestration.py \
            tests/smoke/test_connector_action_smoke.py \
            -q
        env:
          APP_ENV: dev
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_ANON_KEY: anon-test
          SUPABASE_SERVICE_ROLE_KEY: service-role-test
          SUPABASE_JWT_SECRET: jwt-secret-test
          OPENAI_API_KEY: sk-test-openai

      - name: Print registration contract summary
        if: always()
        run: |
          python - <<'PY'
          import json
          from app.services.connector_registration_contract import registration_contract_summary
          print(json.dumps(registration_contract_summary(), indent=2))
          PY
