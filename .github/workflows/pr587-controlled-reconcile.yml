name: PR587 controlled main reconciliation
on:
  pull_request:
    paths:
      - '.github/workflows/pr587-controlled-reconcile.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reconcile:
    if: github.head_ref == 'feat/phase2-dialogue-intelligence' || github.ref_name == 'feat/phase2-dialogue-intelligence'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase2-dialogue-intelligence
          fetch-depth: 0
          persist-credentials: true
      - name: Merge current main safely, retaining reviewed conflict resolutions
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          BEFORE="$(git rev-parse HEAD)"
          MAIN="$(git rev-parse origin/main)"
          echo "voice_head=$BEFORE" >> "$GITHUB_STEP_SUMMARY"
          echo "main_head=$MAIN" >> "$GITHUB_STEP_SUMMARY"
          if git merge --no-commit --no-ff origin/main; then
            echo 'Clean merge'
          else
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            if [ "${#conflicts[@]}" -eq 0 ]; then
              echo 'Merge failed without recognizable conflict list' >&2; exit 1
            fi
            for file in "${conflicts[@]}"; do
              case "$file" in
                .github/workflows/ci.yml|backend/tests/billing/test_stripe_meter_outbox.py)
                  # The feature branch already contains the content-aware
                  # resolution of main's CI and current-month billing changes.
                  git checkout --ours -- "$file"
                  git add -- "$file"
                  ;;
                *) echo "Unreviewed conflict: $file" >&2; exit 1 ;;
              esac
            done
            test -z "$(git diff --name-only --diff-filter=U)"
          fi
          # Verify neither reviewed CI expectation disappeared.
          grep -q 'Vercel frontend build selection' .github/workflows/ci.yml
          grep -q 'timeout-minutes: 45' .github/workflows/ci.yml
          grep -q 'monthrange' backend/tests/billing/test_stripe_meter_outbox.py
          if git diff --cached --quiet; then
            echo 'No staged changes to merge'; exit 1
          fi
          git commit -m 'merge: reconcile main browser fallback with PR587 voice security'
          git merge-base --is-ancestor "$MAIN" HEAD
          git merge-base --is-ancestor "$BEFORE" HEAD
          git push origin HEAD:feat/phase2-dialogue-intelligence
          echo "combined_head=$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
