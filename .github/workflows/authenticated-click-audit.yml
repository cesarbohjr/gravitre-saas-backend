# Prompt 3 Phase 2 — standing authenticated deep-surface click-audit.
# Nightly + manual. Uses smoke SA against production (not a one-off).
name: Authenticated Click Audit

on:
  schedule:
    - cron: "0 7 * * *" # daily 07:00 UTC
  workflow_dispatch:
  push:
    paths:
      - "scripts/prompt3-authenticated-click-audit.js"
      - "scripts/click-audit.js"
      - "scripts/auth-session-bootstrap.py"
      - ".github/workflows/authenticated-click-audit.yml"
      - "apps/web/lib/app-routes.ts"
      - "apps/web/lib/settings-sections.ts"
      - "apps/web/components/gravitre/sidebar-nav-config.ts"

concurrency:
  group: authenticated-click-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deep-surface-click-audit:
    name: Prompt3 authenticated surfaces
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install root deps + Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Install python deps for auth bootstrap
        run: |
          python -m pip install --upgrade pip
          pip install httpx python-dotenv

      - name: Bootstrap smoke SA password
        id: auth
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLICK_AUDIT_EMAIL: conversation-smoke-sa@gravitre.app
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Missing Supabase secrets — skipping live crawl"
            echo "skip=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python scripts/auth-session-bootstrap.py
          EMAIL=$(python -c "import json; print(json.load(open('docs/delivery/_phase4-auth-session.json'))['email'])")
          PASS=$(python -c "import json; print(json.load(open('docs/delivery/_phase4-auth-session.json'))['password'])")
          echo "email=$EMAIL" >> "$GITHUB_OUTPUT"
          echo "::add-mask::$PASS"
          echo "password=$PASS" >> "$GITHUB_OUTPUT"
          echo "skip=0" >> "$GITHUB_OUTPUT"

      - name: Run deep-surface click audit (production)
        if: steps.auth.outputs.skip != '1'
        env:
          CLICK_AUDIT_EMAIL: ${{ steps.auth.outputs.email }}
          CLICK_AUDIT_PASSWORD: ${{ steps.auth.outputs.password }}
          CLICK_AUDIT_OUT: docs/delivery/prompt3-phase2-click-audit-live.json
        run: node scripts/prompt3-authenticated-click-audit.js https://gravitre.app

      - name: Upload findings
        if: always() && steps.auth.outputs.skip != '1'
        uses: actions/upload-artifact@v4
        with:
          name: prompt3-click-audit
          path: docs/delivery/prompt3-phase2-click-audit-live.json
          if-no-files-found: ignore
