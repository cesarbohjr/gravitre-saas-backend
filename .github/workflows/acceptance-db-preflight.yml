name: Prepare acceptance database initialization

on:
  workflow_dispatch:
    inputs:
      verified_migration_run_id:
        description: 'Successful Migration history recovery run with data-free baseline artifact'
        required: true
        default: '39929148399'
        type: string

permissions:
  contents: read
  actions: read

jobs:
  schema-preflight:
    name: Verify baseline and dedicated acceptance database (read only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the verified baseline artifact
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.verified_migration_run_id }}
        run: |
          case "$SOURCE_RUN_ID" in
            ''|*[!0-9]*) echo 'Invalid run ID'; exit 2 ;;
          esac
          mkdir -p acceptance-baseline
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name migration-history-replay --dir acceptance-baseline
      - name: Verify baseline checksum and ensure source does not contain user data
        run: |
          python scripts/prepare_acceptance_baseline.py acceptance-baseline
      - name: Verify remote target and migration state using read-only management API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          ACCEPTANCE_PROJECT_REF: aadnwmjzrmbvadszroqt
        run: |
          python scripts/check_acceptance_remote_readonly.py
      - name: Publish preflight evidence, never database credentials
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-init-preflight-${{ github.sha }}
          path: acceptance-baseline/readiness-report.json
          retention-days: 7
          if-no-files-found: ignore

# Deliberately NO remote SQL execution or database linking in this workflow.
# A separate reviewed, target-pinned deployment procedure is required.
