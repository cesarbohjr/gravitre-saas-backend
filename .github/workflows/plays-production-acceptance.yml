name: Plays production acceptance

on:
  workflow_dispatch:
    inputs:
      backend_url:
        description: Backend base URL
        required: false
        default: https://gravitre-saas-backend-production.up.railway.app

permissions:
  contents: read

jobs:
  deterministic-contract:
    name: Plays architecture + truth contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install backend test dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Run Plays regression battery and catalog-wide synthetic audit inventory
        working-directory: backend
        env:
          PLAYS_AUDIT_REPORT_PATH: ../plays-synthetic-audit-inventory.json
        run: python -m pytest -q tests/test_play_*.py tests/routers/test_plays.py
      - name: Upload Play-by-Play audit inventory (not E2E certification)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plays-synthetic-audit-inventory
          path: plays-synthetic-audit-inventory.json
          if-no-files-found: warn

  authenticated-production-read:
    # Gate 1 of 3: automated read-only acceptance on the smoke org. Owner-tenant
    # read-only acceptance and Plays execution acceptance are separate gates.
    name: Authenticated non-destructive production proof
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      PLATFORM_LIVE_ENVIRONMENT: production
      BACKEND_URL: ${{ inputs.backend_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install proof dependencies
        run: python -m pip install --disable-pip-version-check "httpx>=0.27,<1" "PyJWT>=2.8,<3" python-dotenv supabase
      # Short-lived session for the isolated smoke-org service account, minted the
      # same way as the AI hardening smoke and Voice SLO probe. Valid for 10 minutes,
      # masked in the log, never stored. The org and actor come from the conversation
      # write guard; nothing is provisioned and the operator org is refused.
      - name: Mint short-lived smoke-org session
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
        run: python scripts/mint_smoke_org_session.py --github-env
      - name: Verify production without mutation
        run: python scripts/verify-plays-production.py
      - name: Clear session and check evidence for token leaks
        if: always()
        shell: bash
        run: |
          if [ -n "${PLATFORM_LIVE_BEARER_TOKEN:-}" ] && [ -f docs/delivery/plays-production-acceptance.json ] && grep -qF "$PLATFORM_LIVE_BEARER_TOKEN" docs/delivery/plays-production-acceptance.json; then
            echo "::error::evidence file contains the session token"; rm -f docs/delivery/plays-production-acceptance.json; exit 1
          fi
          echo "PLATFORM_LIVE_BEARER_TOKEN=" >> "$GITHUB_ENV"
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plays-production-acceptance
          path: docs/delivery/plays-production-acceptance.json
          if-no-files-found: error
