name: Plays production acceptance

on:
  workflow_dispatch:
    inputs:
      backend_url:
        description: Backend base URL
        required: false
        default: https://gravitre-saas-backend-production.up.railway.app

permissions:
  contents: read

jobs:
  deterministic-contract:
    name: Plays architecture + truth contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install backend test dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Run Plays regression battery
        working-directory: backend
        run: python -m pytest -q tests/test_play_*.py tests/routers/test_plays.py

  authenticated-production-read:
    name: Authenticated non-destructive production proof
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      # Unattended runs mint a 10-minute token for the isolated smoke-org service
      # account in-process; no long-lived Plays credential is stored. Manual owner
      # runs can still pass PLATFORM_LIVE_BEARER_TOKEN locally instead.
      PLAYS_ACCEPTANCE_AUTH: smoke-org
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
      PLATFORM_LIVE_ENVIRONMENT: production
      BACKEND_URL: ${{ inputs.backend_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Require signing configuration
        run: |
          test -n "$SUPABASE_URL" || (echo "::error::Missing SUPABASE_URL secret" && exit 2)
          test -n "$SUPABASE_JWT_SECRET" || (echo "::error::Missing SUPABASE_JWT_SECRET secret" && exit 2)
      - run: pip install "httpx>=0.27,<1" "PyJWT>=2.8,<3" python-dotenv
      - name: Verify production without mutation
        run: python scripts/verify-plays-production.py
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plays-production-acceptance
          path: docs/delivery/plays-production-acceptance.json
          if-no-files-found: error
