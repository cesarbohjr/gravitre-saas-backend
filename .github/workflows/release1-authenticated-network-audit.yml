name: Release 1 authenticated production network credential audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release1-authenticated-network-audit.yml"
      - "scripts/verify_release1_authenticated_network.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  network-credential-audit:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "PyJWT>=2.8,<3" "supabase>=2,<3"
      - name: Mint isolated authenticated actor
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
        run: python3 scripts/mint_smoke_org_session.py --github-env
      - name: Inspect live browser assets and authenticated responses
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
        run: python3 scripts/verify_release1_authenticated_network.py
      - name: Upload status-only audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release1-authenticated-network
          path: docs/delivery/release1-authenticated-network-audit.json
          if-no-files-found: ignore
