name: Release 1 production smoke

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release1-production-smoke.yml"
      - "scripts/verify-release1-production-smoke.py"
  workflow_dispatch:
  workflow_run:
    workflows: ["Production release verification"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}
          persist-credentials: false
      - name: Clear stale evidence
        run: rm -f docs/delivery/release1-production-smoke.json
      - name: Probe production anonymously
        env:
          EXPECT_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
        run: |
          set -euo pipefail
          python3 scripts/verify-release1-production-smoke.py \
            --web-base https://gravitre.app \
            --api-health https://api.gravitre.app/health \
            --expect-sha "$EXPECT_SHA"
      - name: Upload Release 1 smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release1-production-smoke
          path: docs/delivery/release1-production-smoke.json
          if-no-files-found: error
