name: Supabase migration safety

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/supabase-migration-safety.yml'
      - 'docs/delivery/AI_RELEASE_INSTRUCTIONS.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-migration-safety-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  validate-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check migration version uniqueness and file format
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re, sys
          root = pathlib.Path("supabase/migrations")
          if not root.is_dir():
              sys.exit("Missing supabase/migrations")
          versions = {}
          bad = []
          for f in root.iterdir():
              if not f.is_file() or f.suffix != ".sql":
                  continue
              m = re.fullmatch(r"(\d{8,14})_[A-Za-z0-9_]+\.sql", f.name)
              if not m:
                  bad.append(f"Invalid filename: {f.name}")
                  continue
              v = m.group(1)
              if v in versions:
                  bad.append(f"Duplicate version {v}: {versions[v]} and {f.name}")
              versions[v] = f.name
              if not f.read_text(encoding="utf-8").strip():
                  bad.append(f"Empty migration: {f.name}")
          if bad:
              sys.exit("\n".join(bad))
          print(f"Validated {len(versions)} migration filenames (no database touched).")
          PY

      - name: List migrations changed in this pull request
        if: github.event_name == 'pull_request'
        id: changed
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${{ github.base_ref }}" --depth=1
          mapfile -t files < <(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- 'supabase/migrations/*.sql' || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No migration SQL files changed in this PR."
            exit 0
          fi
          printf '%s\n' "${files[@]}" > /tmp/changed-migrations.txt
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "Changed migration files:"
          cat /tmp/changed-migrations.txt

      - name: Security scan on changed migration files
        if: github.event_name == 'pull_request' && steps.changed.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re, sys
          files = [pathlib.Path(p.strip()) for p in open("/tmp/changed-migrations.txt") if p.strip()]
          if not files:
              sys.exit(0)
          blocked = [
              (re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"), "embedded private key material"),
              (re.compile(r"\bAKIA[0-9A-Z]{16}\b"), "possible AWS access key id"),
              (
                  re.compile(r"\bGRANT\b[^;]*\bTO\s+(PUBLIC|anon)\b", re.I),
                  "GRANT to PUBLIC/anon (same statement)",
              ),
              (re.compile(r"\bpg_read_file\s*\(", re.I), "pg_read_file()"),
              (re.compile(r"\\copy\b.*\bprogram\b", re.I), "\\copy PROGRAM"),
              (re.compile(r"\blo_import\s*\(", re.I), "lo_import()"),
              (re.compile(r"postgresql://[^\s'\"]+:[^\s'\"]+@", re.I), "postgres URL with embedded password"),
          ]
          risky = re.compile(
              r"\b(drop\s+(?:table|schema|column)|truncate|delete\s+from|alter\s+table[\s\S]{0,120}drop\s+column|revoke|create\s+policy|drop\s+policy)\b",
              re.I,
          )
          errors = []
          warnings = []
          for f in files:
              if not f.is_file():
                  errors.append(f"Missing changed migration file: {f}")
                  continue
              text = f.read_text(encoding="utf-8")
              for pat, label in blocked:
                  if pat.search(text):
                      errors.append(f"{f.name}: blocked pattern ({label})")
              if risky.search(text):
                  warnings.append(f.name)
          if warnings:
              print("Changed migrations flagged for human review (destructive/RLS): " + ", ".join(warnings))
          if errors:
              sys.exit("\n".join(errors))
          print(f"Security scan passed for {len(files)} changed migration file(s).")
          PY

      - name: Show potential destructive statements for review (repository-wide, informational)
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, re
          root=pathlib.Path("supabase/migrations")
          risky=re.compile(r"\b(drop\s+(?:table|schema|column)|truncate|delete\s+from|alter\s+table[\s\S]{0,120}drop\s+column|revoke|create\s+policy|drop\s+policy)\b", re.I)
          matched=[]
          for f in root.glob("*.sql"):
              if risky.search(f.read_text(encoding="utf-8")):
                  matched.append(f.name)
          print(f"Historical migrations flagged for human review: {len(matched)} (informational; not executing SQL).")
          PY

  staging-validate:
    name: Staging / local migration apply (optional)
    needs: validate-migrations
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Skip when no migration SQL changed
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${{ github.base_ref }}" --depth=1
          if git diff --quiet "origin/${{ github.base_ref }}...HEAD" -- 'supabase/migrations/*.sql'; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No migration changes — skipping local apply."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v3
        if: steps.gate.outputs.run == 'true'
        with:
          version: 2.121.0

      - name: supabase db reset (local only)
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Historical migration 20250220000006 changes two function
          # signatures. PostgreSQL cannot CREATE OR REPLACE the old return
          # type. Preserve immutable applied files: repair only a throwaway
          # workspace used to replay ALL migrations in this CI job.
          replay_dir="$(mktemp -d)"
          cp -a supabase "$replay_dir/supabase"
          python3 - "$replay_dir/supabase/migrations/20250220000006_phase7_multi_environment.sql" <<'PY'
          import pathlib
          import sys
          path = pathlib.Path(sys.argv[1])
          sql = path.read_text()
          replacements = (
              ("CREATE OR REPLACE FUNCTION public.rag_search(", "DROP FUNCTION IF EXISTS public.rag_search(uuid, text, int, uuid, uuid);\nCREATE OR REPLACE FUNCTION public.rag_search("),
              ("CREATE OR REPLACE FUNCTION public.claim_rag_ingest_job()", "DROP FUNCTION IF EXISTS public.claim_rag_ingest_job();\nCREATE OR REPLACE FUNCTION public.claim_rag_ingest_job()"),
          )
          for before, after in replacements:
              if sql.count(before) != 1:
                  raise SystemExit(f"Unexpected historical SQL shape: {before}")
              sql = sql.replace(before, after, 1)
          path.write_text(sql)
          print("CI-only historical return-type compatibility replay; tracked migration bytes unchanged.")
          PY
          cd "$replay_dir"
          supabase start -x studio,imgproxy,edge-runtime,logflare,vector
          supabase db reset --no-seed
          echo "Local Supabase replayed all migrations with the two declared historical DROP FUNCTION compatibility statements (production not touched)."

      - name: Remote staging reconcile (when configured)
        if: steps.gate.outputs.run == 'true' && vars.SUPABASE_STAGING_PROJECT_REF != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STAGING_REF: ${{ vars.SUPABASE_STAGING_PROJECT_REF }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::SUPABASE_STAGING_PROJECT_REF is set but SUPABASE_ACCESS_TOKEN is missing."
            exit 1
          fi
          supabase link --project-ref "$STAGING_REF" --password "${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}"
          supabase migration list
          echo "Staging project linked for history reconciliation (no db push — human-approved deploy only)."
