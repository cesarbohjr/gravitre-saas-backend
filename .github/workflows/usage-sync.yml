name: Usage Sync

# Manual Stripe usage-sync trigger: calls the backend's internal sync endpoint,
# which reports unreported ai_credits usage for all active orgs to the Stripe
# meter. Reporting is idempotent (only unreported rows are sent).
#
# NOTE: hourly syncing is handled in-process by the backend
# (USAGE_SYNC_INTERVAL_SECONDS, default 3600s), so this workflow is manual-only
# to avoid duplicate scheduled runs. Re-enable the `schedule:` trigger only if
# you set USAGE_SYNC_INTERVAL_SECONDS=0 and want GitHub to drive the cron
# (requires the INTERNAL_API_SECRET repo secret).
on:
  workflow_dispatch: {} # manual trigger from the Actions tab

concurrency:
  group: usage-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger usage sync
        env:
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
          # Public Railway URL; override with the BACKEND_URL repo variable if it changes.
          BACKEND_URL: ${{ vars.BACKEND_URL || 'https://gravitre-saas-backend-production.up.railway.app' }}
        run: |
          if [ -z "$INTERNAL_API_SECRET" ]; then
            echo "INTERNAL_API_SECRET secret is not set; add it in repo Settings → Secrets and variables → Actions." >&2
            exit 1
          fi
          echo "POST $BACKEND_URL/api/internal/billing/sync-usage"
          curl -fsS -X POST "$BACKEND_URL/api/internal/billing/sync-usage" \
            -H "X-Internal-Secret: $INTERNAL_API_SECRET" \
            -H "Content-Type: application/json" \
            -w "\nHTTP %{http_code}\n"
