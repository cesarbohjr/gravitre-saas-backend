name: Phase 3 offline 12-scenario evaluation
on:
  pull_request:
    paths:
      - 'backend/scripts/phase3_offline_12_scenarios.py'
      - 'backend/app/services/**'
      - 'backend/app/operators/**'
      - 'backend/app/plays/**'
      - 'backend/app/workflows/**'
      - 'backend/tests/services/test_phase3*.py'
      - 'backend/tests/e2e/test_phase3*.py'
      - '.github/workflows/phase3-offline-12-scenarios.yml'
  workflow_dispatch:
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
      - name: Execute 12 offline scenario contract suites
        run: python scripts/phase3_offline_12_scenarios.py
        env:
          PHASE3_OUTPUT_DIR: ${{ runner.temp }}/gravitre-phase3-evidence
          OPENAI_API_KEY: fake-phase3-key
          ANTHROPIC_API_KEY: fake-phase3-key
          GEMINI_API_KEY: fake-phase3-key
      - name: Run virtual-clock voice turn benchmark (scripted providers; not physical voice)
        run: python scripts/bench_voice_scenarios.py --runs 5 --seed 1000 --profile production_inferred --out "${{ runner.temp }}/gravitre-phase3-evidence/voice-virtual-clock" --label phase3-pr534
        env:
          OPENAI_API_KEY: fake-phase3-key
          ANTHROPIC_API_KEY: fake-phase3-key
          GEMINI_API_KEY: fake-phase3-key
      - name: Enforce all graded voice replay safety outcomes
        run: python scripts/phase3_voice_replay_gate.py "${{ runner.temp }}/gravitre-phase3-evidence/voice-virtual-clock/results.json"
      - name: Upload full evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3-12-scenario-offline-${{ github.sha }}
          path: ${{ runner.temp }}/gravitre-phase3-evidence/
          if-no-files-found: warn
