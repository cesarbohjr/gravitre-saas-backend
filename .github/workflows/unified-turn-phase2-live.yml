name: Unified Turn Phase 2 Live

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Expected health git_sha prefix (empty = this checkout)"
        required: false
        default: ""
      enable_shadow:
        description: "Set UNIFIED_TURN_SHADOW_ENABLED=true on Railway"
        required: false
        default: "true"

concurrency:
  group: unified-turn-phase2-live
  cancel-in-progress: false

jobs:
  deploy-and-battery:
    name: Deploy prod, enable shadow, run live batteries
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install Railway CLI
        run: npm install -g @railway/cli@4.65.0

      - name: Deploy tip (GraphQL account token, fallback railway up)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          SHA="${{ inputs.commit_sha }}"
          if [ -z "$SHA" ]; then
            SHA="$(git rev-parse --short=8 HEAD)"
          fi
          FULL="$(git rev-parse HEAD)"
          echo "Expect health git_sha prefix=$SHA full=$FULL"

          # Account token should allow variable mutations. Stamp tip into GIT_SHA so
          # /health cannot stay on a stale pinned value after restart.
          railway variables set "GIT_SHA=$FULL" --service gravitre-saas-backend
          if [ "${{ inputs.enable_shadow }}" = "true" ]; then
            railway variables set "UNIFIED_TURN_SHADOW_ENABLED=true" --service gravitre-saas-backend
          fi

          # Prefer GitHub-connected latest commit deploy (account token + Bearer).
          if python3 scripts/railway_prod_deploy.py \
              --latest-commit \
              --wait-health \
              --timeout-s 900 \
              --health-url https://api.gravitre.app/health \
              --commit-sha "$SHA"; then
            echo "GraphQL latest-commit deploy healthy"
            exit 0
          fi

          echo "::warning::GraphQL latest-commit failed; falling back to railway up (new build from this checkout)"
          railway up ./backend --path-as-root --ci --service gravitre-saas-backend --message "unified-turn-phase2 $SHA"
          python3 scripts/railway_prod_deploy.py \
            --wait-health-only \
            --timeout-s 900 \
            --health-url https://api.gravitre.app/health \
            --commit-sha "$SHA"

      - name: Phase 2 live batteries (classical + shadow)
        env:
          LIVE_API_BASE: https://api.gravitre.app
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          OAUTH_SMOKE_ORG_ID: ${{ secrets.OAUTH_SMOKE_ORG_ID }}
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.commit_sha }}" ]; then
            export EXPECT_SHA="${{ inputs.commit_sha }}"
          else
            export EXPECT_SHA="$(git rev-parse --short=8 HEAD)"
          fi
          echo "EXPECT_SHA=$EXPECT_SHA"
          python3 scripts/verify-unified-turn-phase2-live.py

      - name: Upload Phase 2 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unified-turn-phase2-live
          path: |
            docs/delivery/unified-turn-phase2-battery-live.json
            docs/delivery/pending-reply-classifier-battery-live.json
            docs/delivery/conversational-path-battery-live.json
