name: Unified Turn Phase 2 Live

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Expected health git_sha prefix (empty = this checkout)"
        required: false
        default: ""
      enable_shadow:
        description: "Set UNIFIED_TURN_SHADOW_ENABLED=true on Railway"
        required: false
        default: "true"
      railway_environment:
        description: "Railway environment name"
        required: false
        default: "production"

concurrency:
  group: unified-turn-phase2-live
  cancel-in-progress: false

jobs:
  deploy-and-battery:
    name: Deploy prod, enable shadow, run live batteries
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install Railway CLI
        run: npm install -g @railway/cli@4.65.0

      - name: Force railway up on production + verify tip
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_ENV: ${{ inputs.railway_environment }}
        run: |
          set -euo pipefail
          SHA="${{ inputs.commit_sha }}"
          if [ -z "$SHA" ]; then
            SHA="$(git rev-parse --short=8 HEAD)"
          fi
          FULL="$(git rev-parse HEAD)"
          ENV_NAME="${RAILWAY_ENV:-production}"
          SVC="gravitre-saas-backend"
          echo "Expect health git_sha prefix=$SHA full=$FULL env=$ENV_NAME"

          railway whoami || true
          railway status --json || true

          # Do not pin a stale GIT_SHA. Prefer Railway's commit SHA from a GitHub
          # deploy; only set GIT_SHA to this tip when health is still on an old tip
          # (CLI upload path does not always populate RAILWAY_GIT_COMMIT_SHA).
          if [ "${{ inputs.enable_shadow }}" = "true" ]; then
            railway variables set "UNIFIED_TURN_SHADOW_ENABLED=true" --service "$SVC" --environment "$ENV_NAME"
          fi

          CURRENT="$(curl -fsS https://api.gravitre.app/health | python3 -c 'import sys,json; print(json.load(sys.stdin).get("git_sha",""))' || true)"
          echo "current_health_sha=$CURRENT"
          if [[ "$CURRENT" == "$FULL"* ]] || [[ "$CURRENT" == "$SHA"* ]]; then
            echo "Prod tip already matches checkout; skip railway up"
          else
            railway variables set "GIT_SHA=$FULL" --service "$SVC" --environment "$ENV_NAME"
            echo "$FULL $(date -u +%Y-%m-%dT%H:%M:%SZ)" > backend/.railway-deploy-stamp
            echo "stamp=$(cat backend/.railway-deploy-stamp)"
            railway up ./backend --path-as-root --ci \
              --service "$SVC" \
              --environment "$ENV_NAME" \
              --message "unified-turn-phase2 $SHA"
          fi

          railway deployment list --service "$SVC" --environment "$ENV_NAME" --json > /tmp/deps.json || true
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("/tmp/deps.json")
          if not p.is_file():
              raise SystemExit(0)
          rows = json.loads(p.read_text() or "[]")
          if not isinstance(rows, list):
              raise SystemExit(0)
          for r in rows[:5]:
              print(f"{r.get('id','')} status={r.get('status','')} created={r.get('createdAt','')}")
          PY

          python3 scripts/railway_prod_deploy.py \
            --wait-health-only \
            --timeout-s 1200 \
            --health-url https://gravitre-saas-backend-production.up.railway.app/health \
            --commit-sha "$SHA"

          python3 scripts/railway_prod_deploy.py \
            --wait-health-only \
            --timeout-s 180 \
            --health-url https://api.gravitre.app/health \
            --commit-sha "$SHA"

      - name: Phase 2 live batteries (classical + shadow)
        env:
          LIVE_API_BASE: https://api.gravitre.app
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          OAUTH_SMOKE_ORG_ID: ${{ secrets.OAUTH_SMOKE_ORG_ID }}
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.commit_sha }}" ]; then
            export EXPECT_SHA="${{ inputs.commit_sha }}"
          else
            export EXPECT_SHA="$(git rev-parse --short=8 HEAD)"
          fi
          echo "EXPECT_SHA=$EXPECT_SHA"
          python3 scripts/verify-unified-turn-phase2-live.py

      - name: Upload Phase 2 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unified-turn-phase2-live
          path: |
            docs/delivery/unified-turn-phase2-battery-live.json
            docs/delivery/pending-reply-classifier-battery-live.json
            docs/delivery/conversational-path-battery-live.json
