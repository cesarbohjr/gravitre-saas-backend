name: Seven intelligence certification evidence
on:
  pull_request:
    paths:
      - 'backend/app/**'
      - 'backend/tests/**'
      - 'backend/requirements*.txt'
      - 'backend/app/services/execution_intelligence_context.py'
      - 'backend/scripts/phase3_intelligence_coverage.py'
      - 'backend/scripts/seven_intelligence_differential.py'
      - 'backend/tests/services/test_phase2_intelligence_coordination.py'
      - 'backend/tests/services/test_phase2_router_consumers.py'
      - 'docs/testing/PHASE3_SEVEN_LAYER_CERTIFICATION.md'
      - '.github/workflows/seven-intelligence-certification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-contracts:
    timeout-minutes: 25
    env:
      SEVEN_INTELLIGENCE_EVIDENCE_DIR: ../phase3-evidence/cells
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Run existing seven-capability contracts
        run: |
          python -m pytest -q --no-header -p tests.offline_network_guard \
            tests/services/test_phase2_intelligence_coordination.py \
            tests/services/test_phase2_router_consumers.py \
            tests/services/test_execution_intelligence_context.py \
            tests/services/test_intelligence_acceptance_regressions.py \
            tests/services/test_intelligence_outcome_verification.py \
            tests/services/test_intelligence_outcome_path.py \
            tests/services/test_react_write_gate.py \
            tests/services/pipecat_voice/test_phase3_provider_commit_gate.py \
            tests/e2e/test_intelligence_evidence_play_handoff.py \
            tests/e2e/test_intelligence_tenant_recovery_regression.py \
            tests/e2e/test_intelligence_migration_security_contract.py \
            tests/e2e/test_intelligence_recommendation_full_lifecycle.py \
            tests/test_phase3_intelligence_coverage.py \
            tests/e2e/test_seven_intelligence_cross_surface.py \
            tests/scripts/test_seven_intelligence_differential.py \
            --junitxml=../phase3-evidence/contracts.xml
      - name: Generate 56-cell coverage inventory
        if: always()
        run: |
          python scripts/phase3_intelligence_coverage.py --evidence-dir ../phase3-evidence/cells --commit-sha "$GITHUB_SHA" --output ../phase3-evidence/intelligence-coverage.json
      - name: Upload inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seven-intelligence-coverage-inventory
          path: phase3-evidence/
          if-no-files-found: error

  deployed-lifecycle-baseline:
    # This verifies the deployed smoke-org path, not candidate-branch coverage.
    # It cannot promote any of the 56 cells to PASS_LIVE_VERIFIED.
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.number == 580 && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated session dependencies
        run: python -m pip install 'httpx>=0.27,<1' 'PyJWT>=2.8,<3' python-dotenv supabase
      - name: Mint short-lived isolated smoke-org session
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
        run: python scripts/mint_smoke_org_session.py --github-env
      - name: Verify deployed internal assignment, approval, outcome and learning
        run: python scripts/run-intelligence-isolated-live.py --allow-synthetic-write --out "$RUNNER_TEMP/intelligence-e2e-report.json"
      - name: Clear session and reject token-bearing evidence
        if: always()
        shell: bash
        run: |
          if [ -n "${PLATFORM_LIVE_BEARER_TOKEN:-}" ] && [ -f "$RUNNER_TEMP/intelligence-e2e-report.json" ] && grep -qF "$PLATFORM_LIVE_BEARER_TOKEN" "$RUNNER_TEMP/intelligence-e2e-report.json"; then
            rm -f "$RUNNER_TEMP/intelligence-e2e-report.json"
            echo '::error::Session token found in evidence; upload refused'
            exit 1
          fi
          echo 'PLATFORM_LIVE_BEARER_TOKEN=' >> "$GITHUB_ENV"
      - name: Upload deployed baseline (not cross-surface certification)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployed-intelligence-lifecycle-baseline
          path: ${{ runner.temp }}/intelligence-e2e-report.json
          if-no-files-found: error


  live-decision-differentials:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.number == 580 && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install inference dependencies
        working-directory: backend
        run: python -m pip install -r requirements-dev.txt
      - name: Compare baseline, enriched and missing evidence across three domains and seven capabilities
        working-directory: backend
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/seven_intelligence_differential.py --output ../phase3-differential/differential.json --commit-sha "$GITHUB_SHA"
      - name: Upload live model decisions (synthetic sources; no business outcome claim)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seven-intelligence-live-decisions
          path: phase3-differential/
          if-no-files-found: error

  certification:
    if: always()
    needs: [offline-contracts, live-decision-differentials, deployed-lifecycle-baseline]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: seven-intelligence-*
          path: phase3-evidence
          merge-multiple: true
      - name: Enforce full certification (offline propagation alone cannot pass)
        run: |
          python backend/scripts/phase3_intelligence_coverage.py \
            --evidence-dir phase3-evidence/cells --commit-sha "$GITHUB_SHA" \
            --differential-evidence phase3-evidence/differential.json \
            --output certification-evidence/certification-check.json --require-certified
      - name: Retain certification verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: certification-verdict
          path: certification-evidence/
          if-no-files-found: error
