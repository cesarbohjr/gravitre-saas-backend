name: P27 HubSpot sandbox authoritative readback — manually approved only
on:
  workflow_dispatch:
    inputs:
      approval:
        description: "Type APPROVE_NONPRODUCTION_WRITE after confirming sandbox credentials and isolated provider"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: p27-sandbox-readback
  cancel-in-progress: false
jobs:
  provider-readback:
    name: P27 HubSpot developer-test contact upsert and independent GET
    if: ${{ github.event.inputs.approval == 'APPROVE_NONPRODUCTION_WRITE' }}
    environment: p27-provider-sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: backend
    env:
      P27_HUBSPOT_SANDBOX_PORTAL_ID: ${{ vars.P27_HUBSPOT_SANDBOX_PORTAL_ID }}
      P27_HUBSPOT_QA_EMAIL_DOMAIN: ${{ vars.P27_HUBSPOT_QA_EMAIL_DOMAIN }}
      P27_HUBSPOT_SANDBOX_TOKEN: ${{ secrets.P27_HUBSPOT_SANDBOX_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require strict sandbox host and provider credentials
        run: |
          test -n "$P27_HUBSPOT_SANDBOX_PORTAL_ID" || { echo "::error::Approved HubSpot developer-test portal missing"; exit 1; }
          test -n "$P27_HUBSPOT_QA_EMAIL_DOMAIN" || { echo "::error::Owned QA email domain missing"; exit 1; }
          test -n "$P27_HUBSPOT_SANDBOX_TOKEN" || { echo "::error::HubSpot test account token missing"; exit 1; }
      - name: Make one uniquely keyed synthetic action and read it from provider
        run: python scripts/p27_hubspot_sandbox_readback.py --approve-sandbox-write
