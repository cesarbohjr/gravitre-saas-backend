name: P27 controlled existing HubSpot portal QA — manual approval only
on:
  workflow_dispatch:
    inputs:
      approval:
        description: "Type APPROVE_LIVE_TEST_CONTACT for one disposable record in existing Gravitre HubSpot"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: p27-existing-live-hubspot-qa
  cancel-in-progress: false
jobs:
  provider-readback:
    name: Exact portal QA upsert + independent GET + identical replay + verified delete
    if: ${{ github.event.inputs.approval == 'APPROVE_LIVE_TEST_CONTACT' }}
    environment: p27-provider-sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: backend
    env:
      P27_HUBSPOT_EXPECTED_PORTAL_ID: ${{ vars.P27_HUBSPOT_EXPECTED_PORTAL_ID }}
      P27_HUBSPOT_QA_EMAIL_DOMAIN: ${{ vars.P27_HUBSPOT_QA_EMAIL_DOMAIN }}
      P27_HUBSPOT_LIVE_TEST_TOKEN: ${{ secrets.P27_HUBSPOT_LIVE_TEST_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require explicitly configured exact existing portal and dedicated QA namespace
        run: |
          test "$P27_HUBSPOT_EXPECTED_PORTAL_ID" = "343328749" || { echo "::error::Existing Gravitre HubSpot portal ID not approved"; exit 1; }
          test -n "$P27_HUBSPOT_QA_EMAIL_DOMAIN" || { echo "::error::Dedicated QA email domain missing"; exit 1; }
          test -n "$P27_HUBSPOT_LIVE_TEST_TOKEN" || { echo "::error::Scoped existing HubSpot test token missing"; exit 1; }
      - name: One synthetic write, provider GET, same-key replay, cleanup GET 404
        run: python scripts/p27_hubspot_sandbox_readback.py --approve-live-test-contact
