name: Phase 3 Intelligence Coverage
on:
  pull_request:
    paths:
      - 'backend/app/services/intelligence_router.py'
      - 'backend/app/services/operational_intelligence_layer.py'
      - 'backend/app/operators/**'
      - 'backend/app/plays/**'
      - 'backend/app/workflows/**'
      - 'backend/app/services/**'
      - 'backend/scripts/phase3_intelligence_coverage.py'
      - 'backend/scripts/phase3_intelligence_scenario_bundles.py'
      - 'backend/tests/test_phase3_intelligence_coverage.py'
      - 'backend/tests/services/test_phase3*.py'
      - 'backend/tests/e2e/test_intelligence*.py'
      - 'backend/tests/e2e/test_phase3*.py'
      - 'docs/testing/PHASE3_SEVEN_LAYER_CERTIFICATION.md'
      - '.github/workflows/phase3-intelligence-coverage.yml'
  workflow_dispatch:
jobs:
  coverage-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reclaim hosted-runner disk before CPU-only dependencies
        run: |
          set -euo pipefail
          echo "Phase 3 disk before cleanup:"
          df -h / /tmp
          for dir in /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/powershell; do
            if [ -d "$dir" ]; then
              sudo rm -rf -- "$dir"
            fi
          done
          python -m pip cache purge || true
          sudo apt-get clean
          echo "Phase 3 disk after cleanup:"
          df -h / /tmp
          free_kib=$(df -Pk / | awk 'NR==2 {print $4}')
          if [ "$free_kib" -lt 10485760 ]; then
            echo "::error::Phase 3 coverage requires 10 GiB free before heavy Python install; KiB=$free_kib"
            exit 1
          fi
      - name: Install backend test dependencies (CPU torch; no wheel caches)
        working-directory: backend
        env:
          PIP_NO_CACHE_DIR: '1'
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python -m pip install --no-cache-dir --no-compile --upgrade pip
          # This contract-only job must not download multi-GB CUDA runtimes.
          # Match the existing offline Phase 3 CPU build before requirements.
          python -m pip install --no-cache-dir --no-compile torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir --no-compile -r requirements-dev.txt
          python -c "import torch; assert torch.version.cuda is None, 'Phase 3 must use CPU-only torch'"
          python -m pip check
          df -h / /tmp
      - name: Validate 56-cell inventory and fail-closed evidence rules
        run: |
          cd backend
          python -m pytest -q tests/test_phase3_intelligence_coverage.py
          python scripts/phase3_intelligence_coverage.py --output ../phase3-evidence/intelligence-coverage.json
      - name: Shared One Brain handoff and governed execution contracts
        working-directory: backend
        run: |
          python -m pytest -q -p tests.offline_network_guard -o junit_family=xunit1 --junitxml=../phase3-evidence/shared-runtime.xml tests/services/test_phase3_one_brain_contract.py tests/services/test_phase3_read_execution_integrity.py tests/services/test_phase3_measured_feedback.py tests/services/test_execution_intelligence_context.py tests/test_msp_delegation_policy.py tests/test_msp_delegation_preflight.py tests/services/test_agent_tool_permissions.py tests/services/pipecat_voice/test_phase3_provider_commit_gate.py tests/services/test_outcome_ownership_learning_contamination.py tests/services/test_react_write_gate_catalog_authority.py tests/services/test_write_invoke_idempotency.py tests/services/test_compensation_service.py tests/e2e/test_phase3_required_play_routing.py tests/e2e/test_intelligence_evidence_play_handoff.py tests/e2e/test_intelligence_recommendation_full_lifecycle.py tests/e2e/test_intelligence_tenant_recovery_regression.py
          python scripts/phase3_intelligence_coverage.py --junit ../phase3-evidence/shared-runtime.xml --require-offline --output ../phase3-evidence/shared-runtime-coverage.json
      - name: Run three offline business-domain contract bundles
        run: |
          cd backend
          python scripts/phase3_intelligence_scenario_bundles.py
      - name: Publish coverage evidence (not certification)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3-intelligence-coverage
          path: |
            phase3-evidence/
            backend/phase3-evidence/
