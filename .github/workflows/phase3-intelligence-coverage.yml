name: Phase 3 Intelligence Coverage
on:
  pull_request:
    paths:
      - 'backend/app/services/intelligence_router.py'
      - 'backend/app/services/operational_intelligence_layer.py'
      - 'backend/app/operators/**'
      - 'backend/app/services/**'
      - 'backend/scripts/phase3_intelligence_coverage.py'
      - 'backend/scripts/phase3_intelligence_scenario_bundles.py'
      - 'backend/tests/test_phase3_intelligence_coverage.py'
      - 'docs/testing/PHASE3_SEVEN_LAYER_CERTIFICATION.md'
      - '.github/workflows/phase3-intelligence-coverage.yml'
  workflow_dispatch:
jobs:
  coverage-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate 56-cell inventory and fail-closed evidence rules
        run: |
          python -m pip install pytest
          cd backend
          python -m pytest -q tests/test_phase3_intelligence_coverage.py
          python scripts/phase3_intelligence_coverage.py --output ../phase3-evidence/intelligence-coverage.json
      - name: Run three offline business-domain contract bundles
        run: |
          cd backend
          python scripts/phase3_intelligence_scenario_bundles.py
      - name: Publish coverage evidence (not certification)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3-intelligence-coverage
          path: phase3-evidence/
