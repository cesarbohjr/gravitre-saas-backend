# Backend production deploy gate — waits for Railway GitHub auto-deploy, then verifies /health.
#
# Do NOT run `railway up --ci` here: duplicate uploads race GitHub auto-deploy and create
# spurious FAILED deployments on frontend-only pushes. See docs/delivery/railway-github-actions-deploy-status.md
name: Railway backend production

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: railway-backend-production
  cancel-in-progress: false

jobs:
  detect-backend-changes:
    name: Detect backend changes
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      - id: detect
        run: |
          set -euo pipefail
          if ! git rev-parse HEAD~1 >/dev/null 2>&1; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Single-commit checkout — assume backend deploy required."
            exit 0
          fi
          if python3 scripts/railway_commit_touches_backend.py --base HEAD~1 --head HEAD; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No backend/ changes in this push — skipping Railway deploy gate."
          fi

  deploy:
    name: Verify Railway prod /health
    needs: detect-backend-changes
    if: needs.detect-backend-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Wait for GitHub auto-deploy health match
        run: |
          set -euo pipefail
          SHA="$(git rev-parse --short=8 HEAD)"
          echo "Waiting for prod /health git_sha ~ $SHA (GitHub-connected Railway auto-deploy)"
          python3 scripts/railway_prod_deploy.py \
            --wait-health-only \
            --timeout-s 900 \
            --health-url https://gravitre-saas-backend-production.up.railway.app/health \
            --commit-sha "$SHA"
          python3 scripts/railway_prod_deploy.py \
            --wait-health-only \
            --timeout-s 120 \
            --health-url https://api.gravitre.app/health \
            --commit-sha "$SHA"

      - name: Post-deploy chat smoke (isolated org)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          EXPECT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          pip install httpx PyJWT python-dotenv supabase
          python3 scripts/smoke-post-deploy-chat-live.py

      - name: Upload post-deploy chat smoke artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-post-deploy-chat-live
          path: docs/delivery/smoke-post-deploy-chat-live.json
          if-no-files-found: ignore
