# Backend production deploy gate.
#
# Prefer GitHub-connected Railway auto-deploy. If /health stays stale, force
# path uses GraphQL redeploy (never CLI `railway up` — COPY checksum races).
# See docs/delivery/railway-github-actions-deploy-status.md
#
# Trigger on backend pushes directly — do NOT require full CI green. Frontend /
# Lighthouse / pip-audit failures were skipping this workflow and pinning tip.
name: Railway backend production

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/railway-backend-production.yml"
  workflow_dispatch:
    inputs:
      force_railway_up:
        description: If GitHub auto-deploy is stuck, GraphQL-redeploy tip (never CLI railway up)
        type: boolean
        default: true

concurrency:
  group: railway-backend-production
  cancel-in-progress: false

jobs:
  detect-backend-changes:
    name: Detect backend changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
      ref: ${{ steps.detect.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - id: detect
        run: |
          set -euo pipefail
          REF="$(git rev-parse HEAD)"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "workflow_dispatch — force deploy path."
            exit 0
          fi
          if ! git rev-parse HEAD~1 >/dev/null 2>&1; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Single-commit checkout — assume backend deploy required."
            exit 0
          fi
          if python3 scripts/railway_commit_touches_backend.py --base HEAD~1 --head HEAD; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No backend/ changes in this push — skipping Railway deploy gate."
          fi

  deploy:
    name: Verify Railway prod /health
    needs: detect-backend-changes
    if: needs.detect-backend-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.detect-backend-changes.outputs.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Railway CLI
        run: npm install -g @railway/cli@4.65.0

      - name: Wait for GitHub-connected Railway auto-deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          SHA="$(git rev-parse --short=8 HEAD)"
          FULL="$(git rev-parse HEAD)"
          SVC="gravitre-saas-backend"
          ENV_NAME="production"
          FORCE="${{ github.event_name == 'workflow_dispatch' && inputs.force_railway_up || 'false' }}"
          # Push-triggered backend changes: allow GraphQL force if GitHub auto-deploy lags.
          if [ "${{ github.event_name }}" = "push" ]; then
            FORCE="true"
          fi

          match_health() {
            local url="$1" timeout="$2"
            python3 scripts/railway_prod_deploy.py \
              --wait-health-only \
              --timeout-s "$timeout" \
              --health-url "$url" \
              --commit-sha "$SHA"
          }

          tip_matches() {
            local current="$1"
            [[ "$current" == "$FULL"* ]] || [[ "$current" == "$SHA"* ]]
          }

          # Never leave a fake tip: /health prefers RAILWAY_GIT_COMMIT_SHA then GIT_SHA.
          # A stale GIT_SHA env var can report a tip that is not actually running.
          echo "Clearing override GIT_SHA (if set) so health reflects the real commit..."
          railway variables delete GIT_SHA --service "$SVC" --environment "$ENV_NAME" || true

          CURRENT="$(curl -fsS https://api.gravitre.app/health | python3 -c 'import sys,json; print(json.load(sys.stdin).get("git_sha",""))' || true)"
          echo "current_health_sha=$CURRENT expect=$FULL force=$FORCE"

          if tip_matches "$CURRENT"; then
            echo "Prod already on tip — nothing to deploy."
            exit 0
          fi

          # Always prefer GitHub-connected auto-deploy first. CLI `railway up`
          # racing that path fails at Dockerfile COPY with
          # "failed to calculate checksum" while the GitHub deploy often succeeds
          # (see docs/delivery/railway-github-actions-deploy-status.md).
          echo "Waiting for GitHub-connected Railway auto-deploy..."
          set +e
          match_health "https://gravitre-saas-backend-production.up.railway.app/health" 600
          RAIL_WAIT=$?
          set -e
          CURRENT="$(curl -fsS https://api.gravitre.app/health | python3 -c 'import sys,json; print(json.load(sys.stdin).get("git_sha",""))' || true)"
          if tip_matches "$CURRENT"; then
            match_health "https://api.gravitre.app/health" 180
            echo "GitHub auto-deploy reached tip — no GraphQL force deploy needed."
            exit 0
          fi

          if [ "$FORCE" != "true" ]; then
            echo "::error::Prod still on $CURRENT after GitHub auto-deploy wait (expect $SHA). Re-run with force_railway_up=true (GraphQL redeploy, not CLI upload)."
            exit 1
          fi

          # Force path: GraphQL / CLI redeploy of the GitHub commit — never set GIT_SHA
          # (that previously faked /health tip without loading the new image).
          echo "::warning::force deploy — tip still stale ($CURRENT) — GraphQL redeploy (no CLI upload, no GIT_SHA override)"
          set +e
          python3 scripts/railway_prod_deploy.py \
            --commit-sha "$FULL" \
            --wait-health \
            --timeout-s 900 \
            --health-url "https://gravitre-saas-backend-production.up.railway.app/health"
          DEPLOY_EXIT=$?
          set -e
          echo "railway_graphql_deploy_exit=$DEPLOY_EXIT railway_wait_exit=$RAIL_WAIT"
          if [ "$DEPLOY_EXIT" -ne 0 ]; then
            echo "::warning::GraphQL deploy helper exited $DEPLOY_EXIT — waiting on /health tip anyway"
          fi

          match_health "https://gravitre-saas-backend-production.up.railway.app/health" 900
          match_health "https://api.gravitre.app/health" 180

      - name: Post-deploy chat smoke (isolated org)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          EXPECT_SHA: ${{ needs.detect-backend-changes.outputs.ref }}
        run: |
          set -euo pipefail
          pip install httpx PyJWT python-dotenv supabase
          python3 scripts/smoke-post-deploy-chat-live.py

      - name: Upload post-deploy chat smoke artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-post-deploy-chat-live
          path: docs/delivery/smoke-post-deploy-chat-live.json
          if-no-files-found: ignore

      - name: MSP enrichment workflow live smoke
        if: always()
        env:
          BACKEND_URL: https://gravitre-saas-backend-production.up.railway.app
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
        run: |
          set +e
          python3 scripts/smoke-msp-enrichment-workflow-live.py
          CODE=$?
          set -e
          echo "msp_enrichment_smoke_exit=$CODE"
          # 0 PASS / 2 PARTIAL are acceptable; 1 FAIL soft-fails deploy gate
          if [ "$CODE" -eq 1 ]; then
            echo "::warning::MSP enrichment live smoke FAIL — see artifact"
          fi

      - name: Upload MSP enrichment smoke artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msp-enrichment-workflow-live
          path: docs/delivery/msp-enrichment-workflow-live.json
          if-no-files-found: ignore
