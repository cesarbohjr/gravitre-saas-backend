name: Federated runtime contracts
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      FLWR_TELEMETRY_ENABLED: "0"
      SUPABASE_URL: https://test.supabase.co
      SUPABASE_ANON_KEY: anon-test
      SUPABASE_SERVICE_ROLE_KEY: service-role-test
      OPENAI_API_KEY: sk-test-offline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install optional audited protocol libraries
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt -r federated-runtime/requirements.txt
      - name: Require actual protocol and privacy libraries
        run: python -c "import flwr, pydp; assert flwr.__version__ == '1.41.0'"
      - name: Build actual Flower bundle
        run: |
          python -c "from app.ml.federated_runtime import server, client; assert server.app and client.app"
          flwr build --app federated-runtime
      - name: Offline runtime contracts
        run: python -m pytest -p tests.offline_network_guard tests/ml/test_federated_runtime.py -q
