name: Knowledge Sync

# Hourly knowledge sync: Notion (and future STA-46 sources) → RAG ingest jobs.
# In-process scheduler also runs when KNOWLEDGE_SYNC_INTERVAL_SECONDS > 0 (default 3600).
on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual trigger"
        required: false

concurrency:
  group: knowledge-sync
  cancel-in-progress: false

jobs:
  sync-due:
    name: Run due knowledge syncs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger knowledge sync
        env:
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
        run: |
          if [ -z "$INTERNAL_API_SECRET" ]; then
            echo "INTERNAL_API_SECRET secret is not set; add it in repo Settings → Secrets and variables → Actions." >&2
            exit 1
          fi
          GRAVITRE_BACKEND="https://gravitre-saas-backend-production.up.railway.app"
          echo "Triggering knowledge sync at $(date -u)"
          RESPONSE=$(curl -sf \
            --max-time 120 \
            --retry 2 \
            --retry-delay 5 \
            -X POST \
            "${GRAVITRE_BACKEND}/api/internal/knowledge/sync-due" \
            -H "X-Internal-Secret: ${INTERNAL_API_SECRET}" \
            -H "Content-Type: application/json" \
            -w "\nHTTP_STATUS:%{http_code}")
          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | grep -v "HTTP_STATUS")
          echo "Response: $BODY"
          echo "HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Knowledge sync failed with status $HTTP_STATUS"
            exit 1
          fi
          echo "Knowledge sync completed successfully"
