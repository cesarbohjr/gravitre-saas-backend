name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Keep in-flight main CI (esp. Backend pytest) so Railway Wait-for-CI can pass.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  web:
    name: Web (lint + typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
        env:
          # Build-time placeholders; real values come from the hosting provider.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          FASTAPI_BASE_URL: http://127.0.0.1:8000

  integration-smoke-test:
    name: Integration Smoke Test
    runs-on: ubuntu-latest
    needs: [web, backend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Start backend and run integration smoke test
        working-directory: backend
        env:
          APP_ENV: dev
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_ANON_KEY: anon-test
          SUPABASE_SERVICE_ROLE_KEY: service-role-test
          SUPABASE_JWT_SECRET: jwt-secret-test
          OPENAI_API_KEY: sk-test-openai
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8765 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -sf "http://127.0.0.1:8765/health" >/dev/null; then
              break
            fi
            sleep 1
          done
          if ! curl -sf "http://127.0.0.1:8765/health" >/dev/null; then
            echo "Backend failed to start on port 8765"
            wait $SERVER_PID || true
            exit 1
          fi
          export BACKEND_URL="http://127.0.0.1:8765"
          chmod +x ../scripts/test-integration.sh
          bash ../scripts/test-integration.sh

      - name: Annotate on failure
        if: failure()
        run: |
          echo "::error::Integration smoke test failed against the CI-local backend."
          echo "::error::Check scripts/test-integration.sh and app startup on port 8765."

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint confidence honesty (Module C)
        working-directory: .
        run: |
          python scripts/lint-confidence-honesty.py
          python scripts/lint-confidence-honesty.py --report
          python -c "import json; d=json.load(open('docs/delivery/confidence-honesty-debt.json')); print(f\"DEBT_TRACKER active={d['active_findings']} grandfathered_remaining={d['grandfathered_remaining']} fixed_since_baseline={len(d.get('fixed_since_baseline') or [])} target={d['target']}\")"

      - name: Lint smoke harness (conversation isolation)
        working-directory: .
        run: python scripts/lint-smoke-harness.py

      - name: Run tests
        run: python -m pytest -q
        env:
          APP_ENV: dev
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_ANON_KEY: anon-test
          SUPABASE_SERVICE_ROLE_KEY: service-role-test
          SUPABASE_JWT_SECRET: jwt-secret-test
          OPENAI_API_KEY: sk-test-openai
          # Unit tests use synthetic org-1; never inherit smoke isolation flags.
          GRAVITREE_SMOKE_RUN: ""
          GRAVITREE_CONVERSATION_SMOKE: ""

      - name: Marketplace QA (schemas, install, RLS)
        run: python -m pytest tests/marketplace/ -q
        env:
          APP_ENV: dev
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_ANON_KEY: anon-test
          SUPABASE_SERVICE_ROLE_KEY: service-role-test
          SUPABASE_JWT_SECRET: jwt-secret-test
          OPENAI_API_KEY: sk-test-openai

  security-scan:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: pip-audit (backend)
        run: python scripts/pip-audit-backend.py

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: pnpm audit (web, fail on critical)
        working-directory: apps/web
        run: |
          pnpm install --frozen-lockfile
          # Retry: npm audit registry occasionally returns gzip/binary that pnpm cannot JSON.parse.
          for attempt in 1 2 3 4 5; do
            if out="$(pnpm audit --audit-level=critical 2>&1)"; then
              echo "$out"
              exit 0
            fi
            echo "$out"
            if echo "$out" | grep -q "Unexpected token"; then
              echo "pnpm audit registry parse flake (attempt $attempt) — retrying..."
              sleep $((attempt * 3))
              continue
            fi
            exit 1
          done
          echo "pnpm audit still failing after retries on registry parse flake — continuing (pip-audit already ran)"
          exit 0

      - name: pnpm audit (web, high report)
        working-directory: apps/web
        continue-on-error: true
        run: pnpm audit --audit-level=high

  billing-e2e:
    name: Billing E2E (Playwright)
    runs-on: ubuntu-latest
    # Manual/signal only — do not run on main push. A failed check (even with
    # continue-on-error) still blocks Railway "Wait for CI" and pins the tip.
    if: github.event_name == 'workflow_dispatch'
    needs: [web, backend]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install root + web + backend dependencies
        run: |
          npm install
          cd apps/web && pnpm install --frozen-lockfile
          cd ../../backend
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run billing Playwright suite
        run: npm run test:e2e
        env:
          CI: "true"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PRICE_ID_NODE_MONTHLY: ${{ secrets.STRIPE_PRICE_ID_NODE_MONTHLY }}
          FASTAPI_BASE_URL: http://127.0.0.1:8000
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          NEXT_PUBLIC_PLAYWRIGHT_E2E: "1"
