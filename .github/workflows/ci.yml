name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Preserve long-running backend and billing acceptance on new branch updates.
  cancel-in-progress: false

jobs:
  web:
    name: Web (lint + typecheck + build)
    runs-on: ubuntu-latest
    # No job here had a ceiling until the smoke test hung 40+ minutes on main.
    # Class-level, not just the one that failed.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Vercel frontend build selection
        run: node --test scripts/vercel-ignore-build.test.mjs

      - name: Run unit tests
        run: pnpm test

      - name: Chat surface drift guard
        working-directory: .
        run: node scripts/check-chat-surface-drift.mjs

      - name: User-facing status leak guard
        working-directory: .
        run: node scripts/check-user-facing-status-leak.mjs

      - name: Intelligence customer surface guard
        working-directory: .
        run: node scripts/check-intelligence-customer-surface.mjs

      - name: Cognitive regression suite
        working-directory: .
        run: node scripts/cognitive-regression-suite.mjs

      - name: Gravitre brand rename guard
        working-directory: .
        run: node scripts/check-gravitre-brand.mjs

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
        env:
          # Build-time placeholders; real values come from the hosting provider.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          FASTAPI_BASE_URL: http://127.0.0.1:8000

  integration-smoke-test:
    name: Integration Smoke Test
    runs-on: ubuntu-latest
    needs: [web, backend]
    # This job hung for 40+ minutes with no bound because its readiness-failure
    # branch called `wait` on a server that was still starting. Both halves are
    # fixed below; the ceiling stays so no future variant can pin the tip.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Start backend and run integration smoke test
        working-directory: backend
        env:
          APP_ENV: dev
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_ANON_KEY: anon-test
          SUPABASE_SERVICE_ROLE_KEY: service-role-test
          SUPABASE_JWT_SECRET: jwt-secret-test
          OPENAI_API_KEY: sk-test-openai
        run: |
          # Logged to a file, not inherited stdout: the failure branch needs the
          # startup trace, and reading it must not depend on waiting for exit.
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8765 >/tmp/backend.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          # 120s, not 30s. Measured: startup blocks on warm_local_tool_encoder
          # (all-MiniLM-L6-v2 download, added 2026-08-06 in ef7ef50f) plus 758
          # tool-doc embeddings before /health answers -- 51.6s warm and ~62s
          # cold locally. 30s could not be met, so this job could only ever
          # reach the failure branch.
          for i in $(seq 1 120); do
            if curl -sf --max-time 5 "http://127.0.0.1:8765/health" >/dev/null; then
              break
            fi
            # A dead server is a different failure from a slow one. Say so now
            # instead of burning the whole window on a process that is gone.
            if ! kill -0 $SERVER_PID 2>/dev/null; then
              echo "Backend process exited during startup after ${i}s"
              cat /tmp/backend.log
              exit 1
            fi
            sleep 1
          done
          if ! curl -sf --max-time 5 "http://127.0.0.1:8765/health" >/dev/null; then
            echo "Backend failed to become ready on port 8765 within 120s"
            # Never `wait` here. The server is still running by definition of
            # reaching this branch, so waiting for it blocked forever and turned
            # a legible failure into an unbounded hang.
            cat /tmp/backend.log
            exit 1
          fi
          export BACKEND_URL="http://127.0.0.1:8765"
          chmod +x ../scripts/test-integration.sh
          bash ../scripts/test-integration.sh

      - name: Annotate on failure
        if: failure()
        run: |
          echo "::error::Integration smoke test failed against the CI-local backend."
          echo "::error::Check scripts/test-integration.sh and app startup on port 8765."

  shared-runtime-gate:
    name: Shared runtime text/voice gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Typed greeting and spoken plan-hold both complete
        run: >
          python -m pytest -q
          tests/operators/test_agent_intelligence.py::test_shared_kernel_typed_and_spoken_plan_hold_both_complete
          tests/operators/test_agent_intelligence.py::test_execute_task_streaming_does_not_rebind_module_imports
          tests/operators/test_agent_intelligence.py::test_shared_runtime_typed_normal_turn_emits_composer_and_complete
          tests/operators/test_agent_intelligence.py::test_shared_runtime_typed_read_clarify_emits_composer
          tests/operators/test_agent_intelligence.py::test_shared_runtime_shortcut_complete_carries_task_state
          tests/operators/test_agent_intelligence.py::test_shared_runtime_write_approval_does_not_invoke_provider
          tests/services/test_voice_session_service.py::test_operator_turn_speaks_perceive_before_kernel
          tests/services/test_voice_session_service.py::test_voice_cancel_near_approval_emits_cancelled
          tests/services/test_platform_execution_2_0_a_invariants.py::test_execute_task_streaming_does_not_shadow_asyncio_or_composer
          tests/services/test_platform_execution_2_0_a_invariants.py::test_execute_task_streaming_has_no_branch_local_asyncio_import
        env:
          APP_ENV: dev
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_ANON_KEY: anon-test
          SUPABASE_SERVICE_ROLE_KEY: service-role-test
          SUPABASE_JWT_SECRET: jwt-secret-test
          OPENAI_API_KEY: sk-test-openai

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Pinned Mem0 SDK engineering integration (isolated, no provider calls)
        run: |
          python -m venv "$RUNNER_TEMP/mem0-engine-venv"
          "$RUNNER_TEMP/mem0-engine-venv/bin/pip" install --require-hashes -r ../scripts/memory_benchmark/engine-requirements.lock
          mkdir -p "$RUNNER_TEMP/mem0-engine-source"
          git -C "$RUNNER_TEMP/mem0-engine-source" init
          git -C "$RUNNER_TEMP/mem0-engine-source" remote add origin https://github.com/mem0ai/mem0.git
          git -C "$RUNNER_TEMP/mem0-engine-source" fetch --depth=1 origin 26cdefb46600c0fa5953c4b5ee5003c125539fc4
          git -C "$RUNNER_TEMP/mem0-engine-source" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/mem0-engine-source" rev-parse HEAD)" = 26cdefb46600c0fa5953c4b5ee5003c125539fc4
          "$RUNNER_TEMP/mem0-engine-venv/bin/pip" install --no-deps --no-build-isolation "$RUNNER_TEMP/mem0-engine-source"
          timeout 30s python ../scripts/memory_benchmark/audit_erasure.py --package-root "$RUNNER_TEMP/mem0-engine-source" --output "$RUNNER_TEMP/mem0-erasure-audit.json"
          timeout 300s python ../scripts/memory_benchmark/run_engine.py --engine-python "$RUNNER_TEMP/mem0-engine-venv/bin/python" --output "$RUNNER_TEMP/mem0-sdk-report.json"
        env:
          APP_ENV: dev
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_ANON_KEY: anon-test
          SUPABASE_SERVICE_ROLE_KEY: service-role-test
          OPENAI_API_KEY: sk-test-openai

      - name: Upload sanitized Mem0 engineering evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mem0-sdk-engineering-evidence
          path: |
            ${{ runner.temp }}/mem0-sdk-report.json
            ${{ runner.temp }}/mem0-erasure-audit.json
          if-no-files-found: warn

      - name: Verify bounded media decoder
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -version | head -n 1
          else
            sudo env DEBIAN_FRONTEND=noninteractive timeout 600s apt-get -o Acquire::Retries=3 update -y -q
            sudo env DEBIAN_FRONTEND=noninteractive timeout 900s apt-get -o Acquire::Retries=3 install -y -q --no-install-recommends ffmpeg
            ffmpeg -version | head -n 1
          fi

      # tests/db/*_pg.py start a throwaway PostgreSQL from the runner's server
      # binaries; the retrieval migration test also needs pgvector. Best effort:
      # without it that one test module skips.
      - name: Install pgvector for migration tests
        run: sudo apt-get install -y -q postgresql-16-pgvector || echo "pgvector unavailable; vector migration tests will skip"

      - name: Lint confidence honesty (Module C)
        working-directory: .
        run: |
          python scripts/lint-confidence-honesty.py
          python scripts/lint-confidence-honesty.py --report
          python -c "import json; d=json.load(open('docs/delivery/confidence-honesty-debt.json')); print(f\"DEBT_TRACKER active={d['active_findings']} grandfathered_remaining={d['grandfathered_remaining']} fixed_since_baseline={len(d.get('fixed_since_baseline') or [])} target={d['target']}\")"

      - name: Lint smoke harness (conversation isolation)
        working-directory: .
        run: python scripts/lint-smoke-harness.py

      - name: Golden benchmark (Phase A + traffic scenarios)
        run: python -m pytest tests/services/test_phase_a_cognitive_runtime_benchmark.py tests/services/test_golden_benchmark_traffic.py tests/services/test_action_execute_now.py -q
        env:
          APP_ENV: dev
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_ANON_KEY: anon-test
          SUPABASE_SERVICE_ROLE_KEY: service-role-test
          SUPABASE_JWT_SECRET: jwt-secret-test
          OPENAI_API_KEY: sk-test-openai

      - name: Install PostgreSQL server (write invoke idempotency gate)
        run: |
          sudo apt-get update -y -q
          sudo apt-get install -y -q postgresql postgresql-client
          PGVER="$(ls /usr/lib/postgresql | sort -V | tail -1)"
          echo "GRAVITRE_PG_BIN=/usr/lib/postgresql/${PGVER}/bin" >> "$GITHUB_ENV"

      - name: Write invoke idempotency Postgres acceptance (must not skip)
        run: python -m pytest tests/db/test_write_invoke_idempotency_pg.py -q --no-header
        env:
          APP_ENV: dev
          GRAVITRE_REQUIRE_PG: "1"

      - name: Marketplace certification PostgreSQL acceptance (must not skip)
        working-directory: backend
        run: GRAVITRE_REQUIRE_PG=1 APP_ENV=dev python -m pytest -q tests/db/test_marketplace_certification_pg.py
      - name: Founder billing safety PostgreSQL acceptance (must not skip)
        run: python -m pytest tests/db/test_founder_billing_safety_pg.py tests/billing/test_billing_safety_controls.py -q --no-header
        env:
          APP_ENV: dev
          GRAVITRE_REQUIRE_PG: "1"

      - name: Assistant atomic usage Postgres acceptance (must not skip)
        run: python -m pytest tests/db/test_assistant_usage_atomic_pg.py -q --no-header
        env:
          APP_ENV: dev
          GRAVITRE_REQUIRE_PG: "1"

      - name: Mixed-source atomic usage Postgres acceptance (must not skip)
        run: python -m pytest tests/db/test_atomic_usage_all_sources_pg.py -q --no-header
        env:
          APP_ENV: dev
          GRAVITRE_REQUIRE_PG: "1"

      - name: Durable assistant recovery Postgres acceptance (must not skip)
        run: |
          python -m pytest tests/db/test_assistant_billing_recovery_pg.py -q --no-header
          python -m pytest tests/services/test_assistant_billing_contract.py tests/billing/test_usage_scheduler.py -q --no-header
        env:
          APP_ENV: dev
          GRAVITRE_REQUIRE_PG: "1"

      - name: Stripe outbox PostgreSQL acceptance (must not skip)
        run: |
          python -m pytest tests/db/test_stripe_meter_outbox_pg.py -q --no-header
          python -m pytest tests/billing/test_stripe_meter_outbox.py tests/billing/test_stripe_meter_intents.py -q --no-header
        env:
          APP_ENV: dev
          GRAVITRE_REQUIRE_PG: "1"

      - name: Company intelligence source revocation contract
        run: python -m pytest tests/services/test_company_intelligence_memory_lineage.py tests/test_company_intelligence_prompt_injection.py -q --no-header
        env:
          APP_ENV: dev

      - name: Workflow model comparison contract (no provider requests)
        run: |
          python -m pytest tests/services/test_llm_workflow_evaluation.py -q --no-header
          python ../scripts/evaluate_llm_workflows.py --models gpt-5.4-mini
        env:
          APP_ENV: dev

      - name: Memory lineage write integrity contract
        run: >-
          python -m pytest -q --no-header
          tests/services/test_memory_source_lineage.py
          tests/services/test_memory_lineage_coverage.py
          tests/services/test_memory_source_liveness.py
        env:
          APP_ENV: dev

      - name: Workflow approval projection contract
        run: >-
          python -m pytest -q tests/services/test_react_canvas_write_gate.py
          tests/services/test_workflow_approval_scope_audit.py
          tests/services/test_write_authority_spine.py
          tests/services/test_write_approval_fingerprints.py

      - name: Resolved MCP approval and verification contract
        run: >-
          python -m pytest -q --no-header
          tests/services/test_mcp_approval_decision.py
          tests/services/test_mcp_approval_binding.py
          tests/routers/test_admin_queue_approval_binding.py
          tests/test_mcp_tool_layer.py
          tests/capabilities/test_portable_mcp_write_verification.py
        env:
          APP_ENV: dev

      - name: Connector credential tenant-scope contract
        run: >-
          python -m pytest
          tests/connectors/test_connector_secret_org_scope.py
          tests/routers/test_connectors_list_secrets_batch.py
          tests/connectors/test_twilio_api_key_auth.py
          tests/connectors/test_semrush_api.py
          tests/connectors/test_segment_api.py
          tests/services/test_source_lifecycle.py
          -q --no-header
        env:
          APP_ENV: dev

      - name: Assistant crash-gap recovery contract
        working-directory: .
        run: python -m pytest scripts/tests/test_reconcile_assistant_billing.py -q --no-header
        env:
          APP_ENV: dev

      - name: Install and start Redis (workflow queue integration)
        run: |
          sudo apt-get install -y -q redis-server
          sudo systemctl start redis-server

      - name: Workflow queue Redis integration
        run: python -m pytest tests/workers/test_workflow_queue_redis_integration.py -q --no-header
        env:
          APP_ENV: dev
          REDIS_URL: redis://127.0.0.1:6379/15
          GRAVITRE_REQUIRE_REDIS: "1"

      - name: Assistant stream contract
        run: python -m pytest tests/test_assistant_unified_pipeline.py -q --no-header
        env:
          APP_ENV: dev
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_ANON_KEY: anon-test
          SUPABASE_SERVICE_ROLE_KEY: service-role-test
          SUPABASE_JWT_SECRET: jwt-secret-test
          OPENAI_API_KEY: sk-test-openai

      - name: Approved Agency Agents offline lifecycle and streaming contracts
        run: >-
          python -m pytest -p tests.offline_network -q
          tests/test_offline_network_guard.py
          tests/marketplace/test_approved_agency_enrichment.py
          tests/marketplace/test_agency_agents_catalog.py
          tests/routers/test_marketplace_install_pack_routes.py
          tests/services/test_native_agent_adapters.py
          tests/marketplace/test_paid_media.py
          tests/services/test_pr581_shared_prompt_compatibility.py
          tests/operators/test_agent_intelligence.py::test_streaming_emits_text_events_when_react_returns_answer_only
        env:
          APP_ENV: dev
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_ANON_KEY: anon-test
          SUPABASE_SERVICE_ROLE_KEY: service-role-test
          SUPABASE_JWT_SECRET: jwt-secret-test
          OPENAI_API_KEY: sk-test-openai
          GOOGLE_API_KEY: test-google-key
          ANTHROPIC_API_KEY: sk-test-anthropic

      - name: Run tests
        run: python -m pytest -q
        env:
          APP_ENV: dev
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_ANON_KEY: anon-test
          SUPABASE_SERVICE_ROLE_KEY: service-role-test
          SUPABASE_JWT_SECRET: jwt-secret-test
          OPENAI_API_KEY: sk-test-openai
          # Unit tests use synthetic org-1; never inherit smoke isolation flags.
          GRAVITRE_SMOKE_RUN: ""
          GRAVITREE_SMOKE_RUN: ""
          GRAVITRE_CONVERSATION_SMOKE: ""
          GRAVITREE_CONVERSATION_SMOKE: ""

      - name: Scripted voice external-source isolation (offline)
        run: >-
          python -m pytest -p tests.offline_network -q
          tests/services/pipecat_voice/test_interrupt_intents.py
          tests/services/pipecat_voice/test_cognitive_llm_barge_in_and_seed.py
          tests/services/pipecat_voice/test_cognitive_llm_speculative_adoption.py
          tests/services/pipecat_voice/test_cognitive_llm_text_streaming.py
          tests/services/pipecat_voice/test_cognitive_llm_tool_latency.py
          tests/services/pipecat_voice/test_cognitive_llm_tool_narration.py
          tests/services/pipecat_voice/test_cognitive_llm_tts_word_boundary_regression.py
          tests/services/pipecat_voice/test_cognitive_llm_turn_trace.py
          tests/services/pipecat_voice/test_conversation_tier_speculative_parity.py
          tests/services/pipecat_voice/test_speculative_bounds_and_revisions.py
          tests/services/pipecat_voice/test_spoken_formatting.py
          tests/services/pipecat_voice/test_scripted_voice_external_sources.py
          tests/services/pipecat_voice/test_voice_shared_turn_guardrails.py
          tests/services/test_ai_guardrails.py
          tests/services/test_model_policy_service.py
          tests/services/test_conversation_evaluation_bundle.py
          tests/services/test_conversation_benchmark_evidence.py
          tests/services/test_catalog_channel_authority_matrix.py
          tests/services/test_guidance_optimization.py
          tests/services/test_agent_creation_dialogue.py
          tests/services/test_dialogue_evaluation_feedback.py
          tests/services/test_social_intelligence_evaluation_bundle.py
          tests/services/test_governed_memory_benchmark.py
          tests/services/test_memory_quarantine_boundaries.py
          tests/services/test_mem0_engine_protocol.py
        env:
          APP_ENV: dev
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_ANON_KEY: anon-test
          SUPABASE_SERVICE_ROLE_KEY: service-role-test
          SUPABASE_JWT_SECRET: jwt-secret-test
          OPENAI_API_KEY: sk-test-openai
          GOOGLE_API_KEY: test-google-key
          ANTHROPIC_API_KEY: sk-test-anthropic

      # Unified cognitive eval gate: structural suite + pending-reply + council + kernel.
      - name: Cognitive regression suite (structural + targeted pytest)
        working-directory: .
        run: node scripts/cognitive-regression-suite.mjs
        env:
          COGNITIVE_REGRESSION_RUN_PYTEST: "1"
          APP_ENV: dev
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_ANON_KEY: anon-test
          SUPABASE_SERVICE_ROLE_KEY: service-role-test
          SUPABASE_JWT_SECRET: jwt-secret-test
          OPENAI_API_KEY: sk-test-openai

      - name: Marketplace QA (schemas, install, RLS)
        run: python -m pytest tests/marketplace/ -q
        env:
          APP_ENV: dev
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_ANON_KEY: anon-test
          SUPABASE_SERVICE_ROLE_KEY: service-role-test
          SUPABASE_JWT_SECRET: jwt-secret-test
          OPENAI_API_KEY: sk-test-openai

  security-scan:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: pip-audit (backend)
        run: python scripts/pip-audit-backend.py

      - name: pip-audit (isolated SDK worker lock)
        run: |
          python -m pip install pip-audit
          python -m pip_audit --no-deps --disable-pip -r scripts/memory_benchmark/engine-audit.txt

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: pnpm audit (web, fail on critical)
        working-directory: apps/web
        run: |
          pnpm install --frozen-lockfile
          # Retry: npm audit registry occasionally returns gzip/binary that pnpm cannot JSON.parse.
          for attempt in 1 2 3 4 5; do
            if out="$(pnpm audit --audit-level=critical 2>&1)"; then
              echo "$out"
              exit 0
            fi
            echo "$out"
            if echo "$out" | grep -q "Unexpected token"; then
              echo "pnpm audit registry parse flake (attempt $attempt) — retrying..."
              sleep $((attempt * 3))
              continue
            fi
            exit 1
          done
          echo "pnpm audit still failing after retries on registry parse flake — continuing (pip-audit already ran)"
          exit 0

      - name: pnpm audit (web, high report)
        working-directory: apps/web
        continue-on-error: true
        run: pnpm audit --audit-level=high

  billing-e2e:
    name: Billing E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Manual/signal only — do not run on main push. A failed check (even with
    # continue-on-error) still blocks Railway "Wait for CI" and pins the tip.
    if: github.event_name == 'workflow_dispatch'
    needs: [web, backend]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install root + web + backend dependencies
        run: |
          npm install
          cd apps/web && pnpm install --frozen-lockfile
          cd ../../backend
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run billing Playwright suite
        run: npm run test:e2e
        env:
          CI: "true"
