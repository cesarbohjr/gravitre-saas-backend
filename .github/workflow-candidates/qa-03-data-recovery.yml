  supabase_migration_safety__validate-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Check migration version uniqueness and file format
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY'\nimport pathlib, re, sys\nroot = pathlib.Path(\"supabase/migrations\")\nif\
        \ not root.is_dir():\n    sys.exit(\"Missing supabase/migrations\")\nversions = {}\nbad = []\nfor f in root.iterdir():\n\
        \    if not f.is_file() or f.suffix != \".sql\":\n        continue\n    m = re.fullmatch(r\"(\\d{8,14})_[A-Za-z0-9_]+\\\
        .sql\", f.name)\n    if not m:\n        bad.append(f\"Invalid filename: {f.name}\")\n        continue\n    v = m.group(1)\n\
        \    if v in versions:\n        bad.append(f\"Duplicate version {v}: {versions[v]} and {f.name}\")\n    versions[v]\
        \ = f.name\n    if not f.read_text(encoding=\"utf-8\").strip():\n        bad.append(f\"Empty migration: {f.name}\"\
        )\nif bad:\n    sys.exit(\"\\n\".join(bad))\nprint(f\"Validated {len(versions)} migration filenames (no database touched).\"\
        )\nPY\n"
    - name: List migrations changed in this pull request
      if: github.event_name == 'pull_request'
