        \ 0\nfi\nprintf '%s\\n' \"${files[@]}\" > /tmp/changed-migrations.txt\necho \"changed=true\" >> \"$GITHUB_OUTPUT\"\
        \necho \"Changed migration files:\"\ncat /tmp/changed-migrations.txt\n"
    - name: Security scan on changed migration files
