      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY'\nimport pathlib, re, sys\nfiles = [pathlib.Path(p.strip()) for p in open(\"\
        /tmp/changed-migrations.txt\") if p.strip()]\nif not files:\n    sys.exit(0)\nblocked = [\n    (re.compile(r\"-----BEGIN\
        \ (?:RSA |EC |OPENSSH )?PRIVATE KEY-----\"), \"embedded private key material\"),\n    (re.compile(r\"\\bAKIA[0-9A-Z]{16}\\\
        b\"), \"possible AWS access key id\"),\n    (\n        re.compile(r\"\\bGRANT\\b[^;]*\\bTO\\s+(PUBLIC|anon)\\b\",\
        \ re.I),\n        \"GRANT to PUBLIC/anon (same statement)\",\n    ),\n    (re.compile(r\"\\bpg_read_file\\s*\\(\"\
        , re.I), \"pg_read_file()\"),\n    (re.compile(r\"\\\\copy\\b.*\\bprogram\\b\", re.I), \"\\\\copy PROGRAM\"),\n  \
        \  (re.compile(r\"\\blo_import\\s*\\(\", re.I), \"lo_import()\"),\n    (re.compile(r\"postgresql://[^\\s'\\\"]+:[^\\\
        s'\\\"]+@\", re.I), \"postgres URL with embedded password\"),\n]\nrisky = re.compile(\n    r\"\\b(drop\\s+(?:table|schema|column)|truncate|delete\\\
        s+from|alter\\s+table[\\s\\S]{0,120}drop\\s+column|revoke|create\\s+policy|drop\\s+policy)\\b\",\n    re.I,\n)\nerrors\
        \ = []\nwarnings = []\nfor f in files:\n    if not f.is_file():\n        errors.append(f\"Missing changed migration\
        \ file: {f}\")\n        continue\n    text = f.read_text(encoding=\"utf-8\")\n    for pat, label in blocked:\n   \
        \     if pat.search(text):\n            errors.append(f\"{f.name}: blocked pattern ({label})\")\n    if risky.search(text):\n\
        \        warnings.append(f.name)\nif warnings:\n    print(\"Changed migrations flagged for human review (destructive/RLS):\
