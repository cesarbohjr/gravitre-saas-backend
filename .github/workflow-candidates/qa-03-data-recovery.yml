        \    \"-- CI-only historical inventory dependency prelude.\\n\"\n    + inventory_ddl + \"\\n\" + inventory_early.read_text()\n\
        )\nprint(\"CI-only process inventory table ordering; original files untouched.\")\n# The production test-credential\
        \ allowlist contains a real org id\n# which intentionally does not exist in an empty local database.\n# Retain the\
        \ security trigger and schema; omit only the missing-org\n# fixture row in this disposable replay.\nguard = path.parent\
        \ / \"20260719180000_test_credential_isolated_org_guard.sql\"\nguard_sql = guard.read_text()\nold_seed = \"\\n\".join([\n\
        \    \"INSERT INTO public.test_credential_org_allowlist (org_id, note)\",\n    \"VALUES (\",\n    \"  'f07e57c0-1501-4000-8000-c04e57a00001',\"\
        ,\n    \"  'gravitre-isolated-conversation-smoke'\",\n    \")\",\n    \"ON CONFLICT (org_id) DO NOTHING;\",\n])\n\
        new_seed = \"\\n\".join([\n    \"INSERT INTO public.test_credential_org_allowlist (org_id, note)\",\n    \"SELECT\
        \ 'f07e57c0-1501-4000-8000-c04e57a00001'::uuid,\",\n    \"       'gravitre-isolated-conversation-smoke'\",\n    \"\
        WHERE EXISTS (\",\n    \"    SELECT 1 FROM public.organizations\",\n    \"    WHERE id='f07e57c0-1501-4000-8000-c04e57a00001'::uuid\"\
        ,\n    \")\",\n    \"ON CONFLICT (org_id) DO NOTHING;\",\n])\nif guard_sql.count(old_seed) != 1:\n    raise SystemExit(\"\
        Unexpected isolated-org seed shape\")\nguard.write_text(guard_sql.replace(old_seed, new_seed))\nprint(\"CI-only conditional\
        \ test-org seed; production guard unchanged.\")\n# PostgreSQL advisor indexes were created against a live schema\n\
        # that had out-of-band columns. Retain each index where its real\n# target column exists; an absent column must not\
        \ abort the\n# remaining functional migrations in a disposable fresh database.\nimport re\nperf = path.parent / \"\
        20260805221000_perf_advisor_fk_indexes.sql\"\nperf_sql = perf.read_text()\nindex_pat = re.compile(\n    r\"^CREATE\
        \ INDEX IF NOT EXISTS ([A-Za-z0-9_]+) ON public[.]([A-Za-z0-9_]+) [(]([A-Za-z0-9_]+)[)];$\",\n    re.MULTILINE,\n\
        )\ndef guarded_index(match):\n    name, table, column = match.groups()\n    sql = (\n        \"DO $ci_index$ BEGIN\
        \ \"\n        \"IF EXISTS (SELECT 1 FROM information_schema.columns \"\n        \"WHERE table_schema='public' AND\
        \ table_name='\" + table + \"' \"\n        \"AND column_name='\" + column + \"') THEN \"\n        \"EXECUTE 'CREATE\
        \ INDEX IF NOT EXISTS \" + name + \" ON public.\"\n        + table + \" (\" + column + \")'; \"\n        \"END IF;\
        \ END $ci_index$;\"\n    )\n    return sql\nperf_sql, index_count = index_pat.subn(guarded_index, perf_sql)\nif index_count\
        \ != 11:\n    raise SystemExit(f\"Unexpected historical advisor index count: {index_count}\")\nperf.write_text(perf_sql)\n\
        print(\"CI-only guarded advisor indexes; original migration unchanged.\")\n# CI-local replay: metadata ALTER predates\
        \ the knowledge table CREATE.\nfabric_sql = pathlib.Path(\"supabase/migrations/20260811180000_platform_knowledge_fabric.sql\"\
        ).read_text()\nbegin = fabric_sql.index(\"CREATE TABLE IF NOT EXISTS public.knowledge_sources (\")\nfinish = fabric_sql.index(\"\
        CREATE TABLE IF NOT EXISTS public.knowledge_documents\", begin)\nsource_ddl = fabric_sql[begin:finish]\nlicense_migration\
        \ = path.parent / \"20260811175745_knowledge_sources_license_metadata.sql\"\nlicense_sql = license_migration.read_text()\n\
        if not license_sql.startswith(\"-- Extend knowledge_sources\"):\n    raise SystemExit(\"Unexpected license-metadata\
        \ migration\")\nlicense_migration.write_text(source_ddl + \"\\n\" + license_sql)\nprint(\"CI replay: knowledge_sources\
        \ DDL ordered before license metadata.\")\n\n\n\n\nPY\ncd \"$replay_dir\"\n# A GitHub hosted runner can already have\
        \ the default Supabase\n# 54322/tcp bound by unrelated jobs. Configure unique local-only\n# ports *in this disposable\
        \ copy* before starting Docker. Do not\n# change the tracked Supabase config or use production services.\npython3\
        \ - <<'PY'\nfrom pathlib import Path\nimport os\nimport random\nimport re\nimport socket\ncfg = Path(\"supabase/config.toml\"\
        )\noriginal = cfg.read_text()\ndefaults = (54320, 54321, 54322, 54323, 54324, 54329)\nrandomizer = random.SystemRandom()\n\
        def available(port):\n    for family, host in ((socket.AF_INET, \"127.0.0.1\"),):\n        with socket.socket(family,\
        \ socket.SOCK_STREAM) as sock:\n            try:\n                sock.bind((host, port))\n            except OSError:\n\
        \                return False\n    return True\nfor _ in range(200):\n    base = randomizer.randint(25000, 49000)\n\
        \    ports = {old: base + (old - 54320) for old in defaults}\n    if all(available(port) for port in ports.values()):\n\
        \        break\nelse:\n    raise SystemExit(\"Unable to reserve a free local Supabase port group\")\nconfig = original\n\
        for old, port in ports.items():\n    config, changed = re.subn(\n        rf\"(?m)^((?:shadow_)?port\\s*=\\s*){old}$\"\
        ,\n        lambda match: match.group(1) + str(port),\n        config,\n    )\n    if changed != 1:\n        raise\
        \ SystemExit(f\"Unexpected local Supabase port config for {old}: {changed}\")\nold_name = \"gravitre-operator-ai\"\
        \nif config.count(old_name) != 1:\n    raise SystemExit(\"Missing unique local project identifier\")\nconfig = config.replace(\n\
        \    old_name, \"gravitre-qa-\" + os.environ.get(\"GITHUB_RUN_ID\", \"local\"), 1\n)\ncfg.write_text(config)\nprint(\"\
        Disposable Supabase replay uses isolated ports and project identity.\")\nPY\n# Docker may race the free-port probe\
        \ above. Retry only a confirmed\n# host-port collision with a fresh disposable set; all other\n# Supabase startup\
        \ or SQL errors remain hard failures.\nfor attempt in 1 2 3; do\n  if supabase start -x studio,imgproxy,edge-runtime,logflare,vector\
        \ > \"$RUNNER_TEMP/supabase-start.log\" 2>&1; then\n    cat \"$RUNNER_TEMP/supabase-start.log\"\n    break\n  fi\n\
        \  cat \"$RUNNER_TEMP/supabase-start.log\"\n  if ! grep -q 'failed to bind host port.*address already in use' \"$RUNNER_TEMP/supabase-start.log\"\
        \ || [ \"$attempt\" -eq 3 ]; then\n    exit 1\n  fi\n  supabase stop --no-backup > /dev/null 2>&1 || true\n  python3\
        \ - <<'PY'\nfrom pathlib import Path\nimport random\nimport re\nimport socket\ncfg = Path(\"supabase/config.toml\"\
        )\noriginal = cfg.read_text()\npattern = re.compile(r\"(?m)^((?:shadow_)?port\\s*=\\s*)(\\d+)$\")\nmatches = list(pattern.finditer(original))\n\
        if len(matches) < 6:\n    raise SystemExit(\"Unexpected isolated port configuration\")\nold_ports = {int(m.group(2))\
        \ for m in matches}\nsmallest = min(old_ports)\nrng = random.SystemRandom()\nfor _ in range(300):\n    base = rng.randint(25000,\
        \ 49000)\n    mapped = {old: base + (old - smallest) for old in old_ports}\n    if max(mapped.values()) > 65000:\n\
        \        continue\n    def free(port):\n        with socket.socket(socket.AF_INET, socket.SOCK_STREAM) as sock:\n\
        \            try:\n                sock.bind((\"0.0.0.0\", port))\n                return True\n            except\
        \ OSError:\n                return False\n    if all(free(port) for port in mapped.values()):\n        break\nelse:\n\
        \    raise SystemExit(\"No free replacement Supabase port group\")\ncfg.write_text(pattern.sub(lambda match:\n   \
        \ match.group(1) + str(mapped[int(match.group(2))]), original))\nprint(\"Retrying local-only Supabase on a new port\
        \ group.\")\nPY\ndone\nsupabase db reset --no-seed\necho \"Local Supabase replayed all migrations on isolated Docker\
        \ ports (production untouched).\"\n"
    - name: Set up isolated billing browser acceptance
      if: steps.gate.outputs.billing == 'true'
      uses: actions/setup-node@v4
      with:
        node-version: 22
    - uses: pnpm/action-setup@v4
      if: steps.gate.outputs.billing == 'true'
      with:
        version: 10.11.0
    - uses: actions/setup-python@v5
      if: steps.gate.outputs.billing == 'true'
      with:
        python-version: '3.12'
    - name: Install billing acceptance dependencies
      if: steps.gate.outputs.billing == 'true'
      run: 'pnpm install --frozen-lockfile --ignore-scripts

        pnpm --dir apps/web install --frozen-lockfile

        pip install --no-cache-dir -r backend/requirements-dev.txt

        npx playwright install --with-deps chromium

        '
    - name: Configure disposable authenticated role acceptance
      if: steps.gate.outputs.billing == 'true'
      run: 'umask 077

        supabase status --workdir "$BILLING_REPLAY_DIR" -o json > "$RUNNER_TEMP/billing-supabase.json"

        python scripts/configure-billing-acceptance.py --supabase-status "$RUNNER_TEMP/billing-supabase.json" --auth-only

        '
    - name: Genuine founder and organization-owner browser authorization
      if: steps.gate.outputs.billing == 'true'
      env:
        CI: 'true'
        PYTHON: python
      run: npx playwright test --config playwright.billing.acceptance.config.ts --grep 'signed-in organization owner|founder
        can read controls'
    - name: Upload sanitized authenticated role evidence
      if: always() && steps.gate.outputs.billing == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: billing-authenticated-roles
        path: 'test-results/billing-acceptance-summary.json

          test-results/**/*.png

          '
    - name: Configure disposable Supabase and Stripe sandbox only
      env:
        BILLING_REQUIRE_STRIPE_TEST_KEYS: '1'
        STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
        STRIPE_TEST_PUBLISHABLE_KEY: ${{ secrets.STRIPE_TEST_PUBLISHABLE_KEY }}
        STRIPE_EXISTING_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        STRIPE_EXISTING_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      if: steps.gate.outputs.billing == 'true'
      run: 'umask 077

        supabase status --workdir "$BILLING_REPLAY_DIR" -o json > "$RUNNER_TEMP/billing-supabase.json"

        python scripts/configure-billing-acceptance.py --supabase-status "$RUNNER_TEMP/billing-supabase.json"

        '
    - name: Authenticated billing browser and sandbox invoice acceptance
      if: steps.gate.outputs.billing == 'true'
      env:
        CI: 'true'
        PYTHON: python
      run: npx playwright test --config playwright.billing.acceptance.config.ts
    - name: Upload sanitized billing acceptance evidence
      if: always() && steps.gate.outputs.billing == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: billing-isolated-acceptance
        path: 'test-results/billing-acceptance-summary.json

          test-results/stripe-submit-dom.json

          test-results/**/*.png

          test-results/**/error-context.md

          '
        if-no-files-found: warn
    - name: Remote staging reconcile (when configured)
      if: steps.gate.outputs.run == 'true' && vars.SUPABASE_STAGING_PROJECT_REF != ''
      env:
        SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        STAGING_REF: ${{ vars.SUPABASE_STAGING_PROJECT_REF }}
      shell: bash
      run: "set -euo pipefail\nif [ -z \"${SUPABASE_ACCESS_TOKEN:-}\" ]; then\n  echo \"::error::SUPABASE_STAGING_PROJECT_REF\
        \ is set but SUPABASE_ACCESS_TOKEN is missing.\"\n  exit 1\nfi\nsupabase link --project-ref \"$STAGING_REF\" --password\
        \ \"${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}\"\nsupabase migration list\necho \"Staging project linked for history\
        \ reconciliation (no db push \u2014 human-approved deploy only).\"\n"
    permissions:
      contents: read
  pr605_gate26_postgres_outbox__isolated-outbox:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Prepare isolated PostgreSQL binaries and runner
      shell: bash
      run: "set -euo pipefail\nfor dir in /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/powershell; do\n\
        \  if [ -d \"$dir\" ]; then sudo rm -rf -- \"$dir\"; fi\ndone\nsudo apt-get update -qq\nsudo apt-get install -y postgresql\
        \ postgresql-client\ntest -n \"$(find /usr/lib/postgresql -name initdb -type f -print -quit)\"\ndf -h /\n"
    - name: Install test dependencies
      run: 'python -m pip install --no-cache-dir --no-compile -r requirements-dev.txt

        python -m pip check

        '
    - name: Execute real throwaway PostgreSQL outbox suite
      env:
        APP_ENV: dev
        SUPABASE_URL: https://test.supabase.co
        SUPABASE_ANON_KEY: anon-test
        SUPABASE_SERVICE_ROLE_KEY: service-role-test
        SUPABASE_JWT_SECRET: jwt-secret-test
        OPENAI_API_KEY: sk-test-openai
      run: "set -euo pipefail\npython - <<'PY'\nfrom tests.db.pg_harness import PG_BIN\nif PG_BIN is None:\n    raise SystemExit(\"\
        PostgreSQL binaries absent: refusing to certify skipped tests\")\nprint(\"Isolated PostgreSQL binaries:\", PG_BIN)\n\
        PY\npython -m pytest -q -rs tests/db/test_domain_event_outbox_pg.py\n"
    name: isolated-outbox
    needs:
    - dispatch_contract
    if: ${{ needs.dispatch_contract.result == 'success' && inputs.source == 'pr605-gate26-postgres-outbox' && (success())
      }}
    permissions:
      contents: read
