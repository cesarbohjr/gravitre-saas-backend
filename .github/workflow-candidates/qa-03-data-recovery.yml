        git clone --depth 1 --branch v0.8.0 https://github.com/pgvector/pgvector.git "$RUNNER_TEMP/pgvector-0.8.0"

        bash scripts/migration_recovery/install_pgvector.sh "$RUNNER_TEMP/pgvector-0.8.0"

        '
    - name: Reproduce original history failure and validate exact SQLSTATE
      run: 'python scripts/migration_recovery/replay.py --history "$RUNNER_TEMP/migration-recovery/original-history.json"
        --database-url postgresql://postgres:postgres@127.0.0.1:54322/postgres --report test-results/migration-history-original.json
        && exit 1

        python - <<''PYCODE''

        import json

        report=json.load(open(''test-results/migration-history-original.json''))

        assert report[''failure''][''version'']==''20250220000006'', report

        assert report[''failure''][''sqlstate'']==''42P13'', report

        assert len(report[''applied''])==18, report

        PYCODE

        '
    - name: Recreate empty local database and build corrected replay candidate
      run: 'supabase db reset --local --no-seed --workdir "$RUNNER_TEMP/migration-recovery/local"

        # A Supabase reset can recreate the database container, dropping the

        # previously installed 0.8.0 control and SQL files. Reinstall into

        # the running container before CREATE EXTENSION / version assertions.

        bash scripts/migration_recovery/install_pgvector.sh "$RUNNER_TEMP/pgvector-0.8.0"

        python scripts/migration_recovery/candidate.py "$RUNNER_TEMP/migration-recovery/original-history.json" "$RUNNER_TEMP/migration-recovery/candidate-history.json"

        '
    - name: Replay all corrected recorded migrations on real PostgreSQL
      run: python scripts/migration_recovery/replay.py --history "$RUNNER_TEMP/migration-recovery/candidate-history.json"
        --database-url postgresql://postgres:postgres@127.0.0.1:54322/postgres --report test-results/migration-history-candidate.json
    - name: Restore original migration metadata backup and verify exact SQL arrays
      run: python scripts/migration_recovery/rollback_drill.py postgresql://postgres:postgres@127.0.0.1:54322/postgres "$RUNNER_TEMP/migration-recovery/original-history.json"
        test-results/migration-history-rollback-drill.json
    - name: Reconcile isolated schema to captured production definitions and verify parity
      run: python scripts/migration_recovery/validate_baseline.py postgresql://postgres:postgres@127.0.0.1:54322/postgres
        "$RUNNER_TEMP/migration-recovery" test-results/migration-history-schema-parity.json
    - name: Generate data-free baseline from verified isolated schema
      run: 'supabase db dump --help > "$RUNNER_TEMP/migration-recovery/db-dump-help.txt"

        supabase db dump --local --schema public --file "$GITHUB_WORKSPACE/test-results/production-schema-baseline.sql" --workdir
        "$RUNNER_TEMP/migration-recovery/local"

        python scripts/migration_recovery/append_dependencies.py "$RUNNER_TEMP/migration-recovery/production-inventory.json"
        test-results/production-schema-baseline.sql

        sha256sum test-results/production-schema-baseline.sql > test-results/production-schema-baseline.sha256

        '
    - name: Restore baseline into a fresh database and verify without repairs
      run: 'supabase db reset --local --no-seed --workdir "$RUNNER_TEMP/migration-recovery/local"

        # A Supabase reset can recreate the database container, dropping the

        # previously installed 0.8.0 control and SQL files. Reinstall into

        # the running container before CREATE EXTENSION / version assertions.

        bash scripts/migration_recovery/install_pgvector.sh "$RUNNER_TEMP/pgvector-0.8.0"

        docker exec -i supabase_db_gravitre-operator-ai psql -U postgres -d postgres -v ON_ERROR_STOP=1 < test-results/production-schema-baseline.sql

        python scripts/migration_recovery/validate_baseline.py postgresql://postgres:postgres@127.0.0.1:54322/postgres "$RUNNER_TEMP/migration-recovery"
        test-results/migration-history-baseline-restore.json --verify-only

        '
    - name: Real PostgreSQL concurrency, authorization and fail-closed acceptance on restored baseline
      run: python scripts/migration_recovery/acceptance.py postgresql://postgres:postgres@127.0.0.1:54322/postgres test-results/migration-history-acceptance.json
    - name: Prove failed atomic metadata replacement preserves every original SQL array
      run: "# The pinned CLI squash command edits local files only. It does NOT\n# replace remote history; never treat its\
        \ success as rollback proof.\npython scripts/migration_recovery/metadata_drill.py prepare postgresql://postgres:postgres@127.0.0.1:54322/postgres\
        \ \"$RUNNER_TEMP/migration-recovery/original-history.json\" 20261022162553 test-results/migration-history-atomic-baseline.json\n\
        if python scripts/migration_recovery/atomic_baseline.py postgresql://postgres:postgres@127.0.0.1:54322/postgres \"\
        $RUNNER_TEMP/migration-recovery/original-history.json\" 20261022162553 test-results/production-schema-baseline.sql;\
        \ then\n  echo 'Expected rejected baseline INSERT; refusing an unproven rollback.'\n  exit 1\nfi\npython scripts/migration_recovery/metadata_drill.py\
        \ check-rollback postgresql://postgres:postgres@127.0.0.1:54322/postgres \"$RUNNER_TEMP/migration-recovery/original-history.json\"\
        \ 20261022162553 test-results/migration-history-atomic-baseline.json\n"
    - name: Prove successful atomic replacement changes only disposable metadata
      run: 'python scripts/migration_recovery/atomic_baseline.py postgresql://postgres:postgres@127.0.0.1:54322/postgres "$RUNNER_TEMP/migration-recovery/original-history.json"
        20261022162553 test-results/production-schema-baseline.sql

        python scripts/migration_recovery/metadata_drill.py check-success postgresql://postgres:postgres@127.0.0.1:54322/postgres
        "$RUNNER_TEMP/migration-recovery/original-history.json" 20261022162553 test-results/migration-history-atomic-baseline.json

        python scripts/migration_recovery/validate_baseline.py postgresql://postgres:postgres@127.0.0.1:54322/postgres "$RUNNER_TEMP/migration-recovery"
        test-results/migration-history-atomic-schema-unchanged.json --verify-only

        '
    - name: Preserve sanitized failure or success evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: migration-history-replay
        path: 'test-results/migration-history-*.json

          test-results/production-schema-baseline.*

          '
