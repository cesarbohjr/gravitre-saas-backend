  source_outcomes:
    name: Record independent source workflow outcomes
    if: ${{ always() && needs.dispatch_contract.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions: {}
    needs:
    - dispatch_contract
    - authenticated_click_audit__deep-surface-click-audit
    - browser_fallback_recovery_certification__independent-recovery-acceptance
    - conversational_product_acceptance__acceptance
    - desktop_tauri__plan
    - desktop_tauri__build
    - desktop_tauri__publish
    - extension_release__release
    - navigation_e2e__navigation-click-through
    - pr605_route_inventory__registered-routes
    - release1_authenticated_network_audit__network-credential-audit
    - release1_authenticated_smoke__authenticated
    - release1_deployed_browser_credentials__browser-runtime
    steps:
    - name: Bind source outcomes to this run
      shell: python
      run: "import json, os\nsources = json.loads(os.environ['SOURCE_JOBS'])\nneeds = json.loads(os.environ['JOB_RESULTS'])\n\
        selected = json.loads(os.environ['SELECTED'])\noutcomes = {}\nfor name, source in sources.items():\n    if name not\
        \ in selected:\n        continue\n    results = [needs[key]['result'] for key in source['jobs']]\n    outcome = ('failure'\
        \ if 'failure' in results else 'cancelled' if 'cancelled' in results\n               else 'success' if 'success' in\
        \ results else 'skipped')\n    outcomes[source['display_name']] = outcome\nevidence = {'run_id': int(os.environ['GITHUB_RUN_ID']),\
        \ 'head_sha': os.environ['GITHUB_SHA'],\n            'source_outcomes': outcomes}\nwith open('canonical-workflow-outcomes.json',\
        \ 'w') as output:\n    json.dump(evidence, output)\n"
      env:
        SOURCE_JOBS: '{"authenticated-click-audit": {"display_name": "Authenticated Click Audit", "jobs": ["authenticated_click_audit__deep-surface-click-audit"]},
          "browser-fallback-recovery-certification": {"display_name": "Browser fallback recovery certification", "jobs": ["browser_fallback_recovery_certification__independent-recovery-acceptance"]},
          "conversational-product-acceptance": {"display_name": "Conversational product acceptance", "jobs": ["conversational_product_acceptance__acceptance"]},
          "desktop-tauri": {"display_name": "Desktop Tauri", "jobs": ["desktop_tauri__plan", "desktop_tauri__build", "desktop_tauri__publish"]},
          "extension-release": {"display_name": "Extension release", "jobs": ["extension_release__release"]}, "navigation-e2e":
          {"display_name": "Navigation E2E", "jobs": ["navigation_e2e__navigation-click-through"]}, "pr605-route-inventory":
          {"display_name": "Master QA | QA00 Routing Inventory Certification", "jobs": ["pr605_route_inventory__registered-routes"]},
          "release1-authenticated-network-audit": {"display_name": "Release 1 authenticated production network credential
          audit", "jobs": ["release1_authenticated_network_audit__network-credential-audit"]}, "release1-authenticated-smoke":
          {"display_name": "Release 1 authenticated production smoke", "jobs": ["release1_authenticated_smoke__authenticated"]},
          "release1-deployed-browser-credentials": {"display_name": "Release 1 deployed browser credential verification",
          "jobs": ["release1_deployed_browser_credentials__browser-runtime"]}}'
        JOB_RESULTS: '{"authenticated_click_audit__deep-surface-click-audit": {"result": "${{ needs.authenticated_click_audit__deep-surface-click-audit.result
          }}"}, "browser_fallback_recovery_certification__independent-recovery-acceptance": {"result": "${{ needs.browser_fallback_recovery_certification__independent-recovery-acceptance.result
          }}"}, "conversational_product_acceptance__acceptance": {"result": "${{ needs.conversational_product_acceptance__acceptance.result
          }}"}, "desktop_tauri__plan": {"result": "${{ needs.desktop_tauri__plan.result }}"}, "desktop_tauri__build": {"result":
          "${{ needs.desktop_tauri__build.result }}"}, "desktop_tauri__publish": {"result": "${{ needs.desktop_tauri__publish.result
          }}"}, "extension_release__release": {"result": "${{ needs.extension_release__release.result }}"}, "navigation_e2e__navigation-click-through":
          {"result": "${{ needs.navigation_e2e__navigation-click-through.result }}"}, "pr605_route_inventory__registered-routes":
          {"result": "${{ needs.pr605_route_inventory__registered-routes.result }}"}, "release1_authenticated_network_audit__network-credential-audit":
          {"result": "${{ needs.release1_authenticated_network_audit__network-credential-audit.result }}"}, "release1_authenticated_smoke__authenticated":
          {"result": "${{ needs.release1_authenticated_smoke__authenticated.result }}"}, "release1_deployed_browser_credentials__browser-runtime":
          {"result": "${{ needs.release1_deployed_browser_credentials__browser-runtime.result }}"}}'
        SELECTED: ${{ needs.dispatch_contract.outputs.selected }}
    - uses: actions/upload-artifact@v4
      with:
        name: canonical-workflow-outcomes-07-browser-product
        path: canonical-workflow-outcomes.json
        if-no-files-found: error
        retention-days: 14
