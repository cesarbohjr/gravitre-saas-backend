# STAGED: not installed in .github/workflows; automatic trigger cutover pending.
name: QA 10-operations
'on':
  workflow_dispatch:
    inputs:
      source:
        description: Original workflow contract to execute
        required: true
        type: choice
        options:
        - chat-history-hygiene-live
        - connector-health
        - knowledge-sync
        - metrics-rollup
        - msp-enrichment-workflow-live
        - native-workers-offline
        - platform-cs-backfill
        - probe-gmail-live-bugs-audit
        - smoke-conversation-pollution-cleanup
        - unified-turn-ops-gates
        - usage-sync
        - workflow-schedules
        default: chat-history-hygiene-live
      knowledge_sync__reason:
        description: 'knowledge-sync: Reason for manual trigger'
        required: false
      metrics_rollup__days:
        description: 'metrics-rollup: Days back to roll up'
        required: false
        default: '1'
      metrics_rollup__purge_days:
        description: 'metrics-rollup: Purge audit_events older than N days (optional)'
        required: false
      msp_enrichment_workflow_live__reason:
        description: 'msp-enrichment-workflow-live: Reason for manual trigger'
        required: false
        default: post-merge verification
      platform_cs_backfill__reason:
        description: 'platform-cs-backfill: Reason for manual trigger'
        required: false
      probe_gmail_live_bugs_audit__since_hours:
        description: 'probe-gmail-live-bugs-audit: Lookback window for conversation hunt'
        required: false
        default: '96'
      smoke_conversation_pollution_cleanup__apply:
        description: 'smoke-conversation-pollution-cleanup: Apply soft-deletes (unchecked = dry run only)'
        type: boolean
        default: true
        required: false
      usage_sync__reason:
        description: 'usage-sync: Reason for manual trigger'
        required: false
      workflow_schedules__reason:
        description: 'workflow-schedules: Reason for manual trigger'
        required: false
  push:
    branches:
    - main
  pull_request:
    types:
    - opened
    - reopened
    - synchronize
  schedule:
  - cron: '*/5 * * * *'
  - cron: 0 * * * *
  - cron: 0 3 * * *
  - cron: 0 4 * * *
  - cron: 15 * * * *
  - cron: 15 2 * * *
concurrency:
  group: ${{ format('candidate-{0}', (inputs.source == 'chat-history-hygiene-live' && ('chat-history-hygiene-live')) || (inputs.source
    == 'connector-health' && ('connector-health')) || (inputs.source == 'knowledge-sync' && ('knowledge-sync')) || (inputs.source
    == 'metrics-rollup' && ('metrics-rollup')) || (inputs.source == 'msp-enrichment-workflow-live' && ('msp-enrichment-workflow-live'))
    || (inputs.source == 'native-workers-offline' && (format('native-workers-{0}', github.ref))) || (inputs.source == 'platform-cs-backfill'
    && ('platform-cs-backfill')) || (inputs.source == 'probe-gmail-live-bugs-audit' && ('probe-gmail-live-bugs-audit')) ||
    (inputs.source == 'smoke-conversation-pollution-cleanup' && ('smoke-conversation-pollution-cleanup')) || (inputs.source
    == 'unified-turn-ops-gates' && ('unified-turn-ops-gates')) || (inputs.source == 'usage-sync' && ('usage-sync')) || (inputs.source
    == 'workflow-schedules' && ('workflow-schedules')) || github.run_id) }}
  cancel-in-progress: ${{ (inputs.source == 'chat-history-hygiene-live' && (false)) || (inputs.source == 'connector-health'
    && (false)) || (inputs.source == 'knowledge-sync' && (false)) || (inputs.source == 'metrics-rollup' && (false)) || (inputs.source
    == 'msp-enrichment-workflow-live' && (false)) || (inputs.source == 'native-workers-offline' && (true)) || (inputs.source
    == 'platform-cs-backfill' && (false)) || (inputs.source == 'probe-gmail-live-bugs-audit' && (false)) || (inputs.source
    == 'smoke-conversation-pollution-cleanup' && (false)) || (inputs.source == 'unified-turn-ops-gates' && (false)) || (inputs.source
    == 'usage-sync' && (false)) || (inputs.source == 'workflow-schedules' && (false)) || false }}
jobs:
  upstream_contract:
    name: Read trusted upstream outcome metadata
    if: ${{ github.event_name == 'workflow_run' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    outputs:
      evidence: ${{ steps.upstream.outputs.evidence }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - id: upstream
      run: python scripts/route-workflow-event.py --lane 10-operations --fetch-upstream
      env:
        GITHUB_TOKEN: ${{ github.token }}
  dispatch_contract:
    name: Validate selected source inputs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 4
    needs:
    - upstream_contract
    if: ${{ always() && (needs.upstream_contract.result == 'success' || needs.upstream_contract.result == 'skipped') }}
    outputs:
      selected: ${{ steps.contract.outputs.selected }}
      derived: ${{ steps.contract.outputs.derived }}
      context_conclusions: ${{ steps.contract.outputs.context_conclusions }}
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        fetch-depth: 0
    - id: contract
      name: Validate source contract
      shell: python
      env:
        SOURCE_SCHEMAS: '{"chat-history-hygiene-live": {}, "connector-health": {}, "knowledge-sync": {"reason": {"description":
          "Reason for manual trigger", "required": false}}, "metrics-rollup": {"days": {"description": "Days back to roll
          up", "required": false, "default": "1"}, "purge_days": {"description": "Purge audit_events older than N days (optional)",
          "required": false}}, "msp-enrichment-workflow-live": {"reason": {"description": "Reason for manual trigger", "required":
          false, "default": "post-merge verification"}}, "native-workers-offline": {}, "platform-cs-backfill": {"reason":
          {"description": "Reason for manual trigger", "required": false}}, "probe-gmail-live-bugs-audit": {"since_hours":
          {"description": "Lookback window for conversation hunt", "required": false, "default": "96"}}, "smoke-conversation-pollution-cleanup":
          {"apply": {"description": "Apply soft-deletes (unchecked = dry run only)", "type": "boolean", "default": true}},
          "unified-turn-ops-gates": {}, "usage-sync": {"reason": {"description": "Reason for manual trigger", "required":
          false}}, "workflow-schedules": {"reason": {"description": "Reason for manual trigger", "required": false}}}'
        MANUAL_SOURCES: '["chat-history-hygiene-live", "connector-health", "knowledge-sync", "metrics-rollup", "msp-enrichment-workflow-live",
          "native-workers-offline", "platform-cs-backfill", "probe-gmail-live-bugs-audit", "smoke-conversation-pollution-cleanup",
          "unified-turn-ops-gates", "usage-sync", "workflow-schedules"]'
        DISPATCH_VALUES: ${{ toJSON(inputs) }}
        EVENT_NAME: ${{ github.event_name }}
        CANONICAL_LANE: 10-operations
        UPSTREAM_EVIDENCE: ${{ needs.upstream_contract.outputs.evidence }}
      run: "import json, os\nschemas = json.loads(os.environ['SOURCE_SCHEMAS'])\nvalues = json.loads(os.environ['DISPATCH_VALUES'])\n\
        event_name = os.environ['EVENT_NAME']\ncalled = values.get('_reusable', False)\nif not called and event_name not in\
        \ ('workflow_dispatch', 'workflow_call'):\n    import subprocess\n    subprocess.run(['python', 'scripts/route-workflow-event.py',\
        \ '--lane', os.environ['CANONICAL_LANE']], check=True)\n    raise SystemExit(0)\nsource = values.get('source')\nif\
        \ source not in schemas:\n    raise SystemExit('Unknown source workflow')\nif not called and event_name == 'workflow_dispatch'\
        \ and source not in json.loads(os.environ['MANUAL_SOURCES']):\n    raise SystemExit('Source has no manual trigger')\n\
        if called and source != 'isolated-acceptance':\n    raise SystemExit('Unsupported reusable source')\nfor key, config\
        \ in schemas[source].items():\n    value = values.get(source.replace('-', '_') + '__' + key)\n    if called and key\
        \ == 'suite':\n        value = values.get('suite')\n    if config.get('required') and (value is None or value == ''):\n\
        \        raise SystemExit('Required selected-source input missing: ' + key)\nprint('Selected source input contract\
        \ validated; this is not execution acceptance')\nwith open(os.environ['GITHUB_OUTPUT'], 'a') as output:\n    output.write('selected='\
        \ + json.dumps([source]) + '\\n')\n    output.write('derived=[]\\ncontext_conclusions={}\\n')\n"
  chat_history_hygiene_live__verify:
    name: Live history hygiene + list latency
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: pip install httpx PyJWT python-dotenv supabase
    - name: Run live hygiene probe
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
        LIVE_API_BASE: https://api.gravitre.app
        HISTORY_LIST_BUDGET_MS: '2000'
      run: "set -euo pipefail\nif [ -z \"${SUPABASE_URL:-}\" ] || [ -z \"${SUPABASE_SERVICE_ROLE_KEY:-}\" ] || [ -z \"${SUPABASE_JWT_SECRET:-}\"\
        \ ]; then\n  echo \"Missing Supabase secrets\" >&2\n  exit 1\nfi\npython3 scripts/verify-chat-history-hygiene-live.py\n"
    - name: Upload report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: chat-history-hygiene-live
        path: docs/delivery/chat-history-hygiene-live.json
        if-no-files-found: ignore
    needs:
    - dispatch_contract
    if: ${{ always() && needs.dispatch_contract.result == 'success' && contains(fromJSON(needs.dispatch_contract.outputs.selected),
      'chat-history-hygiene-live') && ((!cancelled() && (true))) }}
    concurrency:
      group: ${{ format('candidate-{0}-{1}-{2}', 'chat-history-hygiene-live', 'chat_history_hygiene_live__verify', toJSON(matrix))
        }}
      cancel-in-progress: ${{ false }}
  connector_health__connector-health:
    name: Run connector health monitor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Trigger connector health
      env:
        INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
      run: "if [ -z \"$INTERNAL_API_SECRET\" ]; then\n  echo \"INTERNAL_API_SECRET secret is not set.\" >&2\n  exit 1\nfi\n\
        GRAVITRE_BACKEND=\"https://gravitre-saas-backend-production.up.railway.app\"\necho \"Triggering connector health at\
        \ $(date -u)\"\nRESPONSE=$(curl -sf \\\n  --max-time 90 \\\n  --retry 2 \\\n  --retry-delay 5 \\\n  -X POST \\\n \
        \ \"${GRAVITRE_BACKEND}/api/internal/ops/connector-health\" \\\n  -H \"X-Internal-Secret: ${INTERNAL_API_SECRET}\"\
        \ \\\n  -H \"Content-Type: application/json\" \\\n  -w \"\\nHTTP_STATUS:%{http_code}\")\nHTTP_STATUS=$(echo \"$RESPONSE\"\
        \ | grep \"HTTP_STATUS\" | cut -d: -f2)\nBODY=$(echo \"$RESPONSE\" | grep -v \"HTTP_STATUS\")\necho \"Response: $BODY\"\
        \necho \"HTTP Status: $HTTP_STATUS\"\nif [ \"$HTTP_STATUS\" != \"200\" ]; then\n  exit 1\nfi\n"
    needs:
    - dispatch_contract
    if: ${{ always() && needs.dispatch_contract.result == 'success' && contains(fromJSON(needs.dispatch_contract.outputs.selected),
      'connector-health') && ((!cancelled() && (true))) }}
    concurrency:
      group: ${{ format('candidate-{0}-{1}-{2}', 'connector-health', 'connector_health__connector-health', toJSON(matrix))
        }}
      cancel-in-progress: ${{ false }}
  knowledge_sync__sync-due:
    name: Run due knowledge syncs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Trigger knowledge sync
      env:
        INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
      run: "if [ -z \"$INTERNAL_API_SECRET\" ]; then\n  echo \"INTERNAL_API_SECRET secret is not set; add it in repo Settings\
        \ \u2192 Secrets and variables \u2192 Actions.\" >&2\n  exit 1\nfi\nGRAVITRE_BACKEND=\"https://gravitre-saas-backend-production.up.railway.app\"\
        \necho \"Triggering knowledge sync at $(date -u)\"\nRESPONSE=$(curl -sf \\\n  --max-time 120 \\\n  --retry 2 \\\n\
        \  --retry-delay 5 \\\n  -X POST \\\n  \"${GRAVITRE_BACKEND}/api/internal/knowledge/sync-due\" \\\n  -H \"X-Internal-Secret:\
        \ ${INTERNAL_API_SECRET}\" \\\n  -H \"Content-Type: application/json\" \\\n  -w \"\\nHTTP_STATUS:%{http_code}\")\n\
        HTTP_STATUS=$(echo \"$RESPONSE\" | grep \"HTTP_STATUS\" | cut -d: -f2)\nBODY=$(echo \"$RESPONSE\" | grep -v \"HTTP_STATUS\"\
        )\necho \"Response: $BODY\"\necho \"HTTP Status: $HTTP_STATUS\"\nif [ \"$HTTP_STATUS\" != \"200\" ]; then\n  echo\
        \ \"Knowledge sync failed with status $HTTP_STATUS\"\n  exit 1\nfi\necho \"Knowledge sync completed successfully\"\
        \n"
    needs:
    - dispatch_contract
    if: ${{ always() && needs.dispatch_contract.result == 'success' && contains(fromJSON(needs.dispatch_contract.outputs.selected),
      'knowledge-sync') && ((!cancelled() && (true))) }}
    concurrency:
      group: ${{ format('candidate-{0}-{1}-{2}', 'knowledge-sync', 'knowledge_sync__sync-due', toJSON(matrix)) }}
      cancel-in-progress: ${{ false }}
  metrics_rollup__rollup-daily:
    name: Run daily metrics rollups
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Trigger rollup
      env:
        INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
        ROLLUP_DAYS: ${{ github.event.inputs.metrics_rollup__days || '1' }}
        PURGE_DAYS: ${{ github.event.inputs.metrics_rollup__purge_days || '' }}
      run: "if [ -z \"$INTERNAL_API_SECRET\" ]; then\n  echo \"INTERNAL_API_SECRET secret is not set.\" >&2\n  exit 1\nfi\n\
        GRAVITRE_BACKEND=\"https://gravitre-saas-backend-production.up.railway.app\"\nBODY=\"{\\\"days\\\": ${ROLLUP_DAYS}}\"\
        \nif [ -n \"$PURGE_DAYS\" ]; then\n  BODY=\"{\\\"days\\\": ${ROLLUP_DAYS}, \\\"purge_days\\\": ${PURGE_DAYS}}\"\n\
        fi\necho \"Triggering rollup at $(date -u)\"\nRESPONSE=$(curl -sf \\\n  --max-time 120 \\\n  --retry 2 \\\n  --retry-delay\
        \ 10 \\\n  -X POST \\\n  \"${GRAVITRE_BACKEND}/api/internal/ops/rollup-daily\" \\\n  -H \"X-Internal-Secret: ${INTERNAL_API_SECRET}\"\
        \ \\\n  -H \"Content-Type: application/json\" \\\n  -d \"$BODY\" \\\n  -w \"\\nHTTP_STATUS:%{http_code}\")\nHTTP_STATUS=$(echo\
        \ \"$RESPONSE\" | grep \"HTTP_STATUS\" | cut -d: -f2)\nBODY_OUT=$(echo \"$RESPONSE\" | grep -v \"HTTP_STATUS\")\n\
        echo \"Response: $BODY_OUT\"\necho \"HTTP Status: $HTTP_STATUS\"\nif [ \"$HTTP_STATUS\" != \"200\" ]; then\n  exit\
        \ 1\nfi\n"
    needs:
    - dispatch_contract
    if: ${{ always() && needs.dispatch_contract.result == 'success' && contains(fromJSON(needs.dispatch_contract.outputs.selected),
      'metrics-rollup') && ((!cancelled() && (true))) }}
    concurrency:
      group: ${{ format('candidate-{0}-{1}-{2}', 'metrics-rollup', 'metrics_rollup__rollup-daily', toJSON(matrix)) }}
      cancel-in-progress: ${{ false }}
  msp_enrichment_workflow_live__msp-enrichment-live:
    name: MSP enrichment workflow live smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: backend/requirements.txt
    - name: Install dependencies
      working-directory: backend
      run: 'python -m pip install --upgrade pip

        pip install -r requirements-dev.txt

        '
    - name: Run MSP enrichment workflow live smoke
      env:
        BACKEND_URL: https://gravitre-saas-backend-production.up.railway.app
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
        CONNECTOR_SECRETS_ENCRYPTION_KEY: ${{ secrets.CONNECTOR_SECRETS_ENCRYPTION_KEY }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
      run: "if [ -z \"$SUPABASE_URL\" ] || [ -z \"$SUPABASE_SERVICE_ROLE_KEY\" ] || [ -z \"$SUPABASE_ANON_KEY\" ]; then\n\
        \  echo \"Missing SUPABASE_URL, SUPABASE_ANON_KEY, or SUPABASE_SERVICE_ROLE_KEY in repo Actions secrets.\" >&2\n \
        \ exit 1\nfi\nset +e\npython scripts/smoke-msp-enrichment-workflow-live.py\nCODE=$?\nset -e\necho \"smoke_exit=$CODE\"\
        \n# 0 = PASS, 2 = PARTIAL (seeded but Clay missing) \u2014 both upload artifact\nif [ \"$CODE\" -ne 0 ] && [ \"$CODE\"\
        \ -ne 2 ]; then\n  exit \"$CODE\"\nfi\nexit 0\n"
    - name: Upload smoke report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: msp-enrichment-workflow-live
        path: docs/delivery/msp-enrichment-workflow-live.json
        if-no-files-found: ignore
    needs:
    - dispatch_contract
    if: ${{ always() && needs.dispatch_contract.result == 'success' && contains(fromJSON(needs.dispatch_contract.outputs.selected),
      'msp-enrichment-workflow-live') && ((!cancelled() && (true))) }}
    concurrency:
      group: ${{ format('candidate-{0}-{1}-{2}', 'msp-enrichment-workflow-live', 'msp_enrichment_workflow_live__msp-enrichment-live',
        toJSON(matrix)) }}
      cancel-in-progress: ${{ false }}
  native_workers_offline__pinned-sdk-imports:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        engine:
        - openhands
        - browser
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
    - name: Build isolated pinned SDK image
      run: docker build -f backend/native-workers/Dockerfile.${{ matrix.engine }} -t native-sdk:${{ matrix.engine }} backend
    - name: Verify real SDK call surfaces without network or credentials
      env:
        ENGINE: ${{ matrix.engine }}
      run: 'if [ "$ENGINE" = browser ]; then contract=browser_use; else contract=openhands; fi

        docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --pids-limit 128 --memory
        2g --tmpfs /tmp:rw,noexec,nosuid,size=128m --tmpfs /workspace:rw,nosuid,size=128m,uid=10001,gid=10001 -e HOME=/workspace
        -e OTEL_SDK_DISABLED=true -e ANONYMIZED_TELEMETRY=false -e DO_NOT_TRACK=1 native-sdk:$ENGINE python /runner/sdk_contract.py
        "$contract"

        '
    - name: Export the verified SDK image for execution certification
      env:
        ENGINE: ${{ matrix.engine }}
      run: 'set -euo pipefail

        docker image inspect native-sdk:$ENGINE --format ''{{.Id}}'' > "$RUNNER_TEMP/$ENGINE-image.id"

        docker save native-sdk:$ENGINE | zstd -T0 -1 -o "$RUNNER_TEMP/$ENGINE-image.tar.zst"

        '
    - uses: actions/upload-artifact@v4
      with:
        name: native-sdk-image-${{ matrix.engine }}
        path: '${{ runner.temp }}/${{ matrix.engine }}-image.tar.zst

          ${{ runner.temp }}/${{ matrix.engine }}-image.id

          '
        compression-level: 0
        retention-days: 1
        if-no-files-found: error
    name: pinned-sdk-imports
    needs:
    - dispatch_contract
    if: ${{ always() && needs.dispatch_contract.result == 'success' && contains(fromJSON(needs.dispatch_contract.outputs.selected),
      'native-workers-offline') && ((!cancelled() && (true))) }}
    permissions:
      contents: read
    concurrency:
      group: ${{ format('candidate-{0}-{1}-{2}', format('native-workers-{0}', github.ref), 'native_workers_offline__pinned-sdk-imports',
        toJSON(matrix)) }}
      cancel-in-progress: ${{ true }}
  native_workers_offline__playwright-comparison-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
    - name: Build isolated comparison image (not production)
      run: docker build -f backend/native-workers/Dockerfile.playwright-comparison -t native-playwright-comparison backend
    - name: Verify pinned candidate dependencies and fail-closed imports
      run: 'docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --pids-limit 128 --memory
        2g --tmpfs /tmp:rw,noexec,nosuid,size=128m --tmpfs /workspace:rw,nosuid,size=128m,uid=10001,gid=10001 native-playwright-comparison
        env PYTHONPATH=/runner python -c "import playwright.async_api, playwright_candidate; from playwright_candidate import
        validate_url; assert validate_url(''https://www.selenium.dev/selenium/web/web-form.html'', [''www.selenium.dev''])"

        '
    name: playwright-comparison-image
    needs:
    - dispatch_contract
    if: ${{ always() && needs.dispatch_contract.result == 'success' && contains(fromJSON(needs.dispatch_contract.outputs.selected),
      'native-workers-offline') && ((!cancelled() && (true))) }}
    permissions:
      contents: read
    concurrency:
      group: ${{ format('candidate-{0}-{1}-{2}', format('native-workers-{0}', github.ref), 'native_workers_offline__playwright-comparison-image',
        toJSON(matrix)) }}
      cancel-in-progress: ${{ true }}
  native_workers_offline__gateway-image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
    - run: docker build -f backend/native-workers/Dockerfile.gateway -t native-gateway backend
    name: gateway-image
    needs:
    - dispatch_contract
    if: ${{ always() && needs.dispatch_contract.result == 'success' && contains(fromJSON(needs.dispatch_contract.outputs.selected),
      'native-workers-offline') && ((!cancelled() && (true))) }}
    permissions:
      contents: read
    concurrency:
      group: ${{ format('candidate-{0}-{1}-{2}', format('native-workers-{0}', github.ref), 'native_workers_offline__gateway-image',
        toJSON(matrix)) }}
      cancel-in-progress: ${{ true }}
  native_workers_offline__runtime-certification:
    needs:
    - dispatch_contract
    - native_workers_offline__pinned-sdk-imports
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install pinned verified gVisor runtime
      run: 'curl --fail --location --silent --show-error https://github.com/google/gvisor/releases/download/release-20261026.0/gvisor-x86_64.tar.zstd
        -o /tmp/gvisor.tar.zstd

        echo ''708afc62f2ee82d19930c703e85f9dab4f27a78c0aec40c0f55eb1040107f1a7  /tmp/gvisor.tar.zstd'' | sha256sum --check

        sudo tar --zstd -xf /tmp/gvisor.tar.zstd -C /usr/local/bin

        sudo /usr/local/bin/runsc install

        sudo systemctl reload docker

        runsc --version

        '
    - uses: actions/download-artifact@v4
      with:
        pattern: native-sdk-image-*
        merge-multiple: true
        path: ${{ runner.temp }}/native-images
    - name: Load exactly the images that passed SDK contracts
      timeout-minutes: 5
      run: "set -euo pipefail\nfor engine in openhands browser; do\n  zstd --decompress --stdout \"$RUNNER_TEMP/native-images/$engine-image.tar.zst\"\
