        missing=[name for name in names if not os.environ.get(name)]\nallowed='https://aadnwmjzrmbvadszroqt.supabase.co'\n\
        invalid_headers=[name for name in ('E2E_SUPABASE_ANON_KEY','E2E_SUPABASE_SERVICE_ROLE_KEY') if not os.environ.get(name,'').strip()\
        \ or any(ord(c)<33 or ord(c)>126 for c in os.environ.get(name,'').strip())]\nvalid=not missing and not invalid_headers\
