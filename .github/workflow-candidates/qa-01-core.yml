        FASTAPI_BASE_URL: http://127.0.0.1:8000
        PLAYWRIGHT_BASE_URL: http://localhost:3000
        NEXT_PUBLIC_PLAYWRIGHT_E2E: '1'
    concurrency:
      group: ${{ format('candidate-{0}-{1}-{2}', format('ci-{0}', github.event_name == 'pull_request' && format('pr-{0}',
        github.event.pull_request.number) || github.ref), 'ci__billing-e2e', toJSON(matrix)) }}
