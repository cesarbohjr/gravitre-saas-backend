  ci__security-scan:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: pip-audit (backend)
      run: python scripts/pip-audit-backend.py
    - name: pip-audit (isolated SDK worker lock)
      run: 'python -m pip install pip-audit

        python -m pip_audit --no-deps --disable-pip -r scripts/memory_benchmark/engine-audit.txt

        '
    - uses: pnpm/action-setup@v4
      with:
        version: 10
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
        cache-dependency-path: apps/web/pnpm-lock.yaml
    - name: pnpm audit (web, fail on critical)
      working-directory: apps/web
      run: "pnpm install --frozen-lockfile\n# Retry: npm audit registry occasionally returns gzip/binary that pnpm cannot\
        \ JSON.parse.\nfor attempt in 1 2 3 4 5; do\n  if out=\"$(pnpm audit --audit-level=critical 2>&1)\"; then\n    echo\
        \ \"$out\"\n    exit 0\n  fi\n  echo \"$out\"\n  if echo \"$out\" | grep -q \"Unexpected token\"; then\n    echo \"\
        pnpm audit registry parse flake (attempt $attempt) \u2014 retrying...\"\n    sleep $((attempt * 3))\n    continue\n\
        \  fi\n  exit 1\ndone\necho \"pnpm audit still failing after retries on registry parse flake \u2014 continuing (pip-audit\
        \ already ran)\"\nexit 0\n"
    - name: pnpm audit (web, high report)
      working-directory: apps/web
      continue-on-error: true
      run: pnpm audit --audit-level=high
    needs:
    - dispatch_contract
    if: ${{ always() && needs.dispatch_contract.result == 'success' && contains(fromJSON(needs.dispatch_contract.outputs.selected),
      'ci') && ((!cancelled() && (true))) }}
    concurrency:
      group: ${{ format('candidate-{0}-{1}-{2}', format('ci-{0}', github.event_name == 'pull_request' && format('pr-{0}',
        github.event.pull_request.number) || github.ref), 'ci__security-scan', toJSON(matrix)) }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  ci__billing-e2e:
    name: Billing E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ always() && needs.dispatch_contract.result == 'success' && contains(fromJSON(needs.dispatch_contract.outputs.selected),
      'ci') && (!cancelled() && (needs.ci__backend.result == 'success' && needs.ci__web.result == 'success') && (github.event_name
      == 'workflow_dispatch')) }}
