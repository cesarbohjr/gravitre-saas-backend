    - name: Typed greeting and spoken plan-hold both complete
      run: 'python -m pytest -q tests/operators/test_agent_intelligence.py::test_shared_kernel_typed_and_spoken_plan_hold_both_complete
        tests/operators/test_agent_intelligence.py::test_execute_task_streaming_does_not_rebind_module_imports tests/operators/test_agent_intelligence.py::test_shared_runtime_typed_normal_turn_emits_composer_and_complete
        tests/operators/test_agent_intelligence.py::test_shared_runtime_typed_read_clarify_emits_composer tests/operators/test_agent_intelligence.py::test_shared_runtime_shortcut_complete_carries_task_state
        tests/operators/test_agent_intelligence.py::test_shared_runtime_write_approval_does_not_invoke_provider tests/services/test_voice_session_service.py::test_operator_turn_speaks_perceive_before_kernel
        tests/services/test_voice_session_service.py::test_voice_cancel_near_approval_emits_cancelled tests/services/test_platform_execution_2_0_a_invariants.py::test_execute_task_streaming_does_not_shadow_asyncio_or_composer
        tests/services/test_platform_execution_2_0_a_invariants.py::test_execute_task_streaming_has_no_branch_local_asyncio_import

        '
      env:
        APP_ENV: dev
        SUPABASE_URL: https://test.supabase.co
        SUPABASE_ANON_KEY: anon-test
        SUPABASE_SERVICE_ROLE_KEY: service-role-test
        SUPABASE_JWT_SECRET: jwt-secret-test
        OPENAI_API_KEY: sk-test-openai
    needs:
    - dispatch_contract
    if: ${{ always() && needs.dispatch_contract.result == 'success' && contains(fromJSON(needs.dispatch_contract.outputs.selected),
      'ci') && ((!cancelled() && (true))) }}
    concurrency:
      group: ${{ format('candidate-{0}-{1}-{2}', format('ci-{0}', github.event_name == 'pull_request' && format('pr-{0}',
        github.event.pull_request.number) || github.ref), 'ci__shared-runtime-gate', toJSON(matrix)) }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  ci__backend:
