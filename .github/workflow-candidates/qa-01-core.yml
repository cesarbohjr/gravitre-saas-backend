# STAGED: not installed in .github/workflows; automatic trigger cutover pending.
name: QA 01-core
'on':
  workflow_dispatch:
    inputs:
      source:
        description: Original workflow contract to execute
        required: true
        type: choice
        options:
        - ci
        default: ci
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
    types:
    - opened
    - reopened
    - synchronize
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  upstream_contract:
    name: Read trusted upstream outcome metadata
    if: ${{ github.event_name == 'workflow_run' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    outputs:
      evidence: ${{ steps.upstream.outputs.evidence }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - id: upstream
      run: python scripts/route-workflow-event.py --lane 01-core --fetch-upstream
      env:
        GITHUB_TOKEN: ${{ github.token }}
  dispatch_contract:
    name: Validate selected source inputs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 4
    needs:
    - upstream_contract
    if: ${{ always() && (needs.upstream_contract.result == 'success' || needs.upstream_contract.result == 'skipped') }}
    outputs:
      selected: ${{ steps.contract.outputs.selected }}
      derived: ${{ steps.contract.outputs.derived }}
      context_conclusions: ${{ steps.contract.outputs.context_conclusions }}
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        fetch-depth: 0
    - id: contract
      name: Validate source contract
      shell: python
      env:
        SOURCE_SCHEMAS: '{"ci": {}, "repair-root-npm-lock": {}}'
        MANUAL_SOURCES: '["ci"]'
        DISPATCH_VALUES: ${{ toJSON(inputs) }}
        EVENT_NAME: ${{ github.event_name }}
        CANONICAL_LANE: 01-core
        UPSTREAM_EVIDENCE: ${{ needs.upstream_contract.outputs.evidence }}
      run: "import json, os\nschemas = json.loads(os.environ['SOURCE_SCHEMAS'])\nvalues = json.loads(os.environ['DISPATCH_VALUES'])\n\
        event_name = os.environ['EVENT_NAME']\ncalled = values.get('_reusable', False)\nif not called and event_name not in\
        \ ('workflow_dispatch', 'workflow_call'):\n    import subprocess\n    subprocess.run(['python', 'scripts/route-workflow-event.py',\
        \ '--lane', os.environ['CANONICAL_LANE']], check=True)\n    raise SystemExit(0)\nsource = values.get('source')\nif\
        \ source not in schemas:\n    raise SystemExit('Unknown source workflow')\nif not called and event_name == 'workflow_dispatch'\
        \ and source not in json.loads(os.environ['MANUAL_SOURCES']):\n    raise SystemExit('Source has no manual trigger')\n\
        if called and source != 'isolated-acceptance':\n    raise SystemExit('Unsupported reusable source')\nfor key, config\
        \ in schemas[source].items():\n    value = values.get(source.replace('-', '_') + '__' + key)\n    if called and key\
        \ == 'suite':\n        value = values.get('suite')\n    if config.get('required') and (value is None or value == ''):\n\
        \        raise SystemExit('Required selected-source input missing: ' + key)\nprint('Selected source input contract\
        \ validated; this is not execution acceptance')\nwith open(os.environ['GITHUB_OUTPUT'], 'a') as output:\n    output.write('selected='\
        \ + json.dumps([source]) + '\\n')\n    output.write('derived=[]\\ncontext_conclusions={}\\n')\n"
  ci__web:
    name: Web (lint + typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4
      with:
        version: 10
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
        cache-dependency-path: apps/web/pnpm-lock.yaml
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Vercel frontend build selection
      run: node --test scripts/vercel-ignore-build.test.mjs
    - name: Run unit tests
      run: pnpm test
    - name: Chat surface drift guard
      working-directory: .
      run: node scripts/check-chat-surface-drift.mjs
    - name: User-facing status leak guard
      working-directory: .
      run: node scripts/check-user-facing-status-leak.mjs
    - name: Intelligence customer surface guard
      working-directory: .
      run: node scripts/check-intelligence-customer-surface.mjs
    - name: Cognitive regression suite
      working-directory: .
      run: node scripts/cognitive-regression-suite.mjs
    - name: Gravitre brand rename guard
      working-directory: .
      run: node scripts/check-gravitre-brand.mjs
    - name: Lint
      run: pnpm lint
    - name: Typecheck
      run: pnpm typecheck
    - name: Build
      run: pnpm build
      env:
        NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
        NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
        FASTAPI_BASE_URL: http://127.0.0.1:8000
    needs:
    - dispatch_contract
    if: ${{ always() && needs.dispatch_contract.result == 'success' && contains(fromJSON(needs.dispatch_contract.outputs.selected),
      'ci') && ((!cancelled() && (true))) }}
    concurrency:
      group: ${{ format('candidate-{0}-{1}-{2}', format('ci-{0}', github.event_name == 'pull_request' && format('pr-{0}',
        github.event.pull_request.number) || github.ref), 'ci__web', toJSON(matrix)) }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  ci__integration-smoke-test:
    name: Integration Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: backend/requirements.txt
    - name: Reclaim unused hosted-runner SDKs before Python dependencies
      run: "set -euo pipefail\necho \"Disk before cleanup:\"\ndf -h / /tmp\nfor dir in /usr/local/lib/android /usr/share/dotnet\
        \ /opt/ghc /usr/local/share/powershell; do\n  if [ -d \"$dir\" ]; then\n    echo \"Removing unused SDK: $dir\"\n \
        \   sudo rm -rf -- \"$dir\"\n  fi\ndone\npython -m pip cache purge || true\nsudo apt-get clean\necho \"Disk after\
        \ cleanup:\"\ndf -h / /tmp\nfree_kib=$(df -Pk / | awk 'NR==2 {print $4}')\nif [ \"$free_kib\" -lt 10485760 ]; then\n\
        \  echo \"::error::Backend CI needs at least 10 GiB disk free before heavy dependency install (KiB=$free_kib)\"\n\
        \  exit 1\nfi\n"
    - name: Install backend dependencies
      working-directory: backend
      run: 'python -m pip install --upgrade pip

        python -m pip install --no-cache-dir --no-compile -r requirements-dev.txt

        '
    - name: Start backend and run integration smoke test
      working-directory: backend
      env:
        APP_ENV: dev
        SUPABASE_URL: https://test.supabase.co
        SUPABASE_ANON_KEY: anon-test
        SUPABASE_SERVICE_ROLE_KEY: service-role-test
        SUPABASE_JWT_SECRET: jwt-secret-test
        OPENAI_API_KEY: sk-test-openai
      run: "# Logged to a file, not inherited stdout: the failure branch needs the\n# startup trace, and reading it must not\
        \ depend on waiting for exit.\npython -m uvicorn app.main:app --host 127.0.0.1 --port 8765 >/tmp/backend.log 2>&1\
        \ &\nSERVER_PID=$!\ntrap 'kill $SERVER_PID 2>/dev/null || true' EXIT\n# CI telemetry from run 41787238076 showed repeated\
        \ /health 200\n# responses taking ~9 seconds. A 5-second client cutoff incorrectly\n# treated healthy responses as\
        \ unready. Allow up to 20 seconds per\n# request while bounding total startup readiness to 180 seconds.\nstart=$SECONDS\n\
        ready=0\nwhile (( SECONDS - start < 180 )); do\n  if curl -fsS --max-time 20 \"http://127.0.0.1:8765/health\" >/dev/null;\
        \ then\n    ready=1\n    break\n  fi\n  # Do not wait out the deadline if uvicorn exited.\n  if ! kill -0 \"$SERVER_PID\"\
        \ 2>/dev/null; then\n    echo \"Backend process exited during startup after $((SECONDS-start))s\"\n    tail -n 200\
        \ /tmp/backend.log\n    exit 1\n  fi\n  sleep 2\ndone\nif [ \"$ready\" -ne 1 ]; then\n  echo \"Backend failed to become\
        \ ready on port 8765 within 180s (20s request timeout)\"\n  # Never `wait` here. The server is still running by definition\
        \ of\n  # reaching this branch, so waiting for it blocked forever and turned\n  # a legible failure into an unbounded\
        \ hang.\n  cat /tmp/backend.log\n  exit 1\nfi\nexport BACKEND_URL=\"http://127.0.0.1:8765\"\nchmod +x ../scripts/test-integration.sh\n\
        bash ../scripts/test-integration.sh\n"
    - name: Annotate on failure
      if: failure()
      run: 'echo "::error::Integration smoke test failed against the CI-local backend."

        echo "::error::Check scripts/test-integration.sh and app startup on port 8765."

        '
    needs:
    - dispatch_contract
    if: ${{ always() && needs.dispatch_contract.result == 'success' && contains(fromJSON(needs.dispatch_contract.outputs.selected),
      'ci') && ((!cancelled() && (true))) }}
    concurrency:
      group: ${{ format('candidate-{0}-{1}-{2}', format('ci-{0}', github.event_name == 'pull_request' && format('pr-{0}',
        github.event.pull_request.number) || github.ref), 'ci__integration-smoke-test', toJSON(matrix)) }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  ci__shared-runtime-gate:
    name: Shared runtime text/voice gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
