      with:
        version: 10
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: backend/requirements.txt
    - name: Reclaim unused hosted-runner SDKs before Python dependencies
      run: "set -euo pipefail\necho \"Disk before cleanup:\"\ndf -h / /tmp\nfor dir in /usr/local/lib/android /usr/share/dotnet\
        \ /opt/ghc /usr/local/share/powershell; do\n  if [ -d \"$dir\" ]; then\n    echo \"Removing unused SDK: $dir\"\n \
        \   sudo rm -rf -- \"$dir\"\n  fi\ndone\npython -m pip cache purge || true\nsudo apt-get clean\necho \"Disk after\
        \ cleanup:\"\ndf -h / /tmp\nfree_kib=$(df -Pk / | awk 'NR==2 {print $4}')\nif [ \"$free_kib\" -lt 10485760 ]; then\n\
        \  echo \"::error::Backend CI needs at least 10 GiB disk free before heavy dependency install (KiB=$free_kib)\"\n\
        \  exit 1\nfi\n"
    - name: Install root + web + backend dependencies
      run: 'npm install

        cd apps/web && pnpm install --frozen-lockfile

        cd ../../backend

        python -m pip install --upgrade pip

        python -m pip install --no-cache-dir --no-compile -r requirements-dev.txt

        '
    - name: Install Playwright Chromium
