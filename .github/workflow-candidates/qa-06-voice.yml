# STAGED: not installed in .github/workflows; automatic trigger cutover pending.
name: QA 06-voice
'on':
  workflow_dispatch:
    inputs:
      source:
        description: Original workflow contract to execute
        required: true
        type: choice
        options:
        - master-qa-qa30-acoustic-qualification
        - master-qa-qa30-offline-cancellation
        - master-qa-qa30-voice-confirmed-turns
        - run-acceptance-voice
        - voice-duplex-guard
        - voice-gates-2-3
        - voice-livekit-candidate
        - voice-slo-gates
        - voice-stt-control-latency
        - release1-chat-voice-revocation-e2e
        default: master-qa-qa30-acoustic-qualification
      voice_gates_2_3__run_paid_voice_acceptance:
        description: 'voice-gates-2-3: Explicitly authorize paid voice-provider acceptance (never enabled on PR pushes)'
        type: boolean
        required: false
        default: false
      voice_stt_control_latency__run_paid_provider_tests:
        description: 'voice-stt-control-latency: Explicit authorization for billable provider calls (default OFF)'
        required: false
        type: boolean
        default: false
  push:
    branches:
    - main
  pull_request:
    types:
    - opened
    - reopened
    - synchronize
  schedule:
  - cron: 0 7 * * *
  - cron: 15 6 * * *
concurrency:
  group: ${{ format('candidate-{0}', (inputs.source == 'voice-duplex-guard' && ('voice-duplex-guard')) || (inputs.source ==
    'voice-slo-gates' && ('voice-slo-gates')) || github.run_id) }}
  cancel-in-progress: ${{ (inputs.source == 'voice-duplex-guard' && (false)) || (inputs.source == 'voice-slo-gates' && (false))
    || false }}
jobs:
  upstream_contract:
    name: Read trusted upstream outcome metadata
    if: ${{ github.event_name == 'workflow_run' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    outputs:
      evidence: ${{ steps.upstream.outputs.evidence }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - id: upstream
      run: python scripts/route-workflow-event.py --lane 06-voice --fetch-upstream
      env:
        GITHUB_TOKEN: ${{ github.token }}
  dispatch_contract:
    name: Validate selected source inputs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 4
    needs:
    - upstream_contract
    if: ${{ always() && (needs.upstream_contract.result == 'success' || needs.upstream_contract.result == 'skipped') }}
    outputs:
      selected: ${{ steps.contract.outputs.selected }}
      derived: ${{ steps.contract.outputs.derived }}
      context_conclusions: ${{ steps.contract.outputs.context_conclusions }}
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        fetch-depth: 0
    - id: contract
      name: Validate source contract
      shell: python
      env:
        SOURCE_SCHEMAS: '{"master-qa-qa30-acoustic-qualification": {}, "master-qa-qa30-offline-cancellation": {}, "master-qa-qa30-voice-confirmed-turns":
          {}, "run-acceptance-voice": {}, "voice-duplex-guard": {}, "voice-gates-2-3": {"run_paid_voice_acceptance": {"description":
          "Explicitly authorize paid voice-provider acceptance (never enabled on PR pushes)", "type": "boolean", "required":
          true, "default": false}}, "voice-livekit-candidate": {}, "voice-slo-gates": {}, "voice-stt-control-latency": {"run_paid_provider_tests":
          {"description": "Explicit authorization for billable provider calls (default OFF)", "required": true, "type": "boolean",
          "default": false}}, "release1-chat-voice-revocation-e2e": {}}'
        MANUAL_SOURCES: '["master-qa-qa30-acoustic-qualification", "master-qa-qa30-offline-cancellation", "master-qa-qa30-voice-confirmed-turns",
          "run-acceptance-voice", "voice-duplex-guard", "voice-gates-2-3", "voice-livekit-candidate", "voice-slo-gates", "voice-stt-control-latency",
          "release1-chat-voice-revocation-e2e"]'
        DISPATCH_VALUES: ${{ toJSON(inputs) }}
        EVENT_NAME: ${{ github.event_name }}
        CANONICAL_LANE: 06-voice
        UPSTREAM_EVIDENCE: ${{ needs.upstream_contract.outputs.evidence }}
      run: "import json, os\nschemas = json.loads(os.environ['SOURCE_SCHEMAS'])\nvalues = json.loads(os.environ['DISPATCH_VALUES'])\n\
        event_name = os.environ['EVENT_NAME']\ncalled = values.get('_reusable', False)\nif not called and event_name not in\
        \ ('workflow_dispatch', 'workflow_call'):\n    import subprocess\n    subprocess.run(['python', 'scripts/route-workflow-event.py',\
        \ '--lane', os.environ['CANONICAL_LANE']], check=True)\n    raise SystemExit(0)\nsource = values.get('source')\nif\
        \ source not in schemas:\n    raise SystemExit('Unknown source workflow')\nif not called and event_name == 'workflow_dispatch'\
        \ and source not in json.loads(os.environ['MANUAL_SOURCES']):\n    raise SystemExit('Source has no manual trigger')\n\
        if called and source != 'isolated-acceptance':\n    raise SystemExit('Unsupported reusable source')\nfor key, config\
        \ in schemas[source].items():\n    value = values.get(source.replace('-', '_') + '__' + key)\n    if called and key\
        \ == 'suite':\n        value = values.get('suite')\n    if config.get('required') and (value is None or value == ''):\n\
        \        raise SystemExit('Required selected-source input missing: ' + key)\nprint('Selected source input contract\
        \ validated; this is not execution acceptance')\nwith open(os.environ['GITHUB_OUTPUT'], 'a') as output:\n    output.write('selected='\
        \ + json.dumps([source]) + '\\n')\n    output.write('derived=[]\\ncontext_conclusions={}\\n')\n"
  master_qa_qa30_acoustic_qualification__kws-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Verify fail-closed KWS configuration and score rules
      run: python -m unittest discover -s tests -p test_pr587_kws_qualification.py
    - name: Verify custom model and complete audio corpus are available
      run: python scripts/pr587_kws_qualification.py --preflight --output acceptance-results/pr587-kws-qualification.json
    - name: Install local acoustic engine (only with supplied trained assets)
      if: ${{ hashFiles('acceptance-assets/pr587-kws-manifest.json') != '' }}
      run: python -m pip install --no-cache-dir 'openwakeword==0.6.0' 'onnxruntime' 'numpy'
    - name: Run actual repeated custom-model acoustic inference
      if: ${{ hashFiles('acceptance-assets/pr587-kws-manifest.json') != '' }}
      run: python scripts/pr587_openwakeword_replay.py --manifest acceptance-assets/pr587-kws-manifest.json
    - name: Publish actual acoustic replay output
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pr587-custom-acoustic-results
        path: acceptance-results/pr587-kws-acoustic-results.json
        if-no-files-found: ignore
    - name: Publish blocked or qualified evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pr587-kws-qualification
        path: acceptance-results/pr587-kws-qualification.json
        if-no-files-found: error
    name: kws-qualification
    needs:
    - dispatch_contract
    if: ${{ always() && needs.dispatch_contract.result == 'success' && contains(fromJSON(needs.dispatch_contract.outputs.selected),
      'master-qa-qa30-acoustic-qualification') && ((!cancelled() && (true))) }}
    permissions:
      contents: read
      actions: read
  master_qa_qa30_offline_cancellation__inspect-without-paid-providers:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Evaluate real-audio evidence without network or provider credentials
      run: python scripts/pr587_offline_cancel_gate.py | tee pr587-offline-decision.json
    - uses: actions/upload-artifact@v4
      with:
        name: pr587-offline-decision
        path: pr587-offline-decision.json
    name: inspect-without-paid-providers
    needs:
    - dispatch_contract
    if: ${{ always() && needs.dispatch_contract.result == 'success' && contains(fromJSON(needs.dispatch_contract.outputs.selected),
      'master-qa-qa30-offline-cancellation') && ((!cancelled() && (true))) }}
    permissions:
      contents: read
  master_qa_qa30_voice_confirmed_turns__replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: backend/requirements.txt
    - name: Install backend test dependencies
      run: 'python -m pip install --upgrade pip

        pip install -r requirements.txt

        pip install pytest pytest-asyncio

        '
    - name: Confirmation and turn-taking regression
      run: python -m pytest -q -p tests.offline_network_guard tests/services/pipecat_voice/test_confirmation_hold.py tests/services/pipecat_voice/test_interruption_correctness.py
        tests/services/pipecat_voice/test_reconnect_and_approval_contract.py tests/services/pipecat_voice/test_phase3_provider_commit_gate.py
      env:
        OPENAI_API_KEY: fake-issue-535
        ANTHROPIC_API_KEY: fake-issue-535
        GEMINI_API_KEY: fake-issue-535
    - name: Reproduce approval race on 20 seeded runs
      run: python scripts/bench_voice_scenarios.py --runs 20 --seed 1000 --profile production_inferred --scenarios S8 --out
        "${{ runner.temp }}/voice-approval-replay"
      env:
        OPENAI_API_KEY: fake-issue-535
        ANTHROPIC_API_KEY: fake-issue-535
        GEMINI_API_KEY: fake-issue-535
    - name: Require zero premature writes
      run: 'python - <<''PY''

        import json,os

        from pathlib import Path

        p=Path(os.environ[''RUNNER_TEMP''])/''voice-approval-replay/results.json''

        r=json.loads(p.read_text())[''scenarios''][''S8'']

        acc=r[''aggregate''][''accuracy'']

        assert acc[''n'']==20 and acc[''pass'']==20, (acc,r[''aggregate''][''outcomes''])

        assert r[''aggregate''][''outcomes''].get(''email_sent'',0)==0, r[''aggregate''][''outcomes'']

        print(''PASS: S8 20/20, no premature writes'')

        PY

        '
    - name: Upload evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: issue-535-voice-replay-${{ github.sha }}
        path: ${{ runner.temp }}/voice-approval-replay/
        if-no-files-found: warn
    name: replay
    needs:
    - dispatch_contract
    if: ${{ always() && needs.dispatch_contract.result == 'success' && contains(fromJSON(needs.dispatch_contract.outputs.selected),
      'master-qa-qa30-voice-confirmed-turns') && ((!cancelled() && (true))) }}
  run_acceptance_voice__voice:
    name: Bounded live provider and cancelled-write acceptance
    uses: ./.github/workflows/qa-12-independent-acceptance.yml
    with:
      suite: voice
    secrets: inherit
    needs:
    - dispatch_contract
    if: ${{ always() && needs.dispatch_contract.result == 'success' && contains(fromJSON(needs.dispatch_contract.outputs.selected),
      'run-acceptance-voice') && ((!cancelled() && (true))) }}
    permissions:
      contents: read
      actions: read
      pull-requests: read
  voice_duplex_guard__voice-duplex:
    name: Voice duplex capture guard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4
      with:
        version: 10
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Reclaim unused runner toolchains before Python installation
      run: 'df -h /

        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/hostedtoolcache/CodeQL

        df -h /

        '
    - name: Install backend dependencies (Pipecat harness server)
      env:
        PIP_NO_CACHE_DIR: '1'
      working-directory: backend
      run: 'python -m pip install --upgrade pip

        python -m pip install --no-cache-dir -r requirements.txt

        df -h /

        '
    - name: Install root + web dependencies
      run: 'npm install

        cd apps/web && pnpm install --frozen-lockfile

        '
    - name: Verify local cancellation candidate remains shadow-only
      working-directory: apps/web
      run: pnpm exec vitest run __tests__/voice-local-cancel-candidate.test.ts __tests__/voice-local-cancel-shadow-probe.test.ts
    - name: Install Playwright Chromium
      run: npx playwright install --with-deps chromium
    - name: Run voice duplex guard
      run: npx playwright test --config=playwright.voice.config.ts
      env:
        CI: 'true'
        PLAYWRIGHT_BASE_URL: http://localhost:3021
        NEXT_PUBLIC_PLAYWRIGHT_E2E: '1'
        PLAYWRIGHT_E2E: '1'
        PIPECAT_HARNESS_URL: http://127.0.0.1:8799
        PIPECAT_HARNESS_PYTHON: python
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    - name: Upload Playwright artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: voice-duplex-guard-artifacts
        if-no-files-found: ignore
        retention-days: 14
        path: 'test-results/

          playwright-report/

          '
    needs:
    - dispatch_contract
    if: ${{ always() && needs.dispatch_contract.result == 'success' && contains(fromJSON(needs.dispatch_contract.outputs.selected),
      'voice-duplex-guard') && ((!cancelled() && (true))) }}
    concurrency:
      group: ${{ format('candidate-{0}-{1}-{2}', 'voice-duplex-guard', 'voice_duplex_guard__voice-duplex', toJSON(matrix))
        }}
      cancel-in-progress: ${{ false }}
  voice_gates_2_3__standing-batteries:
    if: ${{ always() && needs.dispatch_contract.result == 'success' && contains(fromJSON(needs.dispatch_contract.outputs.selected),
      'voice-gates-2-3') && (!cancelled() && (needs.voice_gates_2_3__live-provider.result == 'success' && needs.voice_gates_2_3__paired-runtime-readiness.result
      == 'success') && (github.event_name == 'workflow_dispatch' && inputs.voice_gates_2_3__run_paid_voice_acceptance == true))
      }}
    needs:
    - dispatch_contract
    - voice_gates_2_3__paired-runtime-readiness
    - voice_gates_2_3__live-provider
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: acceptance
    env:
      PIP_NO_CACHE_DIR: '1'
      APP_ENV: dev
      GRAVITRE_VOICE_ISOLATED: '1'
      SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_JWT_SECRET: ${{ secrets.E2E_SUPABASE_JWT_SECRET }}
      E2E_SUPABASE_ALLOWED_URL: ${{ vars.E2E_SUPABASE_ALLOWED_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ACCEPTANCE_ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ''
      GEMINI_API_KEY: ''
      PREFERRED_AI_PROVIDER: anthropic
      AI_FAILOVER_ENABLED: 'true'
      NOTIFICATION_EMAIL_ENABLED: 'false'
      ACCEPTANCE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install production dependencies without retaining wheel cache
      run: python -m pip install -r backend/requirements-dev.txt
    - name: Regress acceptance targeting, report privacy and full-battery retention
      run: 'python -m unittest discover -s tests -p test_voice_standing_acceptance.py

        python -m unittest discover -s tests -p test_prompt_injection_smoke_auth.py

        '
    - name: Wait for predecessor acceptance runs before touching the shared smoke actor
      run: python scripts/wait_voice_acceptance_predecessors.py
      env:
        GH_TOKEN: ${{ github.token }}
    - name: Provision and verify the dedicated acceptance identity
      run: python scripts/bootstrap_voice_acceptance.py
    - name: Mint the exported acceptance actor session
      run: python scripts/mint_smoke_org_session.py --github-env
    - name: Run complete standing prompt batteries against the loopback acceptance API
      run: python scripts/voice_standing_acceptance.py
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: isolated-standing-batteries
        path: acceptance-results/standing-batteries
    name: standing-batteries
    permissions:
      contents: read
      actions: read
  voice_gates_2_3__paired-runtime-readiness:
    if: ${{ always() && needs.dispatch_contract.result == 'success' && contains(fromJSON(needs.dispatch_contract.outputs.selected),
      'voice-gates-2-3') && (!cancelled() && (needs.voice_gates_2_3__live-provider.result == 'success') && (github.event_name
      == 'workflow_dispatch' && inputs.voice_gates_2_3__run_paid_voice_acceptance == true)) }}
    needs:
    - dispatch_contract
    - voice_gates_2_3__live-provider
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: acceptance
    env:
      PIP_NO_CACHE_DIR: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_JWT_SECRET: ${{ secrets.E2E_SUPABASE_JWT_SECRET }}
      E2E_SUPABASE_ALLOWED_URL: ${{ vars.E2E_SUPABASE_ALLOWED_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ACCEPTANCE_ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ''
      GEMINI_API_KEY: ''
      APP_ENV: dev
      GRAVITRE_VOICE_ISOLATED: '1'
      VOICE_PIPECAT_ENABLED: 'true'
      PREFERRED_AI_PROVIDER: anthropic
      AI_FAILOVER_ENABLED: 'true'
      DEEPGRAM_API_KEY: ${{ secrets.ACCEPTANCE_DEEPGRAM_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ACCEPTANCE_ELEVENLABS_API_KEY }}
      ELEVENLABS_VOICE_ID: ${{ vars.ACCEPTANCE_ELEVENLABS_VOICE_ID }}
      ELEVENLABS_VOICE_SARAH: ${{ vars.ACCEPTANCE_ELEVENLABS_VOICE_ID }}
      ACCEPTANCE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      ACCEPTANCE_INPUT_WAV: /tmp/voice-pinned-recordings/paired-live/input.wav
      ACCEPTANCE_CANCEL_WAV: /tmp/voice-pinned-recordings/paired-live/cancel-input.wav
      ACCEPTANCE_NATIVE_RECORDINGS_DIR: /tmp/voice-native-pinned/paired-native-assignment
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Reclaim unused hosted-runner toolchains and record disk baseline
      run: "set -euo pipefail\necho \"Disk before safe hosted-runner cleanup:\"\ndf -h / /tmp\n# Disposable ubuntu-latest\
        \ runner: these SDKs are unrelated to this Python/RTC job.\n# Do not remove Python, FFmpeg, Docker, GitHub Actions\
        \ tools, or repository data.\nfor dir in /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/powershell;\
        \ do\n  if [ -d \"$dir\" ]; then\n    echo \"Removing unused hosted SDK: $dir\"\n    sudo rm -rf -- \"$dir\"\n  fi\n\
        done\npython -m pip cache purge || true\nsudo apt-get clean\necho \"Disk after cleanup:\"\ndf -h / /tmp\navailable_kib=$(df\
        \ -Pk / | awk 'NR==2 {print $4}')\nif [ \"$available_kib\" -lt 10485760 ]; then\n  echo \"::error::Paired voice runner\
        \ needs at least 10 GiB free before heavy dependencies; available KiB=$available_kib\"\n  exit 1\nfi\n"
    - name: Verify isolated runtime configuration (read-only, no production fallback)
      run: "python - <<'PY'\nimport json, os, pathlib\nnames = ('SUPABASE_URL', 'SUPABASE_ANON_KEY', 'SUPABASE_SERVICE_ROLE_KEY',\
        \ 'SUPABASE_JWT_SECRET', 'E2E_SUPABASE_ALLOWED_URL', 'ANTHROPIC_API_KEY')\nblockers = ['missing:' + name for name\
        \ in names if not os.environ.get(name)]\nif os.environ.get('SUPABASE_URL') and (os.environ['SUPABASE_URL'].rstrip('/')\
        \ != 'https://aadnwmjzrmbvadszroqt.supabase.co' or os.environ['SUPABASE_URL'].rstrip('/') != os.environ.get('E2E_SUPABASE_ALLOWED_URL',\
        \ '').rstrip('/')):\n    blockers.append('isolated_target_not_explicitly_allowlisted')\nresult = {'status': 'NOT RUN'\
        \ if blockers else 'CONFIGURATION_PRESENT', 'blockers': blockers,\n          'paired_inference': 'NOT RUN', 'live_action_certification':\
        \ 'NOT RUN', 'certified': False}\npath = pathlib.Path('acceptance-results/paired-runtime-readiness.json')\npath.parent.mkdir(parents=True,\
        \ exist_ok=True)\npath.write_text(json.dumps(result, indent=2))\nprint(json.dumps(result))\nif blockers: raise SystemExit(2)\n\
        PY\n"
    - name: Regress inference preflight privacy and status mapping
      run: python -m unittest discover -s tests -p test_verify_acceptance_inference.py
    - name: Verify authorized live Anthropic inference (bounded request)
      run: python scripts/verify_acceptance_inference.py --output acceptance-results/anthropic-inference.json
    - name: Install read-only smoke identity verifier
      run: python -m pip install 'supabase==2.33.0' 'PyJWT==2.15.1'
    - name: Verify target-pinning guards
      run: python -m unittest discover -s tests -p test_bootstrap_voice_acceptance.py
    - name: Provision authorized disposable acceptance tenant and actor
      run: python scripts/bootstrap_voice_acceptance.py
    - name: Verify flagged smoke actor and mint short-lived session
      run: python scripts/mint_smoke_org_session.py --github-env
    - name: Verify short-lived smoke token against Supabase Auth
      run: "python - <<'PY'\nimport os\nfrom supabase import create_client\nclient = create_client(os.environ['SUPABASE_URL'],\
        \ os.environ['SUPABASE_SERVICE_ROLE_KEY'])\nuser = client.auth.get_user(os.environ['PLATFORM_LIVE_BEARER_TOKEN']).user\n\
        if not user or str(user.id) != os.environ['ISOLATED_CONVERSATION_TEST_USER_ID']:\n    raise SystemExit('Smoke token\
        \ identity verification failed')\nprint('AUTHENTICATED_SMOKE_ACTOR_VERIFIED: Auth API identity matches isolated membership')\n\
        PY\n"
    - name: Install production voice pipeline and isolated transport dependencies
      run: 'set -euo pipefail

        echo "Disk before voice dependency installation:"

        df -h / /tmp

        python -m pip install --no-cache-dir --no-compile -r backend/requirements-dev.txt -r backend/requirements-voice-comparison.txt
        ''livekit-api==1.2.2''

        echo "Disk after voice dependency installation:"

        df -h / /tmp

        python -m pip check

        '
    - name: Install recording decoder from the runner package repository
      run: 'sudo apt-get update -qq

        sudo apt-get install --yes --no-install-recommends ffmpeg

        sudo apt-get clean

        ffmpeg -version

        echo "Disk after FFmpeg installation:"

        df -h / /tmp

        '
    - name: Verify paired controller isolation and capture contracts
      run: 'python -m unittest discover -s tests -p test_voice_paired_live.py

        python -m unittest discover -s tests -p test_voice_acceptance_sink.py

        python -m unittest discover -s tests -p test_voice_acceptance_repetitions.py

        '
    - name: Regress real HTTP1 credential serialization
      working-directory: backend
