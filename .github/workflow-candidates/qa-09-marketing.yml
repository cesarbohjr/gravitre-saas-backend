# STAGED: not installed in .github/workflows; automatic trigger cutover pending.
name: QA 09-marketing
'on':
  workflow_dispatch:
    inputs:
      source:
        description: Original workflow contract to execute
        required: true
        type: choice
        options:
        - indexnow-on-publish
        - marketing-lighthouse
        - seo-publishing
        default: indexnow-on-publish
      indexnow_on_publish__published_url:
        description: 'indexnow-on-publish: Published, canonical https://gravitre.app URL'
        required: false
        type: string
  push:
    branches:
    - main
  pull_request:
    types:
    - opened
    - reopened
    - synchronize
concurrency:
  group: ${{ format('candidate-{0}', (inputs.source == 'marketing-lighthouse' && (format('marketing-lighthouse-{0}', github.ref)))
    || github.run_id) }}
  cancel-in-progress: ${{ (inputs.source == 'marketing-lighthouse' && (true)) || false }}
jobs:
  upstream_contract:
    name: Read trusted upstream outcome metadata
    if: ${{ github.event_name == 'workflow_run' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    outputs:
      evidence: ${{ steps.upstream.outputs.evidence }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - id: upstream
      run: python scripts/route-workflow-event.py --lane 09-marketing --fetch-upstream
      env:
        GITHUB_TOKEN: ${{ github.token }}
  dispatch_contract:
    name: Validate selected source inputs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 4
    needs:
    - upstream_contract
    if: ${{ always() && (needs.upstream_contract.result == 'success' || needs.upstream_contract.result == 'skipped') }}
    outputs:
      selected: ${{ steps.contract.outputs.selected }}
      derived: ${{ steps.contract.outputs.derived }}
      context_conclusions: ${{ steps.contract.outputs.context_conclusions }}
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        fetch-depth: 0
    - id: contract
      name: Validate source contract
      shell: python
      env:
        SOURCE_SCHEMAS: '{"indexnow-on-publish": {"published_url": {"description": "Published, canonical https://gravitre.app
          URL", "required": true, "type": "string"}}, "marketing-lighthouse": {}, "seo-publishing": {}, "social-intelligence-regression":
          {}}'
        MANUAL_SOURCES: '["indexnow-on-publish", "marketing-lighthouse", "seo-publishing"]'
        DISPATCH_VALUES: ${{ toJSON(inputs) }}
        EVENT_NAME: ${{ github.event_name }}
        CANONICAL_LANE: 09-marketing
        UPSTREAM_EVIDENCE: ${{ needs.upstream_contract.outputs.evidence }}
      run: "import json, os\nschemas = json.loads(os.environ['SOURCE_SCHEMAS'])\nvalues = json.loads(os.environ['DISPATCH_VALUES'])\n\
        event_name = os.environ['EVENT_NAME']\ncalled = values.get('_reusable', False)\nif not called and event_name not in\
        \ ('workflow_dispatch', 'workflow_call'):\n    import subprocess\n    subprocess.run(['python', 'scripts/route-workflow-event.py',\
        \ '--lane', os.environ['CANONICAL_LANE']], check=True)\n    raise SystemExit(0)\nsource = values.get('source')\nif\
        \ source not in schemas:\n    raise SystemExit('Unknown source workflow')\nif not called and event_name == 'workflow_dispatch'\
        \ and source not in json.loads(os.environ['MANUAL_SOURCES']):\n    raise SystemExit('Source has no manual trigger')\n\
        if called and source != 'isolated-acceptance':\n    raise SystemExit('Unsupported reusable source')\nfor key, config\
        \ in schemas[source].items():\n    value = values.get(source.replace('-', '_') + '__' + key)\n    if called and key\
        \ == 'suite':\n        value = values.get('suite')\n    if config.get('required') and (value is None or value == ''):\n\
        \        raise SystemExit('Required selected-source input missing: ' + key)\nprint('Selected source input contract\
        \ validated; this is not execution acceptance')\nwith open(os.environ['GITHUB_OUTPUT'], 'a') as output:\n    output.write('selected='\
        \ + json.dumps([source]) + '\\n')\n    output.write('derived=[]\\ncontext_conclusions={}\\n')\n"
  indexnow_on_publish__ping-indexnow:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Submit verified published page
      env:
        INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        PUBLISHED_URL: ${{ inputs.indexnow_on_publish__published_url }}
      run: node scripts/ping-indexnow.mjs "$PUBLISHED_URL"
    name: ping-indexnow
    needs:
    - dispatch_contract
    if: ${{ always() && needs.dispatch_contract.result == 'success' && contains(fromJSON(needs.dispatch_contract.outputs.selected),
      'indexnow-on-publish') && ((!cancelled() && (true))) }}
  marketing_lighthouse__lighthouse:
    name: Lighthouse (home + pricing)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4
      with:
        version: 10
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
        cache-dependency-path: apps/web/pnpm-lock.yaml
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Production build
      run: pnpm build
      env:
        NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
        NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
        FASTAPI_BASE_URL: http://127.0.0.1:8000
    - name: Run Lighthouse CI
      run: 'npx --yes @lhci/cli@0.14.0 autorun --config=lighthouserc.json

        '
      env:
        LHCI_GITHUB_APP_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    needs:
    - dispatch_contract
    if: ${{ always() && needs.dispatch_contract.result == 'success' && contains(fromJSON(needs.dispatch_contract.outputs.selected),
      'marketing-lighthouse') && ((!cancelled() && (true))) }}
    concurrency:
      group: ${{ format('candidate-{0}-{1}-{2}', format('marketing-lighthouse-{0}', github.ref), 'marketing_lighthouse__lighthouse',
        toJSON(matrix)) }}
      cancel-in-progress: ${{ true }}
  seo_publishing__seo-publishing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Validate new public content and metadata contracts
      env:
        SEO_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}
      run: node scripts/check-seo-publishing.mjs
    - name: Verify marketing and private route registry stays synchronized
      run: node scripts/check-route-root-access.mjs
    name: seo-publishing
    needs:
    - dispatch_contract
    if: ${{ always() && needs.dispatch_contract.result == 'success' && contains(fromJSON(needs.dispatch_contract.outputs.selected),
      'seo-publishing') && ((!cancelled() && (true))) }}
  social_intelligence_regression__evaluator-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
    - name: Offline evaluator schema, failure and paired-channel contracts
      run: node --test scripts/social_intelligence/evaluator.test.ts scripts/social_intelligence/durable_results.test.ts scripts/social_intelligence/conversation_evaluator.test.ts
    - name: Self-contained runner payload contracts
      run: python3 scripts/social_intelligence/test_build_railway_runner.py
    name: evaluator-contracts
    needs:
    - dispatch_contract
    if: ${{ always() && needs.dispatch_contract.result == 'success' && contains(fromJSON(needs.dispatch_contract.outputs.selected),
      'social-intelligence-regression') && ((!cancelled() && (true))) }}
    permissions:
      contents: read
  source_outcomes:
    name: Record independent source workflow outcomes
    if: ${{ always() && needs.dispatch_contract.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions: {}
    needs:
    - upstream_contract
    - dispatch_contract
    - indexnow_on_publish__ping-indexnow
    - marketing_lighthouse__lighthouse
    - seo_publishing__seo-publishing
    - social_intelligence_regression__evaluator-contracts
    steps:
    - name: Bind source outcomes to this run
      shell: python
      run: "import json, os\nsources = json.loads(os.environ['SOURCE_JOBS'])\nneeds = json.loads(os.environ['JOB_RESULTS'])\n\
        selected = json.loads(os.environ['SELECTED'])\noutcomes = {}\nfor name, source in sources.items():\n    if name not\
        \ in selected:\n        continue\n    results = [needs[key]['result'] for key in source['jobs']]\n    outcome = ('failure'\
        \ if 'failure' in results else 'cancelled' if 'cancelled' in results\n               else 'success' if 'success' in\
        \ results else 'skipped')\n    outcomes[source['display_name']] = outcome\nevidence = {'run_id': int(os.environ['GITHUB_RUN_ID']),\
        \ 'head_sha': os.environ['GITHUB_SHA'],\n            'source_outcomes': outcomes}\nwith open('canonical-workflow-outcomes.json',\
        \ 'w') as output:\n    json.dump(evidence, output)\n"
      env:
        SOURCE_JOBS: '{"indexnow-on-publish": {"display_name": "IndexNow on publication", "jobs": ["indexnow_on_publish__ping-indexnow"]},
          "marketing-lighthouse": {"display_name": "Marketing Lighthouse CI", "jobs": ["marketing_lighthouse__lighthouse"]},
          "seo-publishing": {"display_name": "SEO publishing guard", "jobs": ["seo_publishing__seo-publishing"]}, "social-intelligence-regression":
          {"display_name": "Social intelligence evaluation contracts", "jobs": ["social_intelligence_regression__evaluator-contracts"]}}'
        JOB_RESULTS: '{"indexnow_on_publish__ping-indexnow": {"result": "${{ needs.indexnow_on_publish__ping-indexnow.result
          }}"}, "marketing_lighthouse__lighthouse": {"result": "${{ needs.marketing_lighthouse__lighthouse.result }}"}, "seo_publishing__seo-publishing":
          {"result": "${{ needs.seo_publishing__seo-publishing.result }}"}, "social_intelligence_regression__evaluator-contracts":
          {"result": "${{ needs.social_intelligence_regression__evaluator-contracts.result }}"}}'
        SELECTED: ${{ needs.dispatch_contract.outputs.selected }}
    - uses: actions/upload-artifact@v4
      with:
        name: canonical-workflow-outcomes-09-marketing
        path: canonical-workflow-outcomes.json
        if-no-files-found: error
        retention-days: 14
