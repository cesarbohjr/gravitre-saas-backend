# STAGED: not installed in .github/workflows; automatic trigger cutover pending.
name: QA 05-intelligence
'on':
  workflow_dispatch:
    inputs:
      source:
        description: Original workflow contract to execute
        required: true
        type: choice
        options:
        - agent-roi-live
        - catalog-enrichment-nl-variance
        - conversation-engineering
        - conversation-parity-contract
        - department-eval-suites
        - federated-runtime
        - golden-benchmark-live
        - intelligence-lifecycle-e2e
        - intelligence-offline-acceptance
        - live-generated-response-quality
        - milestone2-latency-ab
        - milestone2-performance-audit
        - native-langfuse-certification
        - phase3-intelligence-coverage
        - phase3-offline-12-scenarios
        - phase3-phase5-evidence
        - research-cascade-prod-smoke
        - unified-turn-phase2-live
        - unified-turn-standing-batteries
        default: agent-roi-live
      department_eval_suites__department:
        description: 'department-eval-suites: Optional department (marketing|sales|finance|legal|hr|msp)'
        required: false
        default: ''
      live_generated_response_quality__deployed_sha:
        description: 'live-generated-response-quality: Production backend Git SHA to certify (must equal checked-out main
          HEAD)'
        required: false
        type: string
      milestone2_latency_ab__reason:
        description: 'milestone2-latency-ab: Reason for manual trigger (pre/post RM latency guardrail)'
        required: false
        default: milestone2-latency-ab
      milestone2_performance_audit__reason:
        description: 'milestone2-performance-audit: Reason for manual trigger'
        required: false
      research_cascade_prod_smoke__reason:
        description: 'research-cascade-prod-smoke: Reason for manual trigger'
        required: false
      unified_turn_phase2_live__commit_sha:
        description: 'unified-turn-phase2-live: Expected health git_sha prefix (empty = this checkout)'
        required: false
        default: ''
      unified_turn_phase2_live__enable_shadow:
        description: 'unified-turn-phase2-live: Set UNIFIED_TURN_SHADOW_ENABLED=true on Railway'
        required: false
        default: 'true'
      unified_turn_phase2_live__enable_live:
        description: 'unified-turn-phase2-live: Phase 4: Set UNIFIED_TURN_LIVE_ENABLED=true on Railway'
        required: false
        default: 'false'
      unified_turn_phase2_live__railway_environment:
        description: 'unified-turn-phase2-live: Railway environment name'
        required: false
        default: production
concurrency:
  group: ${{ format('candidate-{0}', (inputs.source == 'agent-roi-live' && ('agent-roi-live')) || (inputs.source == 'catalog-enrichment-nl-variance'
    && ('catalog-enrichment-nl-variance')) || (inputs.source == 'department-eval-suites' && (format('department-eval-{0}',
    github.ref))) || (inputs.source == 'golden-benchmark-live' && ('golden-benchmark-live')) || (inputs.source == 'intelligence-lifecycle-e2e'
    && ('intelligence-lifecycle-e2e')) || (inputs.source == 'milestone2-latency-ab' && ('milestone2-latency-ab')) || (inputs.source
    == 'milestone2-performance-audit' && ('milestone2-performance-audit')) || (inputs.source == 'native-langfuse-certification'
    && (format('native-langfuse-{0}', github.ref))) || (inputs.source == 'research-cascade-prod-smoke' && ('research-cascade-prod-smoke'))
    || (inputs.source == 'unified-turn-phase2-live' && ('unified-turn-phase2-live')) || (inputs.source == 'unified-turn-standing-batteries'
    && ('unified-turn-standing-batteries')) || github.run_id) }}
  cancel-in-progress: ${{ (inputs.source == 'agent-roi-live' && (false)) || (inputs.source == 'catalog-enrichment-nl-variance'
    && (false)) || (inputs.source == 'department-eval-suites' && (true)) || (inputs.source == 'golden-benchmark-live' && (false))
    || (inputs.source == 'intelligence-lifecycle-e2e' && (false)) || (inputs.source == 'milestone2-latency-ab' && (false))
    || (inputs.source == 'milestone2-performance-audit' && (false)) || (inputs.source == 'native-langfuse-certification' &&
    (false)) || (inputs.source == 'research-cascade-prod-smoke' && (false)) || (inputs.source == 'unified-turn-phase2-live'
    && (false)) || (inputs.source == 'unified-turn-standing-batteries' && (false)) || false }}
jobs:
  dispatch_contract:
    name: Validate selected source inputs
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 2
    steps:
    - name: Validate source contract
      shell: python
      env:
        SOURCE_SCHEMAS: '{"agent-roi-live": {}, "catalog-enrichment-nl-variance": {}, "conversation-engineering": {}, "conversation-parity-contract":
          {}, "department-eval-suites": {"department": {"description": "Optional department (marketing|sales|finance|legal|hr|msp)",
          "required": false, "default": ""}}, "federated-runtime": {}, "golden-benchmark-live": {}, "intelligence-lifecycle-e2e":
          {}, "intelligence-offline-acceptance": {}, "live-generated-response-quality": {"deployed_sha": {"description": "Production
          backend Git SHA to certify (must equal checked-out main HEAD)", "required": true, "type": "string"}}, "milestone2-latency-ab":
          {"reason": {"description": "Reason for manual trigger (pre/post RM latency guardrail)", "required": false, "default":
          "milestone2-latency-ab"}}, "milestone2-performance-audit": {"reason": {"description": "Reason for manual trigger",
          "required": false}}, "native-langfuse-certification": {}, "phase3-intelligence-coverage": {}, "phase3-offline-12-scenarios":
          {}, "phase3-phase5-evidence": {}, "research-cascade-prod-smoke": {"reason": {"description": "Reason for manual trigger",
          "required": false}}, "unified-turn-phase2-live": {"commit_sha": {"description": "Expected health git_sha prefix
          (empty = this checkout)", "required": false, "default": ""}, "enable_shadow": {"description": "Set UNIFIED_TURN_SHADOW_ENABLED=true
          on Railway", "required": false, "default": "true"}, "enable_live": {"description": "Phase 4: Set UNIFIED_TURN_LIVE_ENABLED=true
          on Railway", "required": false, "default": "false"}, "railway_environment": {"description": "Railway environment
          name", "required": false, "default": "production"}}, "unified-turn-standing-batteries": {}}'
        MANUAL_SOURCES: '["agent-roi-live", "catalog-enrichment-nl-variance", "conversation-engineering", "conversation-parity-contract",
          "department-eval-suites", "federated-runtime", "golden-benchmark-live", "intelligence-lifecycle-e2e", "intelligence-offline-acceptance",
          "live-generated-response-quality", "milestone2-latency-ab", "milestone2-performance-audit", "native-langfuse-certification",
          "phase3-intelligence-coverage", "phase3-offline-12-scenarios", "phase3-phase5-evidence", "research-cascade-prod-smoke",
          "unified-turn-phase2-live", "unified-turn-standing-batteries"]'
        DISPATCH_VALUES: ${{ toJSON(inputs) }}
        EVENT_NAME: ${{ github.event_name }}
      run: "import json, os\nschemas = json.loads(os.environ['SOURCE_SCHEMAS'])\nvalues = json.loads(os.environ['DISPATCH_VALUES'])\n\
        source = values.get('source')\nif source not in schemas:\n    raise SystemExit('Unknown source workflow')\nif os.environ['EVENT_NAME']\
        \ == 'workflow_dispatch' and source not in json.loads(os.environ['MANUAL_SOURCES']):\n    raise SystemExit('Source\
        \ has no manual trigger')\nif os.environ['EVENT_NAME'] != 'workflow_dispatch' and source != 'isolated-acceptance':\n\
        \    raise SystemExit('Unsupported reusable source')\nfor key, config in schemas[source].items():\n    value = values.get(source.replace('-',\
        \ '_') + '__' + key)\n    if os.environ['EVENT_NAME'] != 'workflow_dispatch' and key == 'suite':\n        value =\
        \ values.get('suite')\n    if config.get('required') and (value is None or value == ''):\n        raise SystemExit('Required\
        \ selected-source input missing: ' + key)\nprint('Selected source input contract validated; this is not execution\
        \ acceptance')\n"
  agent_roi_live__verify:
    if: ${{ needs.dispatch_contract.result == 'success' && inputs.source == 'agent-roi-live' && (github.event_name != 'workflow_run'
      || github.event.workflow_run.conclusion == 'success') }}
    name: Live agent ROI honesty
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: pip install httpx PyJWT python-dotenv supabase
    - name: Run live agent ROI probe
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
        LIVE_API_BASE: https://api.gravitre.app
      run: "set -euo pipefail\nif [ -z \"${SUPABASE_URL:-}\" ] || [ -z \"${SUPABASE_SERVICE_ROLE_KEY:-}\" ] || [ -z \"${SUPABASE_JWT_SECRET:-}\"\
        \ ]; then\n  echo \"Missing Supabase secrets\" >&2\n  exit 1\nfi\npython3 scripts/verify-agent-roi-live.py\n"
    - name: Upload report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: agent-roi-live
        path: docs/delivery/agent-roi-live.json
        if-no-files-found: ignore
    needs:
    - dispatch_contract
  catalog_enrichment_nl_variance__enrichment-probe:
    name: Catalog enrichment NL-variance probe
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: backend/requirements.txt
    - name: Install deps
      working-directory: backend
      run: 'python -m pip install --upgrade pip

        pip install -r requirements-dev.txt

        '
    - name: Schema lint (examples + tags coverage)
      working-directory: backend
      run: python -m pytest tests/connectors/test_action_schema_standard_lint.py -q
      env:
        APP_ENV: dev
        SUPABASE_URL: https://test.supabase.co
        SUPABASE_ANON_KEY: anon-test
        SUPABASE_SERVICE_ROLE_KEY: service-role-test
        SUPABASE_JWT_SECRET: jwt-secret-test
        OPENAI_API_KEY: sk-test-openai
    - name: Full NL-variance + latency probe
      env:
        APP_ENV: dev
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        GRAVITRE_ACTION_ENRICHMENT_ENABLED: 'true'
      run: python scripts/probe-catalog-enrichment-nl-variance.py
    - name: Upload artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: catalog-enrichment-nl-variance
        path: docs/delivery/catalog-enrichment-nl-variance-live.json
        if-no-files-found: ignore
    needs:
    - dispatch_contract
    if: ${{ needs.dispatch_contract.result == 'success' && inputs.source == 'catalog-enrichment-nl-variance' && (success())
      }}
  conversation_engineering__deepeval-tool-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install isolated exact-tool evaluator experiment
      run: 'python -m venv "$RUNNER_TEMP/deepeval-venv"

        "$RUNNER_TEMP/deepeval-venv/bin/pip" install --require-hashes -r scripts/framework_benchmarks/requirements-deepeval.lock

        "$RUNNER_TEMP/deepeval-venv/bin/pip" check

        '
    - name: Compare real SDK metric with a strict trace reference
      run: timeout 90s "$RUNNER_TEMP/deepeval-venv/bin/python" scripts/framework_benchmarks/deepeval_tools.py --output "$RUNNER_TEMP/deepeval-tool-report.json"
    - name: Audit every isolated candidate dependency
      run: 'python -m pip install pip-audit

        python -m pip_audit --no-deps --disable-pip -r scripts/framework_benchmarks/requirements-deepeval.lock --format json
        --output "$RUNNER_TEMP/deepeval-audit.json"

        '
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: deepeval-tool-experiment
        path: '${{ runner.temp }}/deepeval-tool-report.json

          ${{ runner.temp }}/deepeval-audit.json

          '
        if-no-files-found: error
    name: deepeval-tool-experiment
    needs:
    - dispatch_contract
    if: ${{ needs.dispatch_contract.result == 'success' && inputs.source == 'conversation-engineering' && (success()) }}
    permissions:
      contents: read
  conversation_engineering__dspy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install isolated hash-pinned offline tooling
      run: 'python -m venv "$RUNNER_TEMP/dspy-venv"

        "$RUNNER_TEMP/dspy-venv/bin/pip" install --require-hashes -r scripts/guidance_optimization/requirements.lock

        '
    - name: Compile actual SDK with credentials and network denied
      run: timeout 120s "$RUNNER_TEMP/dspy-venv/bin/python" scripts/guidance_optimization/verify_compilation.py "$RUNNER_TEMP/dspy-compilation.json"
    - name: Exercise actual SDK HTTP transport against a local fixture
      run: timeout 120s "$RUNNER_TEMP/dspy-venv/bin/python" scripts/guidance_optimization/verify_transport.py "$RUNNER_TEMP/dspy-transport.json"
    - name: Audit isolated dependencies and explicit offline containment
      run: 'python -m pip install pip-audit

        python scripts/guidance_optimization/audit.py "$RUNNER_TEMP/dspy-audit.json"

        '
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: conversational-guidance-engineering
        path: '${{ runner.temp }}/dspy-compilation.json

          ${{ runner.temp }}/dspy-audit.json

          ${{ runner.temp }}/dspy-transport.json

          '
    name: dspy
    needs:
    - dispatch_contract
    if: ${{ needs.dispatch_contract.result == 'success' && inputs.source == 'conversation-engineering' && (success()) }}
    permissions:
      contents: read
  conversation_parity_contract__parity-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Reclaim unused toolchains for heavy backend dependencies
      run: 'df -h /

        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/hostedtoolcache/CodeQL

        df -h /

        '
    - name: Install focused test dependencies without wheel cache
      env:
        PIP_NO_CACHE_DIR: '1'
      run: 'python -m pip install --no-cache-dir -r requirements.txt pytest pytest-asyncio

        df -h /

        '
    - name: Run conversation parity contract
      run: PYTHONPATH=. pytest -q tests/services/test_conversation_parity_benchmark.py tests/services/test_conversation_parity_model_routing.py
        tests/services/test_conversation_parity_no_canned_eval_answers.py tests/services/pipecat_voice/test_durable_conversation_parity.py
        tests/services/pipecat_voice/test_interrupt_reporter_durable_behaviour.py tests/services/pipecat_voice/test_cognitive_llm_barge_in_and_seed.py
        tests/services/test_few_shot_benchmark_isolation.py
    - name: Prove benchmark template builds
      working-directory: .
      run: python scripts/run-conversation-parity-benchmark.py --template --out /tmp/conversation-parity-template.json
    name: parity-contract
    needs:
    - dispatch_contract
    if: ${{ needs.dispatch_contract.result == 'success' && inputs.source == 'conversation-parity-contract' && (success())
      }}
  department_eval_suites__department-eval:
    name: Department eval suites
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: backend/requirements*.txt
    - name: Install backend deps
      run: 'python -m pip install -U pip

        pip install -r requirements.txt

        pip install -r requirements-dev.txt || true

        '
    - name: Print eval manifest
      run: python ../scripts/run-department-eval-suite.py --manifest-only
    - name: Run consolidated department eval suites
      run: "if [ -n \"${{ github.event.inputs.department_eval_suites__department }}\" ]; then\n  python ../scripts/run-department-eval-suite.py\
        \ -q --department \"${{ github.event.inputs.department_eval_suites__department }}\"\nelse\n  python ../scripts/run-department-eval-suite.py\
        \ -q\nfi\n"
      env:
        APP_ENV: dev
        SUPABASE_URL: https://test.supabase.co
        SUPABASE_ANON_KEY: anon-test
        SUPABASE_SERVICE_ROLE_KEY: service-role-test
        SUPABASE_JWT_SECRET: jwt-secret-test
        OPENAI_API_KEY: sk-test-openai
    needs:
    - dispatch_contract
    if: ${{ needs.dispatch_contract.result == 'success' && inputs.source == 'department-eval-suites' && (success()) }}
  federated_runtime__runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      FLWR_TELEMETRY_ENABLED: '0'
      SUPABASE_URL: https://test.supabase.co
      SUPABASE_ANON_KEY: anon-test
      SUPABASE_SERVICE_ROLE_KEY: service-role-test
      OPENAI_API_KEY: sk-test-offline
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install optional audited protocol libraries
      run: 'pip install torch --index-url https://download.pytorch.org/whl/cpu

        pip install -r requirements-dev.txt -r federated-runtime/requirements.txt

        '
    - name: Require actual protocol and privacy libraries
      run: python -c "import flwr, pydp; assert flwr.__version__ == '1.41.0'"
    - name: Build actual Flower bundle
      run: 'python -c "from app.ml.federated_runtime import server, client; assert server.app and client.app"

        flwr build --app federated-runtime

        '
    - name: Offline runtime contracts
      run: python -m pytest -p tests.offline_network_guard tests/ml/test_federated_runtime.py tests/ml/test_federated_adoption.py
        tests/ml/test_federated_adoption_boundaries.py -q
    name: runtime
    needs:
    - dispatch_contract
    if: ${{ needs.dispatch_contract.result == 'success' && inputs.source == 'federated-runtime' && (success()) }}
  golden_benchmark_live__live:
    name: Golden traffic live smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Skip if live secrets missing
      id: secrets
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
      run: "if [ -z \"$SUPABASE_URL\" ] || [ -z \"$SUPABASE_SERVICE_ROLE_KEY\" ] || [ -z \"$SUPABASE_JWT_SECRET\" ]; then\n\
        \  echo \"skip=1\" >> \"$GITHUB_OUTPUT\"\n  echo \"Skipping golden benchmark live smoke \u2014 SUPABASE secrets not\
        \ configured\"\nelse\n  echo \"skip=0\" >> \"$GITHUB_OUTPUT\"\nfi\n"
    - name: Run isolated-org live smoke
      if: steps.secrets.outputs.skip != '1'
      env:
        LIVE_API_BASE: https://api.gravitre.app
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
      run: "pip install httpx PyJWT python-dotenv supabase\nset +e\npython scripts/smoke-golden-benchmark-live.py\nCODE=$?\n\
        set -e\necho \"exit=$CODE\"\nif [ \"$CODE\" -eq 1 ]; then\n  exit 1\nfi\n"
    - name: Upload artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: smoke-golden-benchmark-live
        path: docs/delivery/smoke-golden-benchmark-live.json
        if-no-files-found: ignore
    needs:
    - dispatch_contract
    if: ${{ needs.dispatch_contract.result == 'success' && inputs.source == 'golden-benchmark-live' && (success()) }}
  intelligence_lifecycle_e2e__intelligence-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install session dependencies
      run: python -m pip install --disable-pip-version-check "httpx>=0.27,<1" "PyJWT>=2.8,<3" python-dotenv supabase
    - name: Mint short-lived smoke-org session
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
      run: python scripts/mint_smoke_org_session.py --github-env
    - name: Run the synthetic lifecycle
      run: "python3 scripts/run-intelligence-isolated-live.py \\\n  --allow-synthetic-write \\\n  --out \"$RUNNER_TEMP/intelligence-e2e-report.json\"\
        \n"
    - name: Clear session and check the report for token leaks
      if: always()
      shell: bash
      run: "if [ -n \"${PLATFORM_LIVE_BEARER_TOKEN:-}\" ] && [ -f \"$RUNNER_TEMP/intelligence-e2e-report.json\" ] && grep\
        \ -qF \"$PLATFORM_LIVE_BEARER_TOKEN\" \"$RUNNER_TEMP/intelligence-e2e-report.json\"; then\n  echo \"::error::report\
        \ contains the session token\"; rm -f \"$RUNNER_TEMP/intelligence-e2e-report.json\"; exit 1\nfi\necho \"PLATFORM_LIVE_BEARER_TOKEN=\"\
        \ >> \"$GITHUB_ENV\"\n"
    - name: Upload report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: intelligence-e2e-report
        path: ${{ runner.temp }}/intelligence-e2e-report.json
        if-no-files-found: ignore
    name: intelligence-lifecycle
    needs:
    - dispatch_contract
    if: ${{ needs.dispatch_contract.result == 'success' && inputs.source == 'intelligence-lifecycle-e2e' && (success()) }}
    permissions:
      contents: read
  intelligence_offline_acceptance__offline-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: dev
      SUPABASE_URL: https://test.supabase.co
      SUPABASE_ANON_KEY: anon-test
      SUPABASE_SERVICE_ROLE_KEY: service-role-test
      SUPABASE_JWT_SECRET: jwt-secret-test
      OPENAI_API_KEY: sk-test-openai
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: backend/requirements.txt
    - name: Install test dependencies
      run: python -m pip install -r requirements-dev.txt
    - name: Run offline isolation, recovery, billing, history, governed handoff, and migration contract tests
      run: "python -m pytest -q --no-header \\\n  tests/e2e/test_intelligence_tenant_recovery_regression.py \\\n  tests/e2e/test_intelligence_migration_security_contract.py\
        \ \\\n  tests/e2e/test_intelligence_recommendation_full_lifecycle.py \\\n  tests/e2e/test_intelligence_evidence_play_handoff.py\
