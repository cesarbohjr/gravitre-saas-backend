  milestone2_latency_ab__latency-ab:
    name: Pre/post Research Manager latency A/B on prod
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: backend/requirements.txt
    - name: Install dependencies
      working-directory: backend
      run: 'python -m pip install --upgrade pip

        pip install -r requirements-dev.txt

        '
    - name: Run full latency A/B (brief pre-RM rollback + restore tip)
      env:
        RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        BACKEND_URL: https://gravitre-saas-backend-production.up.railway.app
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
        OAUTH_SMOKE_ORG_ID: ${{ secrets.OAUTH_SMOKE_ORG_ID }}
      run: "set -euo pipefail\nif [ -n \"${RAILWAY_TOKEN:-}\" ]; then\n  echo \"Using automated Railway deploy (RAILWAY_TOKEN\
        \ set)\"\n  python3 scripts/smoke-milestone2-latency-ab.py \\\n    --full-ab \\\n    --json docs/delivery/milestone2-latency-ab-latest.json\n\
        else\n  echo \"::warning::RAILWAY_TOKEN not set \u2014 falling back to manual-wait mode.\"\n  echo \"Rollback prod\
        \ to ${PRE_RM_SHA:-09e57595} in Railway UI when prompted in logs.\"\n  python3 scripts/smoke-milestone2-latency-ab.py\
        \ \\\n    --manual-wait-ab \\\n    --json docs/delivery/milestone2-latency-ab-latest.json\nfi\n"
    - name: Re-run Milestone 2 audit with latency baseline attached
      if: always()
      env:
        BACKEND_URL: https://gravitre-saas-backend-production.up.railway.app
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
        OAUTH_SMOKE_ORG_ID: ${{ secrets.OAUTH_SMOKE_ORG_ID }}
      run: "PRE=$(python3 - <<'PY'\nimport json\nfrom pathlib import Path\np = Path(\"docs/delivery/milestone2-latency-ab-latest.json\"\
        )\nif not p.is_file():\n    print(\"\")\n    raise SystemExit(0)\ndata = json.loads(p.read_text())\npre = (data.get(\"\
        phases\") or {}).get(\"probe_pre_rm\") or {}\nout = Path(\"docs/delivery/milestone2-latency-pre-rm-probe.json\")\n\
        out.write_text(json.dumps(pre, indent=2) + \"\\n\")\nprint(str(out))\nPY\n)\nEXTRA=\"\"\nif [ -n \"$PRE\" ] && [ -f\
        \ \"$PRE\" ]; then\n  EXTRA=\"--latency-baseline $PRE\"\nfi\npython3 scripts/smoke-milestone2-performance-audit.py\
        \ \\\n  $EXTRA \\\n  --json docs/delivery/milestone2-performance-audit-latest.json\n"
    - name: Upload latency A/B artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: milestone2-latency-ab
        path: 'docs/delivery/milestone2-latency-ab-latest.json

          docs/delivery/milestone2-latency-pre-rm-probe.json

          docs/delivery/milestone2-performance-audit-latest.json

