    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: backend/native-workers/requirements-langfuse.txt
    - name: Install application transport dependencies
      run: pip install -r backend/native-workers/requirements-langfuse.txt
    - name: Prepare pinned isolated actual Langfuse server
      run: "curl --fail --location --silent --show-error https://raw.githubusercontent.com/langfuse/langfuse/d89f49b82620dc9a773bd2f97449289f4f6c199e/docker-compose.yml\
        \ -o \"$RUNNER_TEMP/langfuse-upstream.yml\"\npython - <<'PY'\nimport os,pathlib,yaml\nsource=pathlib.Path(os.environ['RUNNER_TEMP'])/'langfuse-upstream.yml'\n\
        config=yaml.safe_load(source.read_text())\nfor name,service in config['services'].items():\n    service['ports']=[p\
        \ if p.startswith('127.0.0.1:') else '127.0.0.1:'+p for p in service.get('ports',[])]\n    if name in ('langfuse-web','langfuse-worker'):\n\
        \        service['image']=service['image'].rsplit(':',1)[0]+':4.71.0'\nconfig['networks']={'default':{'internal':True}}\n\
        (source.parent/'langfuse-cert.yml').write_text(yaml.safe_dump(config))\nPY\ndocker compose -p native-langfuse-cert\
        \ -f \"$RUNNER_TEMP/langfuse-cert.yml\" up -d\npython - <<'PYHOST'\nimport ipaddress,json,os,pathlib,subprocess\n\
        config=pathlib.Path(os.environ['RUNNER_TEMP'])/'langfuse-cert.yml'\ncontainer=subprocess.check_output(['docker','compose','-p','native-langfuse-cert','-f',str(config),'ps','-q','langfuse-web'],text=True).strip()\n\
        networks=json.loads(subprocess.check_output(['docker','inspect','--format','{{json .NetworkSettings.Networks}}',container],text=True))\n\
        address=ipaddress.ip_address(networks['native-langfuse-cert_default']['IPAddress'])\nassert address.version==4 and\
        \ address.is_private and not address.is_loopback\n# Internal-only bridges have no published ports. On Linux the host\n\
        # can reach this private interface without granting server egress.\nwith open(os.environ['GITHUB_ENV'],'a') as env:env.write(f'LANGFUSE_CERT_HTTP_HOST={address}\\\
        n')\nPYHOST\n"
    - name: Wait for the actual application
      run: "python - <<'PY'\nimport os,time,urllib.request\nopener=urllib.request.build_opener(urllib.request.ProxyHandler({}))\n\
        deadline=time.monotonic()+420\nwhile time.monotonic()<deadline:\n    try:\n        with opener.open('http://'+os.environ['LANGFUSE_CERT_HTTP_HOST']+':3000/api/public/health',timeout=5)\
        \ as r:\n            if r.status==200:break\n    except Exception:pass\n    time.sleep(3)\nelse:raise SystemExit('Isolated\
        \ Langfuse did not become healthy')\nPY\n"
    - name: Verify real durable OTLP acknowledgement and deletion
      run: python backend/native-workers/langfuse_contract.py
    - uses: actions/upload-artifact@v4
      with:
        name: langfuse-delivery-certification
        path: langfuse-runtime-evidence.json
        if-no-files-found: error
    - name: Diagnose isolated startup or delivery failure without payloads
      if: failure()
      run: python backend/native-workers/langfuse_diagnostics.py
    - name: Remove only this job's disposable services and volumes
      if: always()
      run: docker compose -p native-langfuse-cert -f "$RUNNER_TEMP/langfuse-cert.yml" down --volumes --remove-orphans
    name: real-delivery
    needs:
    - dispatch_contract
    if: ${{ needs.dispatch_contract.result == 'success' && inputs.source == 'native-langfuse-certification' && (success())
      }}
    permissions:
