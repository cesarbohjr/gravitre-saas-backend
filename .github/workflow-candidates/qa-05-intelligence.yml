      run: 'python -m pip install --upgrade pip

        pip install -r requirements-dev.txt

        '
    - name: Install Railway CLI
      run: npm install -g @railway/cli@4.65.0
    - name: Force railway up on production + verify tip
      env:
        RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        RAILWAY_ENV: ${{ inputs.unified_turn_phase2_live__railway_environment }}
      run: "set -euo pipefail\nSHA=\"${{ inputs.unified_turn_phase2_live__commit_sha }}\"\nif [ -z \"$SHA\" ]; then\n  SHA=\"\
        $(git rev-parse --short=8 HEAD)\"\nfi\nFULL=\"$(git rev-parse HEAD)\"\nENV_NAME=\"${RAILWAY_ENV:-production}\"\nSVC=\"\
        gravitre-saas-backend\"\necho \"Expect health git_sha prefix=$SHA full=$FULL env=$ENV_NAME\"\n\nrailway whoami ||\
        \ true\nrailway status --json || true\n\n# Do not pin a stale GIT_SHA. Prefer Railway's commit SHA from a GitHub\n\
        # deploy; only set GIT_SHA to this tip when health is still on an old tip\n# (CLI upload path does not always populate\
        \ RAILWAY_GIT_COMMIT_SHA).\nif [ \"${{ inputs.unified_turn_phase2_live__enable_shadow }}\" = \"true\" ]; then\n  railway\
        \ variables set \"UNIFIED_TURN_SHADOW_ENABLED=true\" --service \"$SVC\" --environment \"$ENV_NAME\"\nfi\nif [ \"${{\
        \ inputs.unified_turn_phase2_live__enable_live }}\" = \"true\" ]; then\n  railway variables set \"UNIFIED_TURN_LIVE_ENABLED=true\"\
        \ --service \"$SVC\" --environment \"$ENV_NAME\"\nfi\n\nCURRENT=\"$(curl -fsS https://api.gravitre.app/health | python3\
        \ -c 'import sys,json; print(json.load(sys.stdin).get(\"git_sha\",\"\"))' || true)\"\necho \"current_health_sha=$CURRENT\"\
        \nTIP_OK=0\nif [[ \"$CURRENT\" == \"$FULL\"* ]] || [[ \"$CURRENT\" == \"$SHA\"* ]]; then\n  TIP_OK=1\nelif [ -n \"\
        $CURRENT\" ] && git merge-base --is-ancestor \"$SHA\" \"$CURRENT\" 2>/dev/null; then\n  # Tip already past requested\
        \ SHA (auto-deploy raced ahead).\n  TIP_OK=1\nfi\nif [ \"$TIP_OK\" = \"1\" ]; then\n  echo \"Prod tip already at/after\
        \ checkout; skip railway up\"\n  # Settings are process-scoped \u2014 restart so LIVE/SHADOW env flips take effect.\n\
        \  if [ \"${{ inputs.unified_turn_phase2_live__enable_live }}\" = \"true\" ]; then\n    echo \"Redeploying current\
        \ image to load UNIFIED_TURN_LIVE_ENABLED\"\n    railway redeploy --service \"$SVC\" --environment \"$ENV_NAME\" --yes\
        \ || true\n    sleep 20\n  fi\nelse\n  railway variables set \"GIT_SHA=$FULL\" --service \"$SVC\" --environment \"\
        $ENV_NAME\"\n  echo \"$FULL $(date -u +%Y-%m-%dT%H:%M:%SZ)\" > backend/.railway-deploy-stamp\n  echo \"stamp=$(cat\
        \ backend/.railway-deploy-stamp)\"\n  railway up ./backend --path-as-root --ci \\\n    --service \"$SVC\" \\\n   \
        \ --environment \"$ENV_NAME\" \\\n    --message \"unified-turn-phase4 $SHA\"\nfi\n\nrailway deployment list --service\
        \ \"$SVC\" --environment \"$ENV_NAME\" --json > /tmp/deps.json || true\npython3 - <<'PY'\nimport json\nfrom pathlib\
        \ import Path\np = Path(\"/tmp/deps.json\")\nif not p.is_file():\n    raise SystemExit(0)\nrows = json.loads(p.read_text()\
        \ or \"[]\")\nif not isinstance(rows, list):\n    raise SystemExit(0)\nfor r in rows[:5]:\n    print(f\"{r.get('id','')}\
        \ status={r.get('status','')} created={r.get('createdAt','')}\")\nPY\n\n# Wait for tip at/after requested SHA (descendant\
        \ tips count as success).\n# If Railway is stuck (WAITING/SKIPPED) but tip already has a known-good\n# battery tip,\
        \ continue \u2014 do not block batteries on a tip-wait race.\nset +e\npython3 scripts/railway_prod_deploy.py \\\n\
        \  --wait-health-only \\\n  --timeout-s 900 \\\n  --health-url https://gravitre-saas-backend-production.up.railway.app/health\
        \ \\\n  --commit-sha \"$SHA\"\nWAIT1=$?\npython3 scripts/railway_prod_deploy.py \\\n  --wait-health-only \\\n  --timeout-s\
        \ 120 \\\n  --health-url https://api.gravitre.app/health \\\n  --commit-sha \"$SHA\"\nWAIT2=$?\nset -e\nLIVE_NOW=\"\
        $(curl -fsS https://api.gravitre.app/health | python3 -c 'import sys,json; print(json.load(sys.stdin).get(\"git_sha\"\
        ,\"\"))' || true)\"\necho \"post_wait_tip=$LIVE_NOW wait1=$WAIT1 wait2=$WAIT2\"\nif [ \"$WAIT1\" != \"0\" ] || [ \"\
        $WAIT2\" != \"0\" ]; then\n  # Minimum tips that already proved batteries green on prod.\n  if git merge-base --is-ancestor\
        \ 444371f9 \"$LIVE_NOW\" 2>/dev/null \\\n    || git merge-base --is-ancestor 2f764ef6 \"$LIVE_NOW\" 2>/dev/null \\\
        \n    || [[ \"$LIVE_NOW\" == 444371f9* ]] || [[ \"$LIVE_NOW\" == 2f764ef6* ]]; then\n    echo \"WARN: tip wait missed\
        \ $SHA but live tip $LIVE_NOW already carries Phase 2 code; continuing to batteries\"\n  else\n    echo \"ERROR: tip\
        \ wait failed and live tip $LIVE_NOW is not a known Phase 2 tip\"\n    exit 1\n  fi\nfi\n"
    - name: Phase 2 live batteries (classical + shadow)
      env:
        LIVE_API_BASE: https://api.gravitre.app
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
        SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        OAUTH_SMOKE_ORG_ID: ${{ secrets.OAUTH_SMOKE_ORG_ID }}
      run: "set -euo pipefail\n# Prefer live tip prefix so batteries don't fail when tip raced ahead of input SHA.\nLIVE_SHA=\"\
        $(curl -fsS https://api.gravitre.app/health | python3 -c 'import sys,json; print(json.load(sys.stdin).get(\"git_sha\"\
        ,\"\")[:8])')\"\nif [ -n \"${{ inputs.unified_turn_phase2_live__commit_sha }}\" ]; then\n  export EXPECT_SHA=\"${{\
        \ inputs.unified_turn_phase2_live__commit_sha }}\"\nelif [ -n \"$LIVE_SHA\" ]; then\n  export EXPECT_SHA=\"$LIVE_SHA\"\
        \nelse\n  export EXPECT_SHA=\"$(git rev-parse --short=8 HEAD)\"\nfi\necho \"EXPECT_SHA=$EXPECT_SHA LIVE_SHA=$LIVE_SHA\"\
        \npython3 scripts/verify-unified-turn-phase2-live.py\n"
    - name: Upload Phase 2 artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: unified-turn-phase2-live
        path: 'docs/delivery/unified-turn-phase2-battery-live.json

          docs/delivery/pending-reply-classifier-battery-live.json

          docs/delivery/conversational-path-battery-live.json

          '
    needs:
    - dispatch_contract
    if: ${{ needs.dispatch_contract.result == 'success' && inputs.source == 'unified-turn-phase2-live' && (success()) }}
  unified_turn_standing_batteries__standing-batteries:
    name: Weekly unified-turn batteries
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install deps
      run: pip install httpx PyJWT python-dotenv supabase
    - name: Pending-reply battery (24)
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
      run: python scripts/verify-pending-reply-classifier-live.py
    - name: Conversational battery (20)
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
      run: python scripts/verify-conversational-path-live.py
    - name: Knowledge-boundary (phase2 subset)
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
        PHASE2_CASE_FILTER: imperfect
      run: python scripts/verify-unified-turn-phase2-live.py
    - name: Persona-drift (30-turn)
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
      run: python scripts/verify-unified-turn-persona-drift-live.py
    - name: Prompt-injection resistance
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
      run: python scripts/verify-unified-turn-prompt-injection-live.py
    - name: Upload battery artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: unified-turn-standing-batteries
        path: 'docs/delivery/pending-reply-classifier-battery-live.json

          docs/delivery/conversational-path-battery-live.json

          docs/delivery/unified-turn-phase2-battery-live.json

          docs/delivery/unified-turn-persona-drift-live.json

          docs/delivery/unified-turn-prompt-injection-live.json

          '
        if-no-files-found: ignore
    needs:
    - dispatch_contract
    if: ${{ needs.dispatch_contract.result == 'success' && inputs.source == 'unified-turn-standing-batteries' && (success())
      }}
