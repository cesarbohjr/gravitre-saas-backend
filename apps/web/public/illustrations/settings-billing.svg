<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 260" width="320" height="260" role="img" aria-label="A person checking a tablet beside a paid receipt with a green check stamp and a usage meter"><style>.g-float{animation:gfloat 5s ease-in-out infinite}.g-bob{animation:gfloat 3.6s ease-in-out infinite}@keyframes gfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}.g-twinkle{animation:gtw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes gtw{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}.g-spin{animation:gspin 16s linear infinite;transform-box:fill-box;transform-origin:center}.g-spin-rev{animation:gspin 9s linear infinite reverse;transform-box:fill-box;transform-origin:center}.g-hand{animation:gspin 4s linear infinite;transform-box:view-box;transform-origin:110px 66px}@keyframes gspin{to{transform:rotate(360deg)}}.g-pulse{animation:gpulse 2.6s ease-in-out infinite}@keyframes gpulse{0%,100%{opacity:1}50%{opacity:.45}}.g-beat{animation:gbeat 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes gbeat{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}.g-ring{animation:gring 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes gring{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(1.25)}}.g-flow{animation:gflow 1.6s linear infinite}@keyframes gflow{to{stroke-dashoffset:-24}}.g-grow{animation:ggrow 4.5s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}@keyframes ggrow{0%,100%{transform:scaleY(.9)}50%{transform:scaleY(1.05)}}.g-draw{stroke-dasharray:120;animation:gdraw 6s ease-in-out infinite}@keyframes gdraw{0%{stroke-dashoffset:120}35%,100%{stroke-dashoffset:0}}.g-steam{animation:gsteam 2.8s ease-in-out infinite}@keyframes gsteam{0%{opacity:0;transform:translateY(4px)}40%{opacity:.9}100%{opacity:0;transform:translateY(-6px)}}.g-run{animation:grun 6s linear infinite}@keyframes grun{0%{transform:translateX(0);opacity:0}8%{opacity:1}92%{opacity:1}100%{transform:translateX(252px);opacity:0}}.g-nudge{animation:gnudge 3.4s ease-in-out infinite}@keyframes gnudge{0%,100%{transform:translateX(0)}50%{transform:translateX(4px)}}.g-reach{animation:greach 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:0% 100%}@keyframes greach{0%,100%{transform:rotate(0)}50%{transform:rotate(-5deg)}}@media (prefers-reduced-motion: reduce){[class*="g-"]{animation:none!important}}</style><svg x="0" y="0" width="320" height="260" viewBox="0 0 320 260" preserveAspectRatio="xMidYMid slice"><defs><filter id="art-grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix values="0 0 0 0 0.15 0 0 0 0 0.13 0 0 0 0 0.1 0.9 0 0 0 -0.38"></feColorMatrix></filter></defs><rect width="320" height="260" fill="#DEDAD0"></rect><ellipse cx="160" cy="128" rx="130" ry="96" fill="#CFE2DE"></ellipse><g class="g-float"><path d="M150 46 H230 V196 L222 190 L214 196 L206 190 L198 196 L190 190 L182 196 L174 190 L166 196 L158 190 L150 196 Z" fill="#F7F4EC" stroke="#6B5B47" stroke-width="2.5" stroke-linejoin="round"></path><rect x="162" y="60" width="40" height="5" rx="2.5" fill="#6B5B47"></rect><path d="M162 80 h52" stroke="#CFC6B6" stroke-width="3" stroke-linecap="round" stroke-dasharray="120" class="g-draw" style="animation-delay: 0.0s"></path><rect x="208" y="78" width="12" height="3" rx="1.5" fill="#B5A58C"></rect><path d="M162 96 h40" stroke="#CFC6B6" stroke-width="3" stroke-linecap="round" stroke-dasharray="120" class="g-draw" style="animation-delay: 0.25s"></path><rect x="208" y="94" width="12" height="3" rx="1.5" fill="#B5A58C"></rect><path d="M162 112 h46" stroke="#CFC6B6" stroke-width="3" stroke-linecap="round" stroke-dasharray="120" class="g-draw" style="animation-delay: 0.5s"></path><rect x="208" y="110" width="12" height="3" rx="1.5" fill="#B5A58C"></rect><path d="M162 128