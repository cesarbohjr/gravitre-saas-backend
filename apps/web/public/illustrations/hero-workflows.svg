<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 260" width="320" height="260" role="img" aria-label="A person guiding work through a workflow pipeline to a green finish"><style>.g-float { animation: 5s ease-in-out 0s infinite normal none running gfloat; }.g-bob { animation: 3.6s ease-in-out 0s infinite normal none running gfloat; }.g-pulse { animation: 2.6s ease-in-out 0s infinite normal none running gpulse; }.g-flow { animation: 1.6s linear 0s infinite normal none running gflow; }.g-run { animation: 6s linear 0s infinite normal none running grun; }@keyframes gfloat { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-3px); } }@keyframes gflow { 100% { stroke-dashoffset: -24; } }@keyframes gpulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }@keyframes grun { 0% { transform: translateX(0px); opacity: 0; } 8% { opacity: 1; } 92% { opacity: 1; } 100% { transform: translateX(252px); opacity: 0; } }@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><svg x="0" y="0" width="320" height="260" viewBox="0 0 320 260" preserveAspectRatio="xMidYMid slice"><defs><filter id="art-grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix values="0 0 0 0 0.15 0 0 0 0 0.13 0 0 0 0 0.1 0.9 0 0 0 -0.38"></feColorMatrix></filter></defs><rect width="320" height="260" fill="#DEDAD0"></rect><ellipse cx="160" cy="128" rx="130" ry="96" fill="#CFE0D2"></ellipse><path d="M40 82 H262" stroke="#7C8F6B" stroke-width="2.5" stroke-dasharray="6 6" class="g-flow"></path><path d="M128 100 V128 H208 V100" stroke="#A9B79A" stroke-width="2" stroke-dasharray="4 5" fill="none" class="g-flow"></path><g class="g-float" style="animation-delay: 0s;"><rect x="38" y="64" width="44" height="36" rx="6" fill="#FBF8F1"></rect><rect x="44" y="72" width="10" height="10" rx="2" fill="#D9824B"></rect><rect x="58" y="74" width="20" height="3" rx="1.5" fill="#