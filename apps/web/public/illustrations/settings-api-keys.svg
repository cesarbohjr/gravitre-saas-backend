<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 260" width="320" height="260" role="img" aria-label="A brass key heading toward a plug that connects to a terminal window with lines of code"><style>.g-float{animation:gfloat 5s ease-in-out infinite}.g-bob{animation:gfloat 3.6s ease-in-out infinite}@keyframes gfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}.g-twinkle{animation:gtw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes gtw{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}.g-spin{animation:gspin 16s linear infinite;transform-box:fill-box;transform-origin:center}.g-spin-rev{animation:gspin 9s linear infinite reverse;transform-box:fill-box;transform-origin:center}.g-hand{animation:gspin 4s linear infinite;transform-box:view-box;transform-origin:110px 66px}@keyframes gspin{to{transform:rotate(360deg)}}.g-pulse{animation:gpulse 2.6s ease-in-out infinite}@keyframes gpulse{0%,100%{opacity:1}50%{opacity:.45}}.g-beat{animation:gbeat 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes gbeat{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}.g-ring{animation:gring 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes gring{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(1.25)}}.g-flow{animation:gflow 1.6s linear infinite}@keyframes gflow{to{stroke-dashoffset:-24}}.g-grow{animation:ggrow 4.5s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}@keyframes ggrow{0%,100%{transform:scaleY(.9)}50%{transform:scaleY(1.05)}}.g-draw{stroke-dasharray:120;animation:gdraw 6s ease-in-out infinite}@keyframes gdraw{0%{stroke-dashoffset:120}35%,100%{stroke-dashoffset:0}}.g-steam{animation:gsteam 2.8s ease-in-out infinite}@keyframes gsteam{0%{opacity:0;transform:translateY(4px)}40%{opacity:.9}100%{opacity:0;transform:translateY(-6px)}}.g-run{animation:grun 6s linear infinite}@keyframes grun{0%{transform:translateX(0);opacity:0}8%{opacity:1}92%{opacity:1}100%{transform:translateX(252px);opacity:0}}.g-nudge{animation:gnudge 3.4s ease-in-out infinite}@keyframes gnudge{0%,100%{transform:translateX(0)}50%{transform:translateX(4px)}}.g-reach{animation:greach 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:0% 100%}@keyframes greach{0%,100%{transform:rotate(0)}50%{transform:rotate(-5deg)}}@media (prefers-reduced-motion: reduce){[class*="g-"]{animation:none!important}}</style><svg x="0" y="0" width="320" height="260" viewBox="0 0 320 260" preserveAspectRatio="xMidYMid slice"><defs><filter id="art-grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix values="0 0 0 0 0.15 0 0 0 0 0.13 0 0 0 0 0.1 0.9 0 0 0 -0.38"></feColorMatrix></filter></defs><rect width="320" height="260" fill="#DEDAD0"></rect><ellipse cx="160" cy="128" rx="130" ry="96" fill="#E8DCE4"></ellipse><rect x="150" y="56" width="128" height="104" rx="8" fill="#26282C"></rect><rect x="150" y="56" width="128" height="18" rx="8" fill="#3A3D42"></rect><rect x="150" y="66" width="128" height="8" fill="#3A3D42"></rect><circle cx="162" cy="65" r="3" fill="#B5654A"></circle><circle cx="172" cy="65" r="3" fill="#C9A24B"></circle><circle cx="182" cy="65" r="3" fill="#7C8F6B"></circle><path d="M164 88 h70" stroke="#9FD3B4" stroke-width="4" stroke-linecap="round" stroke-dasharray="120" class="g-draw" style="animation-delay: 0.00s"></path><path d="M164 103 h52" stroke="#CFC6B6" stroke-width="4" stroke-linecap="round" stroke-dasharray="120" class="g-draw" style="animation-delay: 0.30s"></path><path d="M164 118 h84" stroke="#CFC6B6" stroke-width="4" stroke-linecap="round" stroke-dasharray="120" class="g-draw" style="animation-delay: 0.60s"></path><path d="M164 133 h40" stroke="#9FD3B4" stroke-width="4" stroke-linecap="round" stroke-dasharray="120" class="g-draw" style="animation-delay: 0.90s"></path><rect x="166" y="146" width="8" height="4" fill="#9FD3B4" class="g-pulse"></rect><rect x="132" y="170" width="44" height="30" rx="6" fill="#F7F4EC" stroke="#6B5B47" stroke-width="2.5"></rect><rect x="146" y="180" width="16" height="10" rx="2" fill="#6B5B47"></rect><path d="M154 170 V160" stroke="#6B5B47" stroke-width="2.5"></path><g class="g-nudge"><circle cx="72" cy="186" r="20" fill="#C9A24B"></circle><circle cx="72" cy="186" r="8" fill="#E8DCE4"></circle><rect x="90" y="182" width="44" height="8" rx="3" fill="#C9A24B"></rect><rect x="112" y="190" width="6" height="8" rx="1.5" fill="#C9A24B"></rect><rect x="122" y="190" width="6" height="11" rx="1.5" fill="#C9A24B"></rect></g><path d="M60 70 l2.6 6.4 6.4 2.6 -6.4 2.6 -2.6 6.4 -2.6 -6.4 -6.4 -2.6 6.4 -2.6z" fill="#C9A24B" class="g-twinkle"></path><g class="g-float"><rect x="56" y="104" width="62" height="24" rx="12" fill="#FBF8F1" stroke="#CFC6B6"></rect><text x="87" y="120" text-anchor="middle" font-size="11" font-family="Geist Mono, monospace" fill="#55564F">{ }</text></g><line x1="28" y1="214" x2="292" y2="214" stroke="#9C8C74" stroke-width="2"></line><rect width="320" height="260" filter="url(#art-grain)" opacity="0.55"></rect></svg></svg>