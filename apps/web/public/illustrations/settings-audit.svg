<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 260" width="320" height="260" role="img" aria-label="A clipboard ledger with a timeline of green events and one red event under a magnifying glass"><style>.g-float{animation:gfloat 5s ease-in-out infinite}.g-bob{animation:gfloat 3.6s ease-in-out infinite}@keyframes gfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}.g-twinkle{animation:gtw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes gtw{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}.g-spin{animation:gspin 16s linear infinite;transform-box:fill-box;transform-origin:center}.g-spin-rev{animation:gspin 9s linear infinite reverse;transform-box:fill-box;transform-origin:center}.g-hand{animation:gspin 4s linear infinite;transform-box:view-box;transform-origin:110px 66px}@keyframes gspin{to{transform:rotate(360deg)}}.g-pulse{animation:gpulse 2.6s ease-in-out infinite}@keyframes gpulse{0%,100%{opacity:1}50%{opacity:.45}}.g-beat{animation:gbeat 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes gbeat{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}.g-ring{animation:gring 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes gring{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(1.25)}}.g-flow{animation:gflow 1.6s linear infinite}@keyframes gflow{to{stroke-dashoffset:-24}}.g-grow{animation:ggrow 4.5s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}@keyframes ggrow{0%,100%{transform:scaleY(.9)}50%{transform:scaleY(1.05)}}.g-draw{stroke-dasharray:120;animation:gdraw 6s ease-in-out infinite}@keyframes gdraw{0%{stroke-dashoffset:120}35%,100%{stroke-dashoffset:0}}.g-steam{animation:gsteam 2.8s ease-in-out infinite}@keyframes gsteam{0%{opacity:0;transform:translateY(4px)}40%{opacity:.9}100%{opacity:0;transform:translateY(-6px)}}.g-run{animation:grun 6s linear infinite}@keyframes grun{0%{transform:translateX(0);opacity:0}8%{opacity:1}92%{opacity:1}100%{transform:translateX(252px);opacity:0}}.g-nudge{animation:gnudge 3.4s ease-in-out infinite}@keyframes gnudge{0%,100%{transform:translateX(0)}50%{transform:translateX(4px)}}.g-reach{animation:greach 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:0% 100%}@keyframes greach{0%,100%{transform:rotate(0)}50%{transform:rotate(-5deg)}}@media (prefers-reduced-motion: reduce){[class*="g-"]{animation:none!important}}</style><svg x="0" y="0" width="320" height="260" viewBox="0 0 320 260" preserveAspectRatio="xMidYMid slice"><defs><filter id="art-grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix values="0 0 0 0 0.15 0 0 0 0 0.13 0 0 0 0 0.1 0.9 0 0 0 -0.38"></feColorMatrix></filter></defs><rect width="320" height="260" fill="#DEDAD0"></rect><ellipse cx="160" cy="128" rx="130" ry="96" fill="#E2E6D2"></ellipse><rect x="98" y="44" width="124" height="160" rx="8" fill="#F7F4EC" stroke="#6B5B47" stroke-width="3"></rect><rect x="134" y="36" width="52" height="16" rx="5" fill="#6B5B47"></rect><line x1="120" y1="72" x2="120" y2="186" stroke="#CFC6B6" stroke-width="2"></line><circle cx="120" cy="74" r="6" fill="#2E9E5B"></circle><rect x="134" y="68" width="54" height="5" rx="2.5" fill="#B5A58C"></rect><rect x="134" y="77" width="72" height="4" rx="2" fill="#E2DACB"></rect><circle cx="120" cy="101" r="6" fill="#2E9E5B"></circle><rect x="134" y="95" width="50" height="5" rx="2.5" fill="#B5A58C"></rect><rect x="134" y="104" width="66" height="4" rx="2" fill="#E2DACB"></rect><circle cx="120" cy="128" r="6" fill="#A3333D" class="g-pulse"></circle><rect x="134" y="122" width="46" height="5" rx="2.5" fill="#B5A58C"></rect><rect x="134" y="131" width="60" height="4" rx="2" fill="#E2DACB"></rect><circle cx="120" cy="155" r="6" fill="#2E9E5B"></circle><rect x="134" y="149" width="42" height="5" rx="2.5" fill="#B5A58C"></rect><rect x="134" y="158" width="54" height="4" rx="2" fill="#E2DACB"></rect><circle cx="120" cy="182" r="6" fill="#2E9E5B"></circle><rect x="134" y="176" width="38" height="5" rx="2.5" fill="#B5A58C"></rect><rect x="134" y="185" width="48" height="4" rx="2" fill="#E2DACB"></rect><g class="g-nudge"><circle cx="214" cy="146" r="24" fill="#FBF8F1" fill-opacity=".55" stroke="#26282C" stroke-width="5"></circle><line x1="231" y1="163" x2="252" y2="184" stroke="#26282C" stroke-width="8" stroke-linecap="round"></line></g><g class="g-float"><rect x="236" y="62" width="44" height="54" rx="4" fill="#FBF8F1" stroke="#CFC6B6"></rect><path d="M246 76 h24 M246 86 h18 M246 96 h22" stroke="#CFC6B6" stroke-width="3" stroke-linecap="round"></path><rect x="244" y="104" width="14" height="6" rx="2" fill="#4A6A8E"></rect></g><g class="g-float" style="animation-delay: -1.3s"><rect x="40" y="86" width="40" height="50" rx="4" fill="#FBF8F1" stroke="#CFC6B6"></rect><path d="M48 98 h22 M48 108 h16 M48 118 h20" stroke="#CFC6B6" stroke-width="3" stroke-linecap="round"></path></g><rect x="47" y="196" width="18" height="18" rx="2" fill="#B5654A"></rect><path d="M56 196 C 54 180 48 172 44 166" stroke="#5E7A5C" stroke-width="2" fill="none"></path><path d="M44 166 C 34 160 42 176 52 180 Z" fill="#7C8F6B" class="g-bob"></path><path d="M56 196 C 60 182 70 174 72 170 Z" fill="#5E7A5C"></path><line x1="28" y1="214" x2="292" y2="214" stroke="#9C8C74" stroke-width="2"></line><rect width="320" height="260" filter="url(#art-grain)" opacity="0.55"></rect></svg></svg>