  <text x="45" y="110" font-family="DM Sans,system-ui" font-size="8" fill="#5B6E7A" font-weight="600" text-anchor="middle">Guides</text>
</g></g>


<line x1="114" y1="100" x2="185" y2="140" stroke="#C98F5B" stroke-width="1.2" stroke-dasharray="4,3" opacity="0.4" />
