  <rect x="323" y="150" width="60" height="64" rx="6" fill="#FBF8F2" stroke="#D9D1C2" stroke-width="1.2" opacity="0.7" />
  <rect x="331" y="160" width="12" height="12" rx="3" fill="#DDD9D0" />
