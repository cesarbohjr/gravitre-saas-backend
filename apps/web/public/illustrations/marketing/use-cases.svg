<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300">
<style>@keyframes gi-drift-y { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
@keyframes gi-drift-x { 0%,100%{transform:translateX(0)} 50%{transform:translateX(5px)} }
@keyframes gi-pulse-op { 0%,100%{opacity:1} 50%{opacity:0.55} }
@keyframes gi-stamp-in { 0%{transform:scale(1.4);opacity:0} 15%{transform:scale(0.9);opacity:1} 25%{transform:scale(1)} 100%{transform:scale(1)} }
@keyframes gi-slide-right { 0%{transform:translateX(-18px);opacity:0} 20%{transform:translateX(0);opacity:1} 80%{transform:translateX(0);opacity:1} 100%{transform:translateX(18px);opacity:0} }
@keyframes gi-travel-line { 0%{stroke-dashoffset:60} 100%{stroke-dashoffset:0} }
@keyframes gi-bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }
@keyframes gi-fade-cycle { 0%,15%{opacity:0} 25%,75%{opacity:1} 85%,100%{opacity:0} }
@keyframes gi-grow-bar { from{transform:scaleY(0)} to{transform:scaleY(1)} }
@keyframes gi-rise-bar { 0%,100%{transform:scaleY(0.4)} 50%{transform:scaleY(1)} }
@keyframes gi-spin-slow { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
@keyframes gi-blink { 0%,90%,100%{opacity:1} 95%{opacity:0} }


[style*="gi-stamp-in"],[style*="gi-grow-bar"],[style*="gi-rise-bar"]{transform-box:fill-box;transform-origin:center}
[style*="gi-grow-bar"],[style*="gi-rise-bar"]{transform-origin:center bottom}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><defs>
  <filter id="grain1"><feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" /><feColorMatrix type="saturate" values="0" /><feBlend in="SourceGraphic" mode="overlay" result="b" /><feComposite in="b" in2="SourceGraphic" operator="in" /></filter>
  <radialGradient id="blob1a" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#CFDCCB" stop-opacity="0.7" /><stop offset="100%" stop-color="#CFDCCB" stop-opacity="0" /></radialGradient>
  <radialGradient id="blob1b" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#EBDCC0" stop-opacity="0.6" /><stop offset="100%" stop-color="#EBDCC0" stop-opacity="0" /></radialGradient>
  <pattern id="dots1" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="0.8" fill="#2A2B28" opacity="0.12" /></pattern>
  <marker id="arrow1" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#19C37D" /></marker>
  <marker id="arrow1r" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto-start-reverse"><path d="M0,0 L6,3 L0,6 Z" fill="#7E9A7B" /></marker>
</defs>

<rect width="960" height="300" fill="#E7ECE3" />
<ellipse cx="200" cy="150" rx="180" ry="130" fill="url(#blob1a)" />
<ellipse cx="780" cy="160" rx="200" ry="140" fill="url(#blob1b)" />
<rect x="700" y="0" width="260" height="300" fill="url(#dots1)" opacity="0.5" />


<g transform="translate(480,150)">
