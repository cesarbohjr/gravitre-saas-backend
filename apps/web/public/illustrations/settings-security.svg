<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 260" width="320" height="260" role="img" aria-label="A shield with a green padlock inside a dashed ring, surrounded by a sign in code, a globe and a clock"><style>.g-float{animation:gfloat 5s ease-in-out infinite}.g-bob{animation:gfloat 3.6s ease-in-out infinite}@keyframes gfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}.g-twinkle{animation:gtw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes gtw{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}.g-spin{animation:gspin 16s linear infinite;transform-box:fill-box;transform-origin:center}.g-spin-rev{animation:gspin 9s linear infinite reverse;transform-box:fill-box;transform-origin:center}.g-hand{animation:gspin 4s linear infinite;transform-box:view-box;transform-origin:110px 66px}@keyframes gspin{to{transform:rotate(360deg)}}.g-pulse{animation:gpulse 2.6s ease-in-out infinite}@keyframes gpulse{0%,100%{opacity:1}50%{opacity:.45}}.g-beat{animation:gbeat 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes gbeat{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}.g-ring{animation:gring 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes gring{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(1.25)}}.g-flow{animation:gflow 1.6s linear infinite}@keyframes gflow{to{stroke-dashoffset:-24}}.g-grow{animation:ggrow 4.5s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}@keyframes ggrow{0%,100%{transform:scaleY(.9)}50%{transform:scaleY(1.05)}}.g-draw{stroke-dasharray:120;animation:gdraw 6s ease-in-out infinite}@keyframes gdraw{0%{stroke-dashoffset:120}35%,100%{stroke-dashoffset:0}}.g-steam{animation:gsteam 2.8s ease-in-out infinite}@keyframes gsteam{0%{opacity:0;transform:translateY(4px)}40%{opacity:.9}100%{opacity:0;transform:translateY(-6px)}}.g-run{animation:grun 6s linear infinite}@keyframes grun{0%{transform:translateX(0);opacity:0}8%{opacity:1}92%{opacity:1}100%{transform:translateX(252px);opacity:0}}.g-nudge{animation:gnudge 3.4s ease-in-out infinite}@keyframes gnudge{0%,100%{transform:translateX(0)}50%{transform:translateX(4px)}}.g-reach{animation:greach 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:0% 100%}@keyframes greach{0%,100%{transform:rotate(0)}50%{transform:rotate(-5deg)}}@media (prefers-reduced-motion: reduce){[class*="g-"]{animation:none!important}}</style><svg x="0" y="0" width="320" height="260" viewBox="0 0 320 260" preserveAspectRatio="xMidYMid slice"><defs><filter id="art-grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix values="0 0 0 0 0.15 0 0 0 0 0.13 0 0 0 0 0.1 0.9 0 0 0 -0.38"></feColorMatrix></filter></defs><rect width="320" height="260" fill="#DEDAD0"></rect><ellipse cx="160" cy="128" rx="130" ry="96" fill="#D6E2E8"></ellipse><circle cx="160" cy="124" r="78" fill="none" stroke="#9C8C74" stroke-width="1.6" stroke-dasharray="4 7" class="g-flow"></circle><path d="M160 52 L214 72 V118 C214 156 190 180 160 194 C130 180 106 156 106 118 V72 Z" fill="#F7F4EC" stroke="#6B5B47" stroke-width="3" stroke-linejoin="round"></path><path d="M160 64 L204 80 V118 C204 150 184 170 160 182 Z" fill="#E9E2D3"></path><path d="M146 118 V106 a14 14 0 0 1 28 0 V118" stroke="#26282C" stroke-width="5" fill="none" stroke-linecap="round"></path><rect x="138" y="116" width="44" height="36" rx="6" fill="#2E9E5B"></rect><circle cx="160" cy="131" r="5" fill="#F7F4EC"></circle><rect x="158" y="133" width="4" height="10" rx="2" fill="#F7F4EC"></rect><g class="g-float"><rect x="40" y="68" width="50" height="30" rx="7" fill="#FBF8F1" stroke="#CFC6B6"></rect><circle cx="52" cy="83" r="3.4" fill="#26282C" class="g-twinkle" style="animation-delay: -0.0s"></circle><circle cx="61" cy="83" r="3.4" fill="#26282C" class="g-twinkle" style="animation-delay: -0.4s"></circle><circle cx="70" cy="83" r="3.4" fill="#26282C" class="g-twinkle" style="animation-delay: -0.8s"></circle><circle cx="79" cy="83" r="3.4" fill="#26282C" class="g-twinkle" style="animation-delay: -1.2s"></circle></g><g class="g-float" style="animation-delay: -1.6s"><circle cx="252" cy="78" r="18" fill="#FBF8F1" stroke="#CFC6B6"></circle><circle cx="252" cy="78" r="11" fill="none" stroke="#4A6A8E" stroke-width="2"></circle><path d="M241 78 h22 M252 67 c5 5 5 17 0 22 c-5 -5 -5 -17 0 -22" stroke="#4A6A8E" stroke-width="1.8" fill="none"></path></g><g class="g-float" style="animation-delay: -0.8s"><circle cx="258" cy="168" r="17" fill="#FBF8F1" stroke="#CFC6B6"></circle><circle cx="258" cy="168" r="10" fill="none" stroke="#B5654A" stroke-width="2"></circle><g class="g-spin" style="transform-origin: 258px 168px"><line x1="258" y1="168" x2="258" y2="161" stroke="#B5654A" stroke-width="2" stroke-linecap="round"></line></g></g><g class="g-beat" style="transform-origin: 66px 166px"><circle cx="66" cy="166" r="13" fill="#2E9E5B"></circle><path d="M60 166 l4 4 l8 -9" stroke="#FFFFFF" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></g><line x1="28" y1="214" x2="292" y2="214" stroke="#9C8C74" stroke-width="2"></line><rect width="320" height="260" filter="url(#art-grain)" opacity="0.55"></rect></svg></svg>