<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="640" height="220" role="img" aria-label="A calm workspace: a tidy desk with a monitor, lamp, books and a plant, a calendar on the wall and a clock ticking by the window">
<style>@keyframes gspin{to{transform:rotate(360deg)}}
@keyframes gsteam{0%{opacity:0;transform:translateY(3px)}40%{opacity:.85}100%{opacity:0;transform:translateY(-7px)}}
@keyframes gsway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes gpulse{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes gdrift{0%,100%{transform:translateX(0)}50%{transform:translateX(9px)}}
@keyframes gglow{0%,100%{opacity:.18}50%{opacity:.4}}
@keyframes gtype{0%,100%{opacity:.25}50%{opacity:.9}}
.g-min{animation:gspin 14s linear infinite;transform-box:view-box;transform-origin:560px 57px}
.g-hour{animation:gspin 168s linear infinite;transform-box:view-box;transform-origin:560px 57px}
.g-steam{animation:gsteam 3.2s ease-out infinite;transform-box:fill-box}
.g-steam2{animation:gsteam 3.2s ease-out 1.6s infinite;transform-box:fill-box}
.g-sway{animation:gsway 5s ease-in-out infinite;transform-box:view-box;transform-origin:492px 143px}
.g-pulse{animation:gpulse 2.4s ease-in-out infinite}
.g-drift{animation:gdrift 9s ease-in-out infinite}
.g-glow{animation:gglow 3.6s ease-in-out infinite}
.g-type{animation:gtype 1.8s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){[class*="g-"]{animation:none!important}}</style>
<defs>
<linearGradient id="bg-warm" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#D2DECA"/><stop offset=".28" stop-color="#E8E0C8"/><stop offset=".55" stop-color="#EFDCBE"/><stop offset="1" stop-color="#EBDDC6"/></linearGradient>
<radialGradient id="bg-cool" cx="1" cy="0" r=".5" gradientTransform="scale(1 2.9)"><stop offset="0" stop-color="#D9E1EA" stop-opacity=".95"/><stop offset="1" stop-color="#D9E1EA" stop-opacity="0"/></radialGradient>
<radialGradient id="bg-sage" cx="0" cy=".9" r=".35" gradientTransform="scale(1 2.9)"><stop offset="0" stop-color="#D5E2D6" stop-opacity=".9"/><stop offset="1" stop-color="#D5E2D6" stop-opacity="0"/></radialGradient>
<radialGradient id="bg-light" cx=".5" cy="0" r=".4" gradientTransform="translate(0 0) scale(1 2.9)"><stop offset="0" stop-color="#F6F3E6" stop-opacity=".75"/><stop offset="1" stop-color="#F6F3E6" stop-opacity="0"/></radialGradient>
<pattern id="bg-dots" width="19" height="19" patternUnits="userSpaceOnUse"><circle cx="9.5" cy="9.5" r="1.7" fill="#A3A098" fill-opacity=".6"/></pattern>
<linearGradient id="bg-dot-fade" x1="0" y1="0" x2="1" y2="0"><stop offset=".3" stop-color="#fff" stop-opacity="0"/><stop offset=".62" stop-color="#fff" stop-opacity=".7"/><stop offset="1" stop-color="#fff" stop-opacity="1"/></linearGradient>
<mask id="bg-dot-mask"><rect width="640" height="220" fill="url(#bg-dot-fade)"/></mask>
<filter id="art-grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 0.15 0 0 0 0 0.13 0 0 0 0 0.1 0.9 0 0 0 -0.38"/></filter>
<clipPath id="win"><rect x="234" y="30" width="102" height="60"/></clipPath>
</defs>
<rect width="640" height="220" fill="url(#bg-warm)"/>
<rect width="640" height="220" fill="url(#bg-cool)"/>
<rect width="640" height="220" fill="url(#bg-sage)"/>
<rect width="640" height="220" fill="url(#bg-light)"/>
<rect width="640" height="220" fill="url(#bg-dots)" mask="url(#bg-dot-mask)"/>
<!-- window -->
<rect x="231" y="27" width="108" height="66" rx="2" fill="#EAE5DA"/>
<g clip-path="url(#win)"><rect x="234" y="30" width="102" height="60" fill="#D6DEE6"/>
<g class="g-drift"><ellipse cx="258" cy="44" rx="11" ry="3.5" fill="#F2F4F5" opacity=".9"/><ellipse cx="305" cy="38" rx="8" ry="2.6" fill="#F2F4F5" opacity=".8"/></g>
<path d="M234 84 Q256 70 280 84 Z" fill="#BFC9A8"/><path d="M282 84 Q298 74 314 84 Z" fill="#BFC9A8"/></g>
<rect x="283" y="30" width="3" height="60" fill="#EAE5DA"/><rect x="234" y="58" width="102" height="3" fill="#EAE5DA"/>
<!-- calendar -->
<rect x="62" y="35" width="3" height="10" rx="1.5" fill="#2E2B28"/><rect x="88" y="35" width="3" height="10" rx="1.5" fill="#2E2B28"/>
<rect x="52" y="40" width="50" height="46" rx="4" fill="#F7F3EA"/><path d="M52 44 a4 4 0 0 1 4-4 h42 a4 4 0 0 1 4 4 v7 h-50 z" fill="#B85C44"/>
<g fill="#EAD9BF"><rect x="58" y="57" width="7" height="5" rx="1"/><rect x="69" y="57" width="7" height="5" rx="1"/><rect x="80" y="57" width="7" height="5" rx="1"/><rect x="91" y="57" width="7" height="5" rx="1"/>
<rect x="58" y="66" width="7" height="5" rx="1"/><rect x="69" y="66" width="7" height="5" rx="1"/><rect x="91" y="66" width="7" height="5" rx="1"/>
<rect x="58" y="75" width="7" height="5" rx="1"/><rect x="69" y="75" width="7" height="5" rx="1"/><rect x="80" y="75" width="7" height="5" rx="1"/><rect x="91" y="75" width="7" height="5" rx="1"/></g>
<rect class="g-pulse" x="80" y="66" width="7" height="5" rx="1" fill="#19C37D"/>
<!-- clock -->
<circle cx="560" cy="57" r="18" fill="#F7F3EA" stroke="#2E2B28" stroke-width="3"/>
<line class="g-hour" x1="560" y1="57" x2="567" y2="61" stroke="#2E2B28" stroke-width="2.6" stroke-linecap="round"/>
<line class="g-min" x1="560" y1="57" x2="560" y2="45" stroke="#2E2B28" stroke-width="2.2" stroke-linecap="round"/>
<circle cx="560" cy="57" r="1.6" fill="#2E2B28"/>
<!-- floor -->
<line x1="20" y1="200" x2="620" y2="200" stroke="#B5A58A" stroke-width="1.4"/>
<!-- lamp -->
<path class="g-glow" d="M170 116 L150 152 L196 152 Z" fill="#F4D9A6"/>
<rect x="143" y="150" width="15" height="3" rx="1.5" fill="#2E2B28"/>
<path d="M150 151 L153 124 L163 113" fill="none" stroke="#2E2B28" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M162 105 L176 111 L168 118 Z" fill="#C98A4B"/>
<!-- desk -->
<rect x="120" y="153" width="400" height="5" rx="2" fill="#C48A52"/>
<rect x="125.5" y="158" width="3" height="42" fill="#B07A47"/><rect x="510.5" y="158" width="3" height="42" fill="#B07A47"/>
<!-- chair -->
<rect x="192" y="100" width="10" height="40" rx="5" fill="#2E2B28"/>
<path d="M199 139 L200 159" stroke="#2E2B28" stroke-width="2.4"/>
<rect x="196" y="158" width="36" height="3.4" rx="1.7" fill="#2E2B28"/>
<path d="M214 161 L214 190 M214 190 L198 200 M214 190 L230 200" stroke="#2E2B28" stroke-width="2.2" stroke-linecap="round" fill="none"/>
<!-- monitor -->
<rect x="250" y="108" width="58" height="36" rx="3" fill="#2E2B28"/>
<rect x="253" y="111" width="52" height="30" rx="1.5" fill="#5A6A78"/>
<g class="g-type" fill="#8FA3B3"><rect x="258" y="117" width="22" height="2" rx="1"/><rect x="258" y="122" width="34" height="2" rx="1"/><rect x="258" y="127" width="16" height="2" rx="1"/></g>
<rect x="277.5" y="144" width="3" height="7" fill="#2E2B28"/><rect x="270" y="150" width="18" height="3" rx="1.5" fill="#2E2B28"/>
<!-- keyboard -->
<g transform="rotate(7 336 148)"><rect x="320" y="143" width="33" height="8" rx="2" fill="#F5F2EA" stroke="#D9D3C6" stroke-width=".8"/></g>
<rect x="326" y="155" width="18" height="2.4" rx="1.2" fill="#D9D3C6"/>
<!-- books -->
<rect x="403" y="126" width="25" height="7" rx="1.5" fill="#B85C44"/>
<rect x="400" y="133" width="28" height="7" rx="1.5" fill="#4F6B85"/>
<rect x="403" y="140" width="31" height="7" rx="1.5" fill="#C98A4B"/>
<rect x="400" y="147" width="34" height="6" rx="1.5" fill="#6F9A75"/>
<!-- mug -->
<path class="g-steam" d="M453 140 q-2 -3 0 -6" stroke="#9C8C74" stroke-width="1.1" fill="none" stroke-linecap="round"/>
<path class="g-steam2" d="M457 140 q-2 -3 0 -6" stroke="#9C8C74" stroke-width="1.1" fill="none" stroke-linecap="round"/>
<rect x="451" y="143" width="10" height="10" rx="2" fill="#F5F2EA"/><path d="M461 146 a3 3 0 0 1 0 5" stroke="#F5F2EA" stroke-width="1.6" fill="none"/>
<!-- plant -->
<g class="g-sway"><path d="M492 143 L492 126" stroke="#5E7F62" stroke-width="1.6"/>
<path d="M492 133 Q481 126 480 134 Q486 138 492 135 Z" fill="#6F9A75"/><path d="M492 135 Q503 127 504 135 Q498 140 492 137 Z" fill="#6F9A75"/><path d="M492 127 Q488 120 492 113 Q496 120 492 127 Z" fill="#7FA584"/></g>
<path d="M486 143 h12 l-1.5 10 h-9 z" fill="#2E2B28"/>
<rect width="640" height="220" filter="url(#art-grain)" opacity="0.55"/>
</svg>
